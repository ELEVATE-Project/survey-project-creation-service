version: '3.9'
services:
  zookeeper:
    image: 'zookeeper:3.8.0'
    container_name: zookeeper
    ports:
      - '2181:2181'
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181
      JVMFLAGS: "-XX:-UseContainerSupport -Xmx512m -Xms256m"
    # - ALLOW_ANONYMOUS_LOGIN=yes
    # - ZOOKEEPER_CLIENT_PORT=2181
    networks:
      - elevate_net
    logging:
      driver: none

  kafka:
    image: 'confluentinc/cp-kafka:7.3.0'
    container_name: kafka
    ports:
      - '9092:9092'
    command: >
      bash -c '
        (
          until nc -z zookeeper 2181; do
            sleep 1; 
          done;
          export KAFKA_JVM_PERFORMANCE_OPTS="-XX:-UseContainerSupport -Xmx1G -Xms1G";
          /etc/confluent/docker/run
        ) &> /dev/null
      '
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKAJS_NO_PARTITIONER_WARNING: 1
    depends_on:
      - zookeeper
    networks:
      - elevate_net
    logging:
      driver: none

  redis:
    image: 'redis:7.0.0'
    container_name: redis
    restart: 'always'
    ports:
      - '6379:6379'
    networks:
      - elevate_net
    logging:
      driver: none

  postgres:
    # image: 'postgres:latest'
    image: citusdata/citus:latest
    container_name: postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - elevate_net
    logging:
      driver: none

  scheduler:
    image: shikshalokamqa/elevate-scheduler:3.1
    container_name: scheduler
    ports:
      - '4000:4000'
    command: ['nodemon', 'app.js']
    environment:
      - KAFKA_URL=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - kafka
      - redis
    networks:
      - elevate_net
    env_file:
      - integration_test.scheduler.env

  user:
    build: '../../user/'
    container_name: user
    ports:
      - '3001:3001'
    command: >
      bash -c '
        echo "Waiting for PostgreSQL to accept connections..." &&
        until timeout 1 bash -c "</dev/tcp/postgres/5432" >/dev/null 2>&1; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 1
        done &&

        if psql -U postgres -h postgres -lqt | cut -d \| -f 1 | grep -qw integration_test_user; then
          echo "DB exists. Running migrate and seed...";
          npm run db:migrate &&
          npm run db:seed:all
        else
          echo "DB does not exist. Running init...";
          npm run db:init && npm run db:seed:all
        fi &&

        (echo "Running User" && nodemon app.js &) &&
        tail -f /dev/null
      '
  
    depends_on:
      - kafka
      - redis
      - postgres
      - scheduler
    environment:
      - DEV_DATABASE_URL=postgres://postgres:postgres@postgres:5432/integration_test_user
      - KAFKA_URL=kafka:9092
      - REDIS_HOST=redis://redis:6379
    networks:
      - elevate_net
    env_file:
      - integration_test.user.env

  scp:
    build: '../../survey-project-creation-service/'
    container_name: scp
    ports:
      - '6001:6001'
    volumes:
      - ../../survey-project-creation-service/src:/var/src
    command: >
      bash -c '
        echo "Waiting for User service to accept connections...";
        until nc -z user 3001; do
          echo "Waiting for User service to be ready...";
          sleep 1;
        done &&
        echo "User service is ready.";

        echo "Waiting for PostgreSQL to accept connections...";
        until nc -z postgres 5432; do
          echo "Waiting for PostgreSQL to be ready...";
          sleep 1;
        done &&
        echo "PostgreSQL is ready.";

        if psql -U postgres -h postgres -lqt | cut -d \| -f 1 | grep -qw integration_test_scp; then
          echo "DB exists. Running migrate and seed...";
          npm run db:migrate &&
          npm run db:seed:all
        else
          echo "DB does not exist. Running init...";
          npm run db:init
        fi

        (echo "Running User" && nodemon app.js &) &&
        (/bin/bash -c "cd scripts && echo Running scp service scripts && node addDefaultEntitiesForEducationSector.js") &&
        tail -f /dev/null
      '
    environment:
      - DEV_DATABASE_URL=postgres://postgres:postgres@postgres:5432/integration_test_scp
      - KAFKA_URL=kafka:9092
      - REDIS_HOST=redis://redis:6379
    depends_on:
      - kafka
      - redis
      - postgres
      - user
    networks:
      - elevate_net
    env_file:
      - integration_test.self_creation_portal.env

networks:
  elevate_net:
    external: false

