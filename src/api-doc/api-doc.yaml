  /scp/v1/programs/update/{id}:
    post:
      summary: Create or Update Program
      tags:
        - Programs
      description: |-
        **Overview**:
        - Creates a new program or updates an existing program by ID
        - Supports duplicating published programs via reference_id parameter
        - Validates resource status and stage for reference program (must be PUBLISHED and COMPLETION)
        - Supports adding/updating/removing resources within the program
        - Uploads program data including targeting criteria to cloud storage
        - Automatically sets review_type based on organization configuration
        - Applies organization visibility policy (CURRENT, ASSOCIATED, ALL) for resource access
        - Returns program ID upon successful creation/update

        **Validation Rules**:
        - `title` is required for create/update (string, cannot exceed max title length)
        - `id` must be a valid integer (1 to 2147483647) for update operations
        - `reference_id` must be a valid published program ID in COMPLETION stage (if duplicating)
        - Program cannot be updated if in REJECTED, REJECTED_AND_REPORTED, SUBMITTED, or INPROGRESS status
        - Program in REVIEW stage can only be updated if reviewer requested changes
        - Resources can be added, updated, or removed during program update
        - `start_date` and `end_date` are optional date fields
        - `targeting_criteria` is optional array with state, entity_targeting, roles, districts, This can be cofigurable
        - `viewers` is optional array of user IDs (integers)
