                          type: integer
                          description: 'Configuration ID'
                        organization_code:
                          type: string
                          description: 'Organization code'
                        tenant_code:
                          type: string
                          description: 'Tenant code'
                        resource_type:
                          type: string
                          description: 'Resource type'
                        show_reviewer_list:
                          type: boolean
                          description: 'Show reviewer list flag'
                        min_approval:
                          type: integer
                          description: 'Minimum approvals required'
                        review_type:
                          type: string
                          description: 'Review workflow type'
                        created_at:
                          type: string
                          format: date-time
                          description: 'Creation timestamp'
                        updated_at:
                          type: string
                          format: date-time
                          description: 'Last update timestamp'
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            type:
                              type: string
