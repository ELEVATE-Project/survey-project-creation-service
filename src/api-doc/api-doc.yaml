  '/scp/v1/entity-types/delete/{id}':
    delete:
      summary: Delete entity type (Soft Delete)
      tags:
        - Entity Types
      operationId: deleteEntityType
      description: |-
        Soft deletes an entity type from the system. The record is marked as deleted but preserved in the database for audit and compliance.

        **Business Rules**:
        - Entity type ID must exist in the system
        - Entity type must belong to user's organization
        - Soft deletion is permanent (cannot be undone through API)

        **Important Notes**:
        - Cascading soft delete: All related Entity and EntityModelMapping records are soft-deleted
        - Use with caution in production environments
        - Deletion is logged with audit trail for compliance and security
        - Deleted entity type will not appear in list/read operations
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Valid entity type ID to soft delete (numeric, positive integer, 1 to 2147483647)'
          required: true
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 2
      responses:
        '202':
          description: 'Entity type deleted successfully (Soft delete accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: ENTITY_TYPE_DELETED_SUCCESSFULLY
