  '/scp/v1/form/update/{formId}':
    post:
      operationId: formUpdate
      summary: Update Form
      tags:
        - Form
      description: |-
        This API updates an existing form template with new field definitions, validators, and configuration. Used by administrators to modify form structures including adding/removing controls, changing validation rules, and updating UI properties. Forms are scoped to organization and tenant, and updates increment the form version for tracking changes. The API validates form existence and organization/tenant access before applying updates.

        **Validations**:
        - `formId` is required and must be a valid positive integer (1 to 2147483647)
        - Form must exist in the system and belong to authenticated user's organization/tenant
        - `type` and `sub_type` are required if provided
        - `data` object required with `template_name` and `fields` properties

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Required for all requests. Token provides organization_code and tenant_code context.'
          required: true
          schema:
            type: string
        - in: path
          name: formId
          description: 'Valid form ID to update (numeric, positive integer, 1 to 2147483647, must exist in system)'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          required: true
          example: 16
      requestBody:
        description: 'Form update object with type, sub_type, and updated form data with field controls and validators'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: 'The form type (e.g., project, program, survey). Used to categorize forms for different resource types.'
                  example: 'project'
                sub_type:
                  type: string
                  description: 'The form sub-type or category (e.g., createProject, updateProject). Provides additional classification within form type.'
                  example: 'createProject'
                data:
                  type: object
                  description: 'The main form structure containing template configuration and field definitions'
                  properties:
                    template_name:
                      type: string
                      description: 'Descriptive name for the form template (e.g., "Project Creation Template")'
                      example: 'Project Creation Template'
                    fields:
                      type: object
                      description: 'Object containing controls array with all form field definitions'

            examples:
              example1:
