  /scp/v1/organization-extensions/createConfig:
    post:
      summary: Create Organization Configuration
      tags:
        - Organization
      description: |-
        **Overview**:
        - Creates organization-specific configuration for resource management
        - Configures review settings (min approvals, review type, review stages)
        - Manages data managers and program managers roles
        - Supports both PARALLEL and SEQUENTIAL review workflows
        - For SEQUENTIAL review, creates review stages with role hierarchy
        - Scoped to user's organization and tenant

        **Validation Rules**:
        - `resource_type` is required (must be one of configured RESOURCE_TYPES)
        - `data_managers` is optional (comma-separated list of alphabetic role names)
        - `program_managers` is optional (comma-separated list of alphabetic role names)
        - `review_type` must be PARALLEL or SEQUENTIAL
        - For SEQUENTIAL review, `review_stages` array is required with role and level properties
        - Each review stage must have unique role and level combination
        - Configuration is unique per organization, tenant, and resource_type
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains organization_code and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resource_type:
                  type: string
                  description: 'Type of resource (required, must be valid RESOURCE_TYPE)'
                show_reviewer_list:
                  type: boolean
                  description: 'Whether to show reviewer list to creators'
                min_approval:
                  type: integer
                  description: 'Minimum number of approvals required for resource publication'
                review_type:
                  type: string
                  enum: [PARALLEL, SEQUENTIAL]
                  description: 'Review workflow type'
                review_stages:
                  type: array
                  description: 'Required for SEQUENTIAL review type - defines role hierarchy'
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        description: 'Reviewer role name'
                      level:
                        type: integer
                        description: 'Review stage level (hierarchy)'
                data_managers:
                  type: string
                  description: 'Optional comma-separated list of data manager role names'
                program_managers:
                  type: string
                  description: 'Optional comma-separated list of program manager role names'
            examples:
              parallel_review:
                value:
                  resource_type: project
                  show_reviewer_list: true
                  min_approval: 2
                  review_type: PARALLEL
                  data_managers: 'data_admin,data_manager'
              sequential_review:
                value:
                  resource_type: project
                  show_reviewer_list: true
                  min_approval: 2
                  review_type: SEQUENTIAL
                  review_stages:
                    - role: reviewer_level_1
                      level: 1
                    - role: reviewer_level_2
                      level: 2
                  program_managers: 'program_admin,program_lead'
      responses:
        '201':
          description: 'Config added successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Config added successfully'
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: 'Configuration ID'
                      organization_code:
                        type: string
                        description: 'Organization code'
                      tenant_code:
                        type: string
                        description: 'Tenant code'
                      resource_type:
                        type: string
                        description: 'Resource type'
                      show_reviewer_list:
                        type: boolean
                        description: 'Show reviewer list flag'
                      min_approval:
                        type: integer
                        description: 'Minimum approvals required'
                      review_type:
                        type: string
                        description: 'Review workflow type'
                      created_at:
                        type: string
                        format: date-time
                        description: 'Creation timestamp'
                      updated_at:
                        type: string
                        format: date-time
                        description: 'Last update timestamp'
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            type:
                              type: string
                            version:
                              type: integer
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: 'Config added successfully'
                    result:
                      id: 1
                      organization_code: default_code
                      tenant_code: default_tenant
                      resource_type: project
                      show_reviewer_list: true
                      min_approval: 2
                      review_type: PARALLEL
                      created_at: '2024-11-11T10:00:00.000Z'
                      updated_at: '2024-11-11T10:00:00.000Z'
                    meta:
                      formsVersion:
                        - id: 3
                          type: projectCreation
                          version: 3
        '400':
          description: 'Bad Request - Invalid resource type, review stages, or duplicate configuration'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createConfig400Response'
  '/scp/v1/organization-extensions/updateConfig/{id}':
    post:
      summary: Update Organization Configuration
      tags:
        - Organization
      description: |-
        **Overview**:
        - Updates existing organization-specific configuration for resource management
        - Modifies review settings (min approvals, review type, review stages)
        - Updates data managers and program managers roles
        - For SEQUENTIAL review, can add new review stages while preserving existing ones
        - Cannot update if configuration does not exist
        - Scoped to user's organization and tenant

        **Validation Rules**:
        - `id` must be a valid integer (configuration ID, 1 to 2147483647)
        - `resource_type` is required in query (must be valid RESOURCE_TYPE)
        - Configuration must exist for the specified id, resource_type, organization, and tenant
        - `data_managers` is optional (comma-separated list or array of alphabetic role names, empty array allowed)
        - `program_managers` is optional (comma-separated list or array of alphabetic role names, empty array allowed)
        - For SEQUENTIAL review with new `review_stages`, validates role and level properties
        - New review stages are added without removing existing stages
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains organization_code and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          description: 'Configuration ID to update (integer, required, 1 to 2147483647).'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1
        - in: query
          name: resource_type
          description: 'Resource type for the configuration (required, must be valid RESOURCE_TYPE like project, program).'
          schema:
            type: string
          required: true
          example: project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                show_reviewer_list:
                  type: boolean
                  description: 'Whether to show reviewer list to creators'
                min_approval:
                  type: integer
                  description: 'Minimum number of approvals required'
                review_type:
                  type: string
                  enum: [PARALLEL, SEQUENTIAL]
                  description: 'Review workflow type'
                review_stages:
                  type: array
                  description: 'For SEQUENTIAL review - adds new review stages'
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        description: 'Reviewer role name'
                      level:
                        type: integer
                        description: 'Review stage level'
                data_managers:
                  oneOf:
                    - type: string
                      description: 'Comma-separated list of data manager role names'
                    - type: array
                      description: 'Array of data manager role names'
                      items:
                        type: string
                  description: 'Optional data manager roles (can be empty array to clear)'
                program_managers:
                  oneOf:
                    - type: string
                      description: 'Comma-separated list of program manager role names'
                    - type: array
                      description: 'Array of program manager role names'
                      items:
                        type: string
                  description: 'Optional program manager roles (can be empty array to clear)'
            examples:
              update_approval_settings:
                value:
                  show_reviewer_list: false
                  min_approval: 3
              update_with_managers:
                value:
                  show_reviewer_list: true
                  min_approval: 2
                  data_managers: ['data_admin', 'data_lead']
                  program_managers: ['program_admin']
              add_review_stages:
                value:
                  review_type: SEQUENTIAL
                  review_stages:
                    - role: reviewer_level_3
                      level: 3
      responses:
        '200':
          description: 'Organization config updated successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Organization config updated successfully'
                  result:
                    type: array
                    description: 'Array containing updated configuration object'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: 'Configuration ID'
                        organization_code:
                          type: string
                          description: 'Organization code'
                        tenant_code:
                          type: string
                          description: 'Tenant code'
                        resource_type:
                          type: string
                          description: 'Resource type'
                        show_reviewer_list:
                          type: boolean
                          description: 'Show reviewer list flag'
                        min_approval:
                          type: integer
                          description: 'Minimum approvals required'
                        review_type:
                          type: string
                          description: 'Review workflow type'
                        created_at:
                          type: string
                          format: date-time
                          description: 'Creation timestamp'
                        updated_at:
                          type: string
                          format: date-time
                          description: 'Last update timestamp'
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            type:
                              type: string
                            version:
                              type: integer
              examples:
                example1:
