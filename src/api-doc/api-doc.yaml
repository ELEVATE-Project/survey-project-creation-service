  '/scp/v1/certificates/update/{id}':
    post:
      summary: Update certificate base template
      tags:
        - Certificate
      description: |-
        This API updates an existing certificate base template with new metadata, logos, and signature configurations for customizing organizational certificates. Certificate templates serve as base designs for generating customized certificates with organization-specific branding. Used in certificate management settings to modify template properties without recreating the template. This API ensures consistent certificate design management across resource types with organization-scoped access control.

        **Overview:**
        - Updates certificate template details (name, code, resource type, meta information)
        - Validates template exists in organization and tenant
        - Stores metadata for logos and signature configuration
        - Returns complete updated template with all properties
        - Scoped to authenticated user's organization and tenant

        **Validations:**
        - `id` must be a valid integer (1 to 2147483647) and reference existing certificate
        - `code` is required (unique per organization and tenant combination)
        - `name` is required (display name for template)
        - `url` is required (cloud storage path to SVG template)
        - `resource_type` is required (must be one of configured RESOURCE_TYPES like project, program)
        - `meta` is required (JSON object containing logos and signature configuration)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token containing user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          description: Certificate template ID to update (integer, required, 1 to 2147483647).
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
                - url
                - resource_type
                - meta
              properties:
                code:
                  type: string
                  description: Unique code identifier for template (must be unique per org/tenant)
                  example: two_logo_two_sign
                name:
                  type: string
                  description: Display name for the certificate template
