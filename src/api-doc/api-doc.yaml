  '/scp/v1/rollouts/publish/{id}':
    get:
      summary: Publish Rollout
      tags:
        - Rollout
      description: |-
        **Overview**:
        - Publishes a rollout to make it available to target users
        - Validates rollout details and targeting criteria
        - Validates resource exists and is in valid status for rollout
        - Creates solution rollout for non-program resources if not exists
        - Updates rollout status to PROCESSING during publication
        - Returns accepted status (202) as publication is asynchronous

        **Validation Rules**:
        - `id` must be a valid integer (rollout ID, 1 to 2147483647)
        - Rollout must exist and belong to authenticated user
        - Rollout must belong to user's organization and tenant
        - Resource must exist and not be in forbidden status for rollout
        - Targeting criteria must be valid (state, districts, roles validated)
        - Rollout validation must pass before publishing
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for service calls.'
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: 'Rollout ID to publish (integer, required, 1 to 2147483647). Rollout must belong to authenticated user and pass all validations.'
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          example: 1
      responses:
        '202':
          description: 'Rollout published successfully (Accepted - asynchronous processing)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Your changes have been published.'
                  result:
                    type: object
        '400':
          description: 'Bad Request - Rollout not found, validation failed, or resource in forbidden status'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: CLIENT_ERROR
                  message:
                    type: string
                    example: 'Rollout validation failed'
                  result:
                    type: object
  /scp/v1/rollouts/getDataManagers:
    get:
      summary: Get Data Manager List
      tags:
        - Rollout
      description: |-
        **Overview**:
        - Retrieves paginated list of users with data manager roles
        - Fetches data manager roles from organization configuration
        - Excludes authenticated user from the list
        - Returns user details including name, email, phone, and organization information
        - Supports pagination for large datasets
        - Scoped to user's organization and tenant

        **Validation Rules**:
        - `page` defaults to 1 if not provided (minimum 1)
        - `limit` defaults to 100 if not provided (maximum 100)
        - Organization must have data_managers configuration
        - Returns empty list if no data managers found
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for user service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: page
          in: query
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided.'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100.'
