    post:
      summary: Create Rollout
      tags:
        - Rollout
      description: |-
        **Overview**:
        - Creates a new rollout for a published resource
        - Validates resource exists and is in COMPLETION stage with PUBLISHED status
        - Uploads rollout data including targeting criteria to cloud storage
        - Creates rollout record with DRAFT status initially
        - Supports targeting by state, entity type, districts, roles, and sub-roles, it can be configurable
        - Includes viewer assignments and date range configuration
        - Returns rollout ID upon successful creation

        **Validation Rules**:
        - `title` is required (string, cannot exceed max title length)
        - `resource_id` is required (integer, 1 to 2147483647)
        - Resource must exist, be PUBLISHED, and in COMPLETION stage
        - `start_date` is optional (must be before end_date if both provided)
        - `end_date` is optional (must be after start_date if both provided)
        - `targeting_criteria` is optional array with state, entity_targeting, roles, sub_roles, districts
        - `viewers` is optional array of user IDs (integers)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - resource_id
              properties:
                title:
                  type: string
                  description: 'Rollout title (required, string)'
                  example: test rollout
                resource_id:
                  type: integer
                  description: 'Resource ID to create rollout for (required, must be published resource in COMPLETION stage)'
                  example: 2
                targeting_criteria:
                  type: array
                  description: 'Optional targeting criteria defining which users/locations can access the rollout'
                  items:
                    type: object
                    properties:
                      state:
                        type: object
                        properties:
                          _id:
                            type: string
                            example: '6852c86c7248c20014b38a4d'
                          name:
                            type: string
