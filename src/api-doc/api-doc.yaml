  /scp/v1/entities/create:
    post:
      summary: Create Entity
      tags:
        - Entity
      operationId: createEntity
      description: |-
        Creates a new entity within a specified entity type. Entities are organizational units categorized by entity types (e.g., languages, regions, schools).

        **Rules**:
        - Entity `value` must be unique per entity type, organization, and tenant (automatically converted to lowercase)
        - `label` can contain letters, numbers, and spaces
        - `value` must contain only letters and underscores (no spaces, no special characters)
        - `entity_type_id` must reference an existing entity type in the system
        - `status` defaults to ACTIVE if not provided (ACTIVE or INACTIVE)
        - `type` is optional and typically set to SYSTEM or USER (user-defined classification)
        - Organization code and tenant code are automatically set from authentication token

        **Use Cases**:
        - Create language options for projects
        - Define regional categorizations
        - Add school/institution entities to system
        - Build organizational unit hierarchies

        **Important Notes**:
        - Duplicate values within same entity type are rejected
        - All created/updated timestamps are automatically managed
        - created_by captures authenticated user ID
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Entity object with required fields'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: 'Unique identifier for the entity (letters and underscores only, will be converted to lowercase). Cannot be empty or null.'
                label:
                  type: string
                  description: 'Descriptive label for the entity (letters, numbers, and spaces allowed). Cannot be empty or null.'
                entity_type_id:
                  type: number
                  description: 'ID of the entity type this entity belongs to (must be numeric, positive integer). Cannot be empty or null.'
                status:
                  type: string
                  description: 'Entity status (optional, defaults to ACTIVE). Valid values: ACTIVE, INACTIVE.'
                  enum: ['ACTIVE', 'INACTIVE']
                type:
                  type: string
                  description: 'Entity classification type (optional, e.g., SYSTEM, USER). All uppercase letters only.'
              required:
                - value
                - label
                - entity_type_id
            examples:
              example1:
                summary: 'Create Basic Entity'
                value:
                  value: en
                  label: English
                  entity_type_id: 4
