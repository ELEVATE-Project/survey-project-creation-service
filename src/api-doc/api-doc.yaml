        - `id` must be a valid integer (program ID, 1 to 2147483647)
        - Program must exist and belong to authenticated user (user_id match)
        - Program status must be DRAFT (cannot delete programs in other statuses)
        - Program must belong to user's organization and tenant
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id for ownership validation.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          description: 'Program ID to delete (integer, required, 1 to 2147483647). Program must be in DRAFT status and belong to authenticated user.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1

      responses:
        '202':
          description: 'Program deleted successfully (soft delete accepted)'
          content:
