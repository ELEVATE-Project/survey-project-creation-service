      description: |-
        **Overview**:
        - Soft deletes a rollout from the system (paranoid deletion)
        - Only rollouts in DRAFT status can be deleted
        - Validates rollout belongs to authenticated user
        - Rollout record marked as deleted but preserved in database

        **Validation Rules**:
        - `id` must be a valid integer (rollout ID)
        - Rollout must exist and belong to authenticated user (user_id match)
        - Rollout status must be DRAFT (cannot delete ROLLED_OUT, INACTIVE, PROCESSING, or FAILED rollouts)
        - Rollout must belong to user's organization and tenant
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id for ownership validation.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Rollout ID to delete (integer, required). Rollout must be in DRAFT status and belong to authenticated user.'
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '202':
          description: 'Rollout deleted successfully (soft delete accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                success:
                  value:
                    responseCode: OK
                    message: Rollout deleted successfully
                    result: {}
        '400':
          description: 'Bad Request - Rollout not found or does not meet deletion criteria'
