  '/scp/v1/comments/update/{commentId}':
    delete:
      summary: Delete Comment
      tags:
        - Comment
      description: |-
        This API enables users to delete draft comments that haven't been shared or published. It provides a cleanup mechanism for comment management, allowing users to discard unsaved feedback before it becomes visible to other collaborators, making it part of the safe draft editing workflow.

        **Overview**:
        - Soft deletes (paranoid delete) a comment with record preservation in database for audit/compliance
        - Enforces strict ownership - only comment creator can delete their own comments
        - Restricts deletion to DRAFT status only - OPEN and RESOLVED comments are permanent (cannot be deleted)
        - Preserves deleted comment record in database with deletion timestamp for audit trail
        - Scoped to user's organization and tenant for multi-tenancy compliance

        **Validation Rules**:
        - `commentId` required as path parameter (integer: 1 to 2147483647)
        - `resource_id` required as query parameter (integer, positive) - validates comment belongs to resource
        - Comment must exist and belong to authenticated user (user_id ownership check required)
        - Comment status must be DRAFT (OPEN or RESOLVED comments cannot be deleted for audit integrity)
        - Comment must belong to the specified resource (prevents cross-resource deletion attempts)
        - Comment and resource must belong to authenticated user's organization and tenant scope
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: commentId
          description: 'Unique comment ID to delete (integer, 1 to 2147483647). Comment must be in DRAFT status and belong to the authenticated user.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 2
        - in: query
          name: resource_id
          description: 'Resource ID associated with the comment (integer, required). Used to validate comment belongs to specified resource.'
          schema:
            type: integer
            minimum: 1
          required: true
          example: 1
      responses:
        '200':
          description: 'Comment deleted successfully (soft delete)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                success:
                  value:
                    responseCode: OK
                    message: Comment deleted successfully
                    result: {}
        '400':
          description: 'Bad Request - Comment not found or does not meet deletion criteria'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                commentNotFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Comment not found
                    result: {}
                notDraftStatus:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Cannot delete comment with status OPEN. Only DRAFT comments can be deleted.
                    result: {}
                unauthorizedDelete:
                  value:
                    responseCode: CLIENT_ERROR
                    message: You can only delete your own comments
                    result: {}
