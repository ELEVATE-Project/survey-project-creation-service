    delete:
      summary: Delete Project (Soft Delete)
      tags:
        - Projects
      operationId: deleteProject
      description: |-
        This API soft deletes a project from the system by marking it as deleted in the database while preserving the record for audit purposes. Only the project creator can delete their own projects, ensuring data isolation and preventing unauthorized deletions. Project deletion is permanently marked with deletion timestamp and cannot be undone through the API. Used by project creators to remove unwanted or incomplete projects from the system during the DRAFT stage.

        **Validations**:
        - `projectId` must be valid integer (1 to 2147483647) and must exist in system
        - Project must belong to authenticated user (creator only)
        - Project must be in DRAFT status (cannot delete PUBLISHED, SUBMITTED, or COMPLETION status projects)
        - Project must be in CREATION stage (cannot delete projects in REVIEW or COMPLETION stage)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: projectId
          description: 'Unique project ID to soft delete (numeric, positive integer, 1 to 2147483647). Must belong to authenticated user.'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1
      responses:
        '202':
          description: 'Project deleted successfully (soft delete accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'OK'
                  message:
                    type: string
                    example: 'PROJECT_DELETED_SUCCESSFUL'
                  result:
                    type: object
                    description: 'Empty object for successful deletion'
                    example: {}
                  meta:
                    type: object
              examples:
                deleteExample:
                  summary: 'Project Deleted Successfully'
                  value:
                    responseCode: OK
                    message: PROJECT_DELETED_SUCCESSFUL
                    result: {}
                    meta: {}
        '400':
          description: 'Bad Request - Project not found or does not meet deletion criteria'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'CLIENT_ERROR'
                  message:
                    type: string
                    example: 'PROJECT_NOT_FOUND'
                  result:
                    type: object
              examples:
                notFoundExample:
                  summary: 'Project Not Found'
                  value:
                    responseCode: CLIENT_ERROR
                    message: PROJECT_NOT_FOUND
                    result: {}
                unauthorizedExample:
                  summary: 'Project Not Owned by User'
                  value:
                    responseCode: CLIENT_ERROR
                    message: PROJECT_NOT_FOUND
                    result: {}
  '/scp/v1/projects/submitForReview/{projectId}':
    post:
      summary: Submit Project for Review
      tags:
        - Projects
      operationId: submitForReview
      description: |-
        This API submits a completed project for review by creating review entries for selected reviewers or all reviewers based on organization configuration. Validates project data including tasks, entity tagging, and comments before submission, with automatic publishing if review is not mandatory. Changes project status to SUBMITTED and stage to REVIEW upon successful submission. Used by project creators to move projects through the review workflow.

        **Validations**:
        - `projectId` must be valid integer (1 to 2147483647) and must exist in system
        - Project must belong to authenticated user (creator only)
        - Project cannot be in PUBLISHED, REJECTED, REJECTED_AND_REPORTED, or SUBMITTED status
        - All open comments must be resolved before submission
        - Project task count must not exceed MAX_PROJECT_TASK_COUNT environment limit
        - `notes` character length must not exceed MAX_RESOURCE_NOTE_LENGTH (optional field)
        - `reviewer_ids` must be array of valid reviewer user IDs in same organization/tenant (optional)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for reviewer validation.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: projectId
          description: 'Unique project ID to submit for review (numeric, positive integer, 1 to 2147483647). Must belong to authenticated user.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1
      requestBody:
        description: 'Optional request body for reviewer selection and notes'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewer_ids:
                  description: 'Optional array of reviewer user IDs. If provided, project is assigned to specific reviewers. If omitted, project is available to all reviewers based on organization config.'
                  type: array
                  items:
                    type: string
                  minItems: 1
                  example: ['23', '25']
                notes:
                  description: 'Optional notes for reviewers. Character length must not exceed MAX_RESOURCE_NOTE_LENGTH environment variable.'
                  type: string
                  maxLength: 500
                  example: 'Note to the reviewer'
            examples:
              specificReviewers:
                summary: 'Submit to specific reviewers'
                description: 'When specific reviewers are selected, their user IDs are sent as an array, and the project is assigned to those reviewers.'
                value:
                  reviewer_ids:
                    - '23'
                    - '25'
                  notes: 'Note to the reviewer'
              allReviewers:
                summary: 'Submit to all reviewers'
                description: 'When the project is sent to all reviewers, no body parameters are required. The project will be available for all reviewers based on organization configuration.'
                value: {}
      responses:
        '200':
          description: 'Project submitted for review successfully (or auto-published if review not mandatory)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'OK'
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: 'Project ID'
                        example: 1
                  meta:
                    type: object
              examples:
                submitExample:
                  summary: 'Project Submitted Successfully'
                  value:
                    responseCode: OK
                    message: Project Submitted Successfully
                    result:
                      id: 1
                    meta: {}
        '400':
          description: 'Bad Request - Various validation failures'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteProject400Response'
  '/scp/v1/projects/republish/{projectId}':
    post:
      summary: Republish Project
      tags:
        - Projects
      operationId: republishProject
      description: |-
        This API republishes an already published project to the consumption portal or service using Kafka or configured API endpoints. Updates project status and stage to COMPLETION while automatically cleaning up associated comments and metadata. Used by administrators to push updated project versions to consumption systems after reviews or modifications. Project data is preserved with updated timestamps and republish is permanent, with deleted comments providing audit trail through database records.

        **Validations**:
        - `projectId` must be valid integer (1 to 2147483647) and must exist in system
        - Project must belong to authenticated user's organization and tenant
        - Project status must be PUBLISHED (cannot republish drafts or submitted projects)
        - Project must not have published_id already set (prevents duplicate republish)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for authorization.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: projectId
          description: 'Unique project ID to republish (numeric, positive integer, 1 to 2147483647). Must be a published project.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1
      responses:
        '200':
          description: 'Project republished successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
              examples:
                republishExample:
                  value:
                    responseCode: OK
                    message: Project republished successfully.
                    result:
                      id: 1
        '400':
          description: 'Bad Request - Various validation failures'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteProject400Response'
