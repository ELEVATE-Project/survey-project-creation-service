  /scp/v1/resource/list:
    get:
      summary: Resource List
      tags:
        - Resource
      operationId: listResources
      description: |-
        This API retrieves a paginated list of resources (projects, programs, surveys, observations) based on listing mode with support for search, filtering, and sorting. Supports three modes: drafts (user-created), submitted_for_review (awaiting review), and browse_existing (published resources). Returns resources with metadata including status, dates, creator details, and organization information. Used by creators to manage their resources and track progress through the resource lifecycle scoped to organization and tenant.

        **Validations**:
        - `listing` parameter is required (drafts, submitted_for_review, or browse_existing)
        - `type` must be from allowed values: project, program, survey, observation, observation_with_rubric
        - `page` must be positive integer (1-indexed, defaults to 1)
        - `limit` must be between 1 and 100 (defaults to 100, capped at 100)
        - `search` text cannot contain special characters if provided
        - `status` filter only applicable for submitted_for_review listing
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: page
          in: query
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided or invalid. Minimum value is 1.'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100. Values exceeding 100 will be capped at 100.'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          example: 10
        - name: search
          in: query
          description: 'Search text to filter resources by title (case-insensitive). Cannot contain special characters.'
          required: false
          schema:
            type: string
          example: 'education'
        - name: type
          in: query
          description: 'Resource type filter. Comma-separated values allowed for multiple types: project, program, observation, survey, observation_with_rubric.'
          required: false
          schema:
            type: string
          example: project
        - name: status
          in: query
          description: 'Status filter (only for submitted_for_review listing). Comma-separated values: IN_REVIEW, SUBMITTED, PUBLISHED, REJECTED, REJECTED_AND_REPORTED. Redundant for drafts listing.'
          required: false
          schema:
            type: string
          example: SUBMITTED
        - name: listing
          in: query
          description: 'Mandatory parameter to identify listing mode. Values: drafts (user drafts only), submitted_for_review (submitted resources), browse_existing (published resources).'
          required: true
          schema:
            type: string
            enum:
              - drafts
              - submitted_for_review
          example: drafts
        - name: sort_by
          in: query
          description: 'Sort field. Options: status, title. Default sorting is by title if not specified.'
          required: false
          schema:
            type: string
            enum:
              - status
              - title
          example: status
        - name: sort_order
          in: query
          description: 'Sort order: asc (ascending) or desc (descending).'
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
          example: asc
      responses:
        '200':
          description: 'Resources listed successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            title:
                              type: string
                            type:
                              type: string
                            status:
                              type: string
                            stage:
                              type: string
                            organization:
