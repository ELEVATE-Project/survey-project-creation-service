  /scp/v1/form/create:
    post:
      operationId: formCreate
      summary: Create Form
      tags:
        - Form
      description: |-
        This API creates a new form template with customizable fields, validators, and layout configuration. Used by administrators to define form structures for different resource types (projects, programs, surveys) with field controls, validation rules, and UI properties. Forms are scoped to organization and tenant, supporting template-based control definitions for flexible data collection. The API validates form uniqueness by type within the organization/tenant scope.

        **Validations**:
        - `type` field is required and must be a valid form type (e.g., project, program, survey)
        - Form with same `type`, `sub_type` combination must not already exist for the organization/tenant
        - `data` object is required and must contain `template_name` and `fields` properties

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Required for all requests. Token provides organization_code and tenant_code context.'
          required: true
          schema:
            type: string
      requestBody:
        description: 'Form object containing type, sub_type, and form data with field controls and validators'
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - sub_type
                - data
              properties:
                type:
                  type: string
                  description: 'The type of the form (e.g., project, program, survey, observation). Must be unique per organization/tenant.'
                  example: 'project'
                sub_type:
                  type: string
                  description: 'The sub-type or category of the form for further categorization'
                  example: 'createProject'
                data:
                  description: The main data structure for the form.
                  type: object
