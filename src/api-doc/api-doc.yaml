          description: Module id
          required: true
          style: simple
          explode: false
          schema:
            type: string
          example: 6
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Module fetched successfully
                    result:
                      data:
                        - id: 6
                          code: projects
                          status: ACTIVE
                        - id: 2
                          code: observation
                          status: ACTIVE
                        - id: 4
                          code: program
                          status: ACTIVE
                        - id: 5
                          code: system
                          status: ACTIVE
                      count: 4
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
        '400':
          description: Bad Request. Module not found.
          content:
            application.json:
              schema:
                $ref: '#/components/schemas/updateModule400Response'
