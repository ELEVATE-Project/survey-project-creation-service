                  value:
                    responseCode: CLIENT_ERROR
                    message: Entity Type Not Found
                    result: {}
  '/scp/v1/entities/update/{id}':
    put:
      summary: Update Entity
      tags:
        - Entity
      operationId: updateEntity
      description: |-
        This API modifies an existing entity with updated values for label, status, type, or entity type assignment. Admin-only operation used to maintain entity configurations, change status, or correct entity values within the system. At least one field must be provided to perform an update, and value must remain unique per entity type and organization if changed. Entity ID must exist and belong to the authenticated user's organization and tenant.

        **Validations**:
        - Entity ID must exist in the system and belong to user's organization and tenant
        - At least one field must be provided for update (cannot send empty body)
        - Updated `value` must remain unique per entity type, organization, and tenant if changed (automatically converted to lowercase)
        - `value` must contain only letters and underscores (no spaces, no special characters)
        - `label` can contain letters, numbers, and spaces
        - `entity_type_id` if provided must reference an existing entity type in same organization and tenant
        - `status` must be either ACTIVE or INACTIVE
        - `type` is optional custom classification (all uppercase letters only)
        - `updated_by` is automatically set to authenticated user ID

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          description: 'Valid entity ID to update (numeric, positive integer, 1 to 2147483647)'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1
      requestBody:
        description: 'Entity update object with optional fields. At least one field must be provided.'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: 'Updated unique identifier (letters and underscores only, will be converted to lowercase)'
                label:
                  type: string
                  description: 'Updated descriptive label (letters, numbers, and spaces allowed)'
                entity_type_id:
                  type: number
                  description: 'ID of the entity type (must exist and belong to same org/tenant)'
                status:
                  type: string
                  description: 'Entity status (optional). Valid values: ACTIVE, INACTIVE'
                  enum: ['ACTIVE', 'INACTIVE']
                type:
                  type: string
                  description: 'Entity classification type (optional, all uppercase letters only)'
            examples:
              example1:
                summary: 'Update Entity Label Only'
                value:
                  label: English US
              example2:
                summary: 'Update Entity Status'
                value:
                  status: INACTIVE
