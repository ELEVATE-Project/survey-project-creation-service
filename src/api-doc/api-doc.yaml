  '/scp/v1/entities/read/{id}':
    post:
      summary: Read Entity Details
      tags:
        - Entity
      operationId: readEntity
      description: |-
        Retrieves detailed information about one or more entities. Supports three operational modes for flexible querying.

        **Three Operational Modes**:

        **Mode 1 - Read by ID** (query param: `id=<number>`):
        - Fetch specific entity by its ID
        - Returns single entity if found
        - Filters for ACTIVE status only
        - Scope: System entities + user-created entities

        **Mode 2 - Read by Value** (query param: `value=<string>`):
        - Fetch specific entity by its value/identifier (case-insensitive)
        - Value automatically converted to lowercase
        - Returns single entity if found
        - Filters for ACTIVE status only
        - Scope: System entities + user-created entities

        **Mode 3 - Read All** (no query params or `read_user_entity=true`):
        - Fetch all system entities (default)
        - If `read_user_entity=true`: fetch both system and user-created entities
        - Returns array of all matching entities
        - Scope: Scoped to user's organization and tenant

        **Business Rules**:
        - Only returns ACTIVE entities (deleted/inactive entities excluded)
        - Results automatically scoped to authenticated user's organization and tenant
        - Case-insensitive value matching
        - User can only see their own created entities or system-wide entities

        **Use Cases**:
        - Display entity details by ID
        - Search for entity by value
        - List all system entities for dropdown/selection
        - Load all user-created entities for admin purposes

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: id
          description: 'Entity ID to fetch (numeric, positive integer). When provided, fetches specific entity by ID. Cannot be used with value parameter.'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 1
          required: false
        - in: query
          name: value
          description: 'Entity value to search (case-insensitive, auto-converted to lowercase). When provided, fetches specific entity by value. Cannot be used with id parameter.'
          schema:
            type: string
          example: 'english'
          required: false
        - in: query
          name: read_user_entity
          description: 'Boolean flag (true/false). When true, includes user-created entities in results. When false or omitted, returns only system entities. Used in Mode 3 (read all).'
          schema:
            type: boolean
          example: true
          required: false
      responses:
        '200':
          description: 'Entity or entities retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code (OK for success)'
                  message:
                    type: string
                    description: 'Response message (ENTITY_FETCHED_SUCCESSFULLY)'
                  result:
                    type: array
                    description: 'Array of entity objects matching the query criteria'
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: 'Unique entity ID (numeric, auto-incremented)'
                        entity_type_id:
                          type: number
                          description: 'Foreign key referencing entity type'
                        value:
                          type: string
                          description: 'Entity value (lowercase identifier)'
                        label:
                          type: string
                          description: 'Entity label (human-readable name)'
                        status:
                          type: string
                          description: 'Entity status (ACTIVE or INACTIVE)'
                        type:
                          type: string
                          description: 'Entity classification type (SYSTEM, USER, or custom)'
                        organization_code:
                          type: string
                          description: 'Organization code from authentication token'
                        tenant_code:
                          type: string
                          description: 'Tenant code from authentication token'
                        created_by:
                          type: string
                          description: 'User ID who created the entity (from auth token)'
                        updated_by:
                          type: string
                          description: 'User ID who last updated the entity'
                        created_at:
                          type: string
                          format: date-time
                          description: 'ISO 8601 timestamp when entity was created'
                        updated_at:
                          type: string
                          format: date-time
                          description: 'ISO 8601 timestamp when entity was last updated'
                        deleted_at:
                          type: string
                          format: date-time
                          description: 'ISO 8601 timestamp when entity was soft-deleted (null if active)'
                  meta:
                    type: object
                    description: 'Metadata object (optional)'
              examples:
                example1:
                  summary: 'Mode 1 - Fetch by ID (Single Entity Response)'
                  value:
                    responseCode: OK
                    message: Entity fetched successfully
                    result:
                      - id: 1
                        entity_type_id: 1
                        value: english
                        label: English
                        status: ACTIVE
                        type: SYSTEM
                        organization_code: 'sot'
                        tenant_code: 'shikshalokam'
                        created_by: '0'
                        updated_by: null
                        created_at: '2023-07-21T21:46:41.392Z'
                        updated_at: '2023-07-21T21:47:50.202Z'
                        deleted_at: null
                    meta: {}
                example2:
                  summary: 'Mode 3 - Fetch All System Entities (Multiple Entities Response)'
                  value:
                    responseCode: OK
                    message: ENTITY_FETCHED_SUCCESSFULLY
                    result:
                      - id: 1
                        entity_type_id: 1
                        value: english
                        label: English
                        status: ACTIVE
                        type: SYSTEM
                        organization_code: 'ORG001'
                        tenant_code: 'TENANT001'
                        created_by: '0'
                        updated_by: null
                        created_at: '2023-07-21T21:46:41.392Z'
                        updated_at: '2023-07-21T21:47:50.202Z'
                        deleted_at: null
                      - id: 2
                        entity_type_id: 1
                        value: hindi
                        label: Hindi
                        status: ACTIVE
                        type: SYSTEM
                        organization_code: 'ORG001'
                        tenant_code: 'TENANT001'
                        created_by: '0'
                        updated_by: null
                        created_at: '2023-07-21T21:46:41.392Z'
                        updated_at: '2023-07-21T21:47:50.202Z'
                        deleted_at: null
                    meta: {}
        '400':
          description: 'Bad Request - Entity not found or invalid query'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateUserEntity400Response'
    parameters: []
  '/scp/v1/entities/delete/{id}':
    delete:
      summary: Delete Entity (Soft Delete)
      tags:
        - Entity
      operationId: deleteEntity
      description: |-
        Soft deletes an entity from the system. The entity record is marked as deleted but preserved in the database for audit and compliance purposes.

        **Rules**:
        - Entity ID must exist in the system
        - User must be the creator of the entity (or admin)
        - Entity must belong to user's organization and tenant
        - HTTP status 202 (Accepted) indicates soft delete is processed

        **Use Cases**:
        - Remove entity definitions from active use while preserving history
        - Archive outdated entities with full audit trail
        - Decommission entities with compliance logging

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          required: true
          description: 'Unique entity ID to soft delete (numeric, positive integer, 1 to 2147483647)'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 2
      responses:
        '202':
          description: 'Entity deleted successfully (Soft delete accepted and processed)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code indicator (OK for success)'
                  message:
                    type: string
                    description: 'Deletion status message'
                  result:
                    type: object
                    description: 'Empty object for successful deletion'
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: string
                      correlation:
                        type: string
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Entity deleted successfully
                    result: []
                    meta:
                      formsVersion: []
                      correlation: 2f8b1d3d-0a25-4dda-ae5f-8d8bb9dd9282
        '400':
          description: Bad Request. User Entity has already been deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateUserEntity400Response'
  /scp/v1/entities/list:
    get:
      operationId: listEntities
      summary: List Entities (Paginated & Searchable)
      tags:
        - Entity
      description: |-
        Retrieves a paginated list of entities with optional search and filtering capabilities.

        **Features**:
        - Pagination support with configurable page size (defaults to 100, max 100 per page)
        - Full-text search on entity label (case-insensitive, iLike matching)
        - Filter by entity type (required parameter)
        - Sort by created_at in descending order
        - Results scoped to authenticated user's organization and tenant
        - Search text cannot contain special characters (validation error if present)
        - If no search term provided, returns all entities of specified type

        **Query Parameters**:
        - `entity_type_id`: Required entity type ID to filter entities (numeric, required)
        - `page`: Page number for pagination (1-indexed, defaults to 1 if not provided)
        - `limit`: Records per page (defaults to 100, maximum 100, will be capped at 100)
        - `search`: Optional search term to filter entities by label (case-insensitive, no special chars)

        **Use Cases**:
        - Display paginated entity lists for dropdowns
        - Search entities by label within an entity type
        - Load organizational entities with filtering
        - Implement entity browsing with pagination
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
        - in: query
          name: entity_type_id
          description: 'Required entity type ID to filter entities (numeric, positive integer, must be valid entity type ID)'
          required: true
          schema:
            type: number
            minimum: 1
          example: 1
        - in: query
          name: page
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided or invalid. Minimum value is 1'
          schema:
            type: number
            minimum: 1
            default: 1
          example: 1
          required: false
        - in: query
          name: limit
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100. Values exceeding 100 will be capped at 100'
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 100
          example: 10
          required: false
        - in: query
          name: search
          description: 'Search term to filter entities by label (case-insensitive iLike match). Cannot contain special characters. Optional parameter - if not provided, all entities of specified type are returned'
          schema:
            type: string
            maxLength: 255
          example: english
          required: false
      responses:
        '200':
          description: 'Entities retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code indicator (OK for success)'
                  message:
                    type: string
                    description: 'Status message'
                  result:
                    type: object
                    description: 'Result object containing data array and count'
                    properties:
                      data:
                        type: array
                        description: 'Array of entity records'
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                              description: 'Unique entity identifier'
                            entity_type_id:
                              type: number
                              description: 'Entity type ID this entity belongs to'
                            value:
                              type: string
                              description: 'Unique entity value (lowercase, no spaces)'
                            label:
                              type: string
                              description: 'Human-readable entity label'
                            status:
                              type: string
                              description: 'Entity status (ACTIVE or INACTIVE)'
                              enum: ['ACTIVE', 'INACTIVE']
                            type:
                              type: string
                              description: 'Entity classification (SYSTEM or USER)'
                            created_by:
                              type: number
                              description: 'User ID who created the entity'
                            created_at:
                              type: string
                              format: date-time
                              description: 'ISO 8601 timestamp when entity was created'
                      count:
                        type: number
                        description: 'Total number of entities matching the filters'
                  meta:
                    type: object
                    description: 'Metadata object (empty for list operations)'
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Entity fetched successfully
                    result:
                      data:
                        - id: 1
                          entity_type_id: 1
                          value: english
                          label: English
                          status: ACTIVE
                          type: SYSTEM
                          created_by: 0
                          created_at: '2023-07-21T21:46:41.392Z'
                        - id: 2
                          entity_type_id: 1
                          value: hindi
                          label: Hindi
                          status: ACTIVE
                          type: SYSTEM
                          created_by: 0
                          created_at: '2023-07-22T10:15:30.123Z'
                      count: 2
                    meta: {}
  /scp/v1/cloud-services/getSignedUrl:
    post:
      operationId: getSignedUrl
      summary: Generate Signed URLs for File Upload
      tags:
        - Cloud Services
      description: |-
        Generates signed URLs for uploading files to cloud storage (Azure Blob Storage). Supports multiple reference types with automatic folder structure generation based on tenant, organization, user, and reference type.

        **Reference Types Supported**:
        - `certificate`: For certificate uploads
        - `logo`: For logo image uploads
        - `signature`: For digital signature uploads
        - `base_template`: For base template files
        - `roll_out`: For roll-out related file uploads
        - `certificate_template`: For certificate template files

        **Folder Structure**: Files are stored in path pattern: `tenant_code/organization_code/userId/reference_type/resourceId/uniqueId/filename`

        **Use Cases**:
        - Get temporary upload URLs for file attachments
        - Support certificate and template management
        - Enable user file uploads with cloud storage integration

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Required for all requests. Token provides user context (organization_code, tenant_code, user_id).'
          required: true
          schema:
            type: string
        - name: serviceUpload
          in: query
          description: 'Optional query parameter to switch between direct cloud storage URL and service upload endpoint. When true, uses service endpoint instead of direct cloud URL. Defaults to false.'
          required: false
          schema:
            type: string
            enum: ['true', 'false']
          example: 'false'
      requestBody:
        description: 'Request object containing resource IDs with file names and reference type'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  type: object
                  description: 'Object with resource IDs as keys. Each resource ID contains a files array with file names. Example: { "resourceId1": { "files": ["file1.png", "file2.jpg"] } }'
                  example:
                    resourceId1:
                      files:
                        - fileName1.png
                        - fileName2.jpg
                ref:
                  type: string
                  description: 'Reference type for organizing uploads. Determines folder path. Must be one of the supported reference types.'
                  enum:
                    - certificate
                    - logo
                    - signature
                    - base_template
                    - roll_out
                    - certificate_template
                    - resources
                  example: certificate
              required:
                - request
                - ref
            examples:
              example1:
                value:
                  request:
                    123:
                      files:
                        - certificateFile.png
                        - attestation.pdf
                  ref: certificate
              example2:
                value:
                  request:
                    logoId456:
                      files:
                        - logo.svg
                  ref: logo
      responses:
        '200':
          description: 'Signed URLs generated successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code (OK for success)'
                  message:
                    type: string
                    description: 'Status message'
                  result:
                    type: object
                    description: 'Object with resource IDs as keys, each containing files array with signed URLs'
                    additionalProperties:
                      type: object
                      properties:
                        files:
                          type: array
                          description: 'Array of file objects with signed URLs'
                          items:
                            type: object
                            properties:
                              file:
                                type: string
                                description: 'Full cloud storage file path including resource ID and unique ID'
                              url:
                                type: string
                                description: 'Signed URL for file upload (POST/PUT). Valid for configured expiry time.'
                              downloadableUrl:
                                type: string
                                description: 'Signed URL for file download (GET). Valid for configured expiry time.'
                              payload:
                                type: object
                                description: 'Metadata object'
                                properties:
                                  sourcePath:
                                    type: string
                                    description: 'Source file path in cloud storage'
                              cloudStorage:
                                type: string
                                description: 'Cloud storage provider name'
                  meta:
                    type: object
                    description: 'Metadata object (empty)'
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Signed URL Generated Successfully.
                    result:
                      projectId123:
                        files:
                          - file: tenant_code/org_code/userId/certificate/projectId123/uniqueId/certificateFile.png
                            url: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/certificate/projectId123/uniqueId/certificateFile.png?sv=2023-01-03&st=2024-05-08T03%3A02%3A44Z&se=2024-05-10T15%3A02%3A44Z&sr=b&sp=w&sig=SIGNATURE_HERE'
                            downloadableUrl: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/certificate/projectId123/uniqueId/certificateFile.png?sv=2023-01-03&st=2024-05-08T03%3A02%3A44Z&se=2024-05-10T15%3A02%3A44Z&sr=b&sp=r&sig=SIGNATURE_HERE'
                            payload:
                              sourcePath: tenant_code/org_code/userId/certificate/projectId123/uniqueId/certificateFile.png
                            cloudStorage: AZURE
                          - file: tenant_code/org_code/userId/certificate/projectId123/uniqueId/attestation.pdf
                            url: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/certificate/projectId123/uniqueId/attestation.pdf?sv=2023-01-03&st=2024-05-08T03%3A02%3A44Z&se=2024-05-10T15%3A02%3A44Z&sr=b&sp=w&sig=SIGNATURE_HERE2'
                            downloadableUrl: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/certificate/projectId123/uniqueId/attestation.pdf?sv=2023-01-03&st=2024-05-08T03%3A02%3A44Z&se=2024-05-10T15%3A02%3A44Z&sr=b&sp=r&sig=SIGNATURE_HERE2'
                            payload:
                              sourcePath: tenant_code/org_code/userId/certificate/projectId123/uniqueId/attestation.pdf
                            cloudStorage: AZURE
                    meta: {}

  /scp/v1/cloud-services/getDownloadableUrl:
    post:
      operationId: getDownloadableUrl
      summary: Generate Downloadable URLs for Files
      tags:
        - Cloud Services
      description: |-
        Generates downloadable signed URLs for files stored in cloud storage.

        **Use Cases**:
        - Download certificates, images, or documents from storage
        - Generate temporary access URLs with time-limited validity
        - Support batch file downloads with multiple paths

        **File Path Requirements**:
        - Paths must be valid cloud storage paths
        - Paths must belong to authenticated user's organization/tenant
        - Path format: `tenant/organization/userId/type/resourceId/uuid/filename`

      parameters:
        - name: X-auth-token
          in: header
          description: Authentication token from login API response. Required for all requests.
          required: true
          schema:
            type: string
      requestBody:
        description: Request object containing array of cloud storage file paths
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filePaths
              properties:
                filePaths:
                  type: array
                  items:
                    type: string
                  description: Array of cloud storage file paths to generate downloadable URLs for
                  example:
                    - tenant/org/user123/certificate/project1/a1b2c3d4/cert.pdf
                    - tenant/org/user123/logo/org1/x9y8z7w6/logo.png
            example:
              filePaths:
                - tenant/org/user123/certificate/project1/a1b2c3d4/certificate.pdf
                - tenant/org/user123/logo/org1/x9y8z7w6/logo.png
                - tenant/org/user123/signature/sig1/p5q4r3s2/signature.jpg

      responses:
        '200':
          description: Downloadable URLs generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                    description: Response status code
                  message:
                    type: string
                    example: DOWNLOAD_URL_GENERATED_SUCCESSFULLY
                    description: Human-readable status message
                  result:
                    type: array
                    description: Array of generated downloadable URLs
                    items:
                      type: object
                      properties:
                        cloudStorage:
                          type: string
                          description: Cloud storage provider (AZURE, GCS, S3, etc.)
                          example: AZURE
                        filePath:
                          type: string
                          description: Original cloud storage file path
                          example: tenant/org/user123/certificate/project1/a1b2c3d4/certificate.pdf
                        url:
                          type: string
                          description: Signed URL for downloading file (READ permission)
                          example: https://storage.azure.com/...?sv=2021-06-08&sp=r&sig=XXXX...
              example:
                responseCode: OK
                message: DOWNLOAD_URL_GENERATED_SUCCESSFULLY
                result:
                  - cloudStorage: AZURE
                    filePath: tenant/org/user123/certificate/project1/a1b2c3d4/certificate.pdf
                    url: https://storage.azure.com/container/tenant/org/user123/certificate/project1/a1b2c3d4/certificate.pdf?sv=2021-06-08&ss=bfqt&srt=sco&sp=racwd&se=2024-01-15T10:30:00Z&sig=XXXXXXXXXXXXXX
                  - cloudStorage: AZURE
                    filePath: tenant/org/user123/logo/org1/x9y8z7w6/logo.png
                    url: https://storage.azure.com/container/tenant/org/user123/logo/org1/x9y8z7w6/logo.png?sv=2021-06-08&ss=bfqt&srt=sco&sp=racwd&se=2024-01-15T10:30:00Z&sig=XXXXXXXXXXXXXX
                  - cloudStorage: AZURE
                    filePath: tenant/org/user123/signature/sig1/p5q4r3s2/signature.jpg
                    url: https://storage.azure.com/container/tenant/org/user123/signature/sig1/p5q4r3s2/signature.jpg?sv=2021-06-08&ss=bfqt&srt=sco&sp=racwd&se=2024-01-15T10:30:00Z&sig=XXXXXXXXXXXXXX

