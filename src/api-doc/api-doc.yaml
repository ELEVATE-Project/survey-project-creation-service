                      config:
                        type: object
                        description: 'Configuration object containing is_external, depended_on, is_dependent metadata'
                      validations:
                        type: object
                        nullable: true
                        description: 'Custom validation rules (null if not defined)'
                      created_by:
                        type: string
                        description: 'User ID who created the entity type'
                      updated_by:
                        type: string
                        nullable: true
                        description: 'User ID who last updated the entity type'
                      organization_code:
                        type: string
                        description: 'Organization code from authentication token'
                      tenant_code:
                        type: string
                        description: 'Tenant code from authentication token'
                      created_at:
                        type: string
                        format: date-time
                        description: 'Timestamp when entity type was created'
                      updated_at:
                        type: string
                        format: date-time
