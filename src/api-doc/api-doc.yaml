  '/scp/v1/entities/read':
    post:
      summary: Read Entity Details
      tags:
        - Entity
      operationId: readEntity
      description: |-
        This API retrieves one or more entities using flexible query modes: by ID, by value, or all entities for the user's organization. Supports filtering by specific entity identifiers or retrieving complete entity lists with optional inclusion of user-created entities. Only ACTIVE entities are returned with automatic scoping to the authenticated user's organization and tenant. Used to fetch entity data for UI dropdowns, forms, configurations, or administrative entity management.

        **Three Operational Modes**:

        **Mode 1 - Read by ID** (query param: `id=<number>`): Fetches a specific entity by its ID, returning a single entity if found from both system and user-created entities within the organization and tenant scope.

        **Mode 2 - Read by Value** (query param: `value=<string>`): Fetches a specific entity by its value/identifier (case-insensitive, auto-converted to lowercase), returning a single entity if found from both system and user-created entities.

        **Mode 3 - Read All** (no query params or `read_user_entity=<true|false>`): Fetches all system entities by default; if `read_user_entity=true`, includes both system and user-created entities for the authenticated user's organization and tenant.

        **Validations**:
        - Query parameters are mutually exclusive (id and value cannot be used together)
        - Entity ID must be a valid positive integer (1 to 2147483647) if provided

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: id
          description: 'Entity ID to fetch (numeric, positive integer). When provided, fetches specific entity by ID. Cannot be used with value parameter.'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 1
          required: false
        - in: query
          name: value
          description: 'Entity value to search (case-insensitive, auto-converted to lowercase). When provided, fetches specific entity by value. Cannot be used with id parameter.'
          schema:
            type: string
          example: 'english'
          required: false
        - in: query
          name: read_user_entity
          description: 'Boolean flag (true/false). When true, includes user-created entities in results. When false or omitted, returns only system entities. Used in Mode 3 (read all).'
          schema:
            type: boolean
          example: true
          required: false
      responses:
        '200':
          description: 'Entity or entities retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code (OK for success)'
                  message:
                    type: string
                    description: 'Response message (ENTITY_FETCHED_SUCCESSFULLY)'
                  result:
                    type: array
                    description: 'Array of entity objects matching the query criteria'
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: 'Unique entity ID (numeric, auto-incremented)'
                        entity_type_id:
                          type: number
                          description: 'Foreign key referencing entity type'
                        value:
                          type: string
                          description: 'Entity value (lowercase identifier)'
                        label:
                          type: string
                          description: 'Entity label (human-readable name)'
                        status:
                          type: string
                          description: 'Entity status (ACTIVE or INACTIVE)'
                        type:
                          type: string
                          description: 'Entity classification type (SYSTEM, USER, or custom)'
                        organization_code:
                          type: string
                          description: 'Organization code from authentication token'
                        tenant_code:
                          type: string
                          description: 'Tenant code from authentication token'
                        created_by:
                          type: string
                          description: 'User ID who created the entity (from auth token)'
                        updated_by:
                          type: string
                          description: 'User ID who last updated the entity'
                        created_at:
                          type: string
                          format: date-time
                          description: 'ISO 8601 timestamp when entity was created'
                        updated_at:
                          type: string
                          format: date-time
                          description: 'ISO 8601 timestamp when entity was last updated'
                        deleted_at:
                          type: string
                          format: date-time
                          description: 'ISO 8601 timestamp when entity was soft-deleted (null if active)'
                  meta:
                    type: object
                    description: 'Metadata object (optional)'
              examples:
                example1:
                  summary: 'Mode 1 - Fetch by ID (Single Entity Response)'
                  value:
                    responseCode: OK
                    message: ENTITY_FETCHED_SUCCESSFULLY
                    result:
                      - id: 1
                        entity_type_id: 1
                        value: english
                        label: English
                        status: ACTIVE
                        type: SYSTEM
                        organization_code: 'sot'
                        tenant_code: 'shikshalokam'
                        created_by: '0'
                        updated_by: null
                        created_at: '2023-07-21T21:46:41.392Z'
                        updated_at: '2023-07-21T21:47:50.202Z'
                        deleted_at: null
                    meta: {}
                example2:
                  summary: 'Mode 3 - Fetch All System Entities (Multiple Entities Response)'
                  value:
                    responseCode: OK
                    message: ENTITY_FETCHED_SUCCESSFULLY
                    result:
                      - id: 1
                        entity_type_id: 1
                        value: english
                        label: English
                        status: ACTIVE
                        type: SYSTEM
                        organization_code: 'ORG001'
                        tenant_code: 'TENANT001'
                        created_by: '0'
                        updated_by: null
                        created_at: '2023-07-21T21:46:41.392Z'
                        updated_at: '2023-07-21T21:47:50.202Z'
                        deleted_at: null
                      - id: 2
                        entity_type_id: 1
                        value: hindi
                        label: Hindi
                        status: ACTIVE
                        type: SYSTEM
                        organization_code: 'ORG001'
                        tenant_code: 'TENANT001'
                        created_by: '0'
                        updated_by: null
                        created_at: '2023-07-21T21:46:41.392Z'
                        updated_at: '2023-07-21T21:47:50.202Z'
                        deleted_at: null
                    meta: {}
        '400':
          description: 'Bad Request - Entity not found or invalid query'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code (CLIENT_ERROR for failure)'
                  message:
                    type: string
                    description: 'Error message key from en.json'
                  result:
                    type: object
                    description: 'Empty object on error'
              examples:
                example1:
                  summary: 'Entity Not Found (by ID or Value)'
                  value:
                    responseCode: CLIENT_ERROR
                    message: ENTITY_NOT_FOUND
                    result: {}
    parameters: []
  '/scp/v1/entities/delete/{id}':
    delete:
      summary: Delete Entity (Soft Delete)
      tags:
        - Entity
      operationId: deleteEntity
      description: |-
        This API performs a soft delete on an entity, marking it as deleted in the database while preserving the record for audit purposes. It is used by administrators to decommission entities without permanent removal, ensuring compliance and maintaining historical data. Soft deletion is permanent and cannot be undone.

        **Validations**:
        - Entity ID must be a valid positive integer (1 to 2147483647)
        - Entity must exist and not already be deleted

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          required: true
          description: 'Unique entity ID to soft delete (numeric, positive integer, 1 to 2147483647)'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 2
      responses:
        '202':
          description: 'Entity deleted successfully (Soft delete accepted and processed)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code indicator (OK for success)'
                  message:
                    type: string
                    description: 'Deletion status message'
                  result:
                    type: object
                    description: 'Empty object for successful deletion'
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: string
                      correlation:
                        type: string
              examples:
                example1:
                  summary: 'Entity Deleted Successfully (Soft Delete)'
                  value:
                    responseCode: OK
                    message: ENTITY_DELETED_SUCCESSFULLY
                    result: {}
                    meta:
                      formsVersion: []
        '400':
          description: 'Bad Request - Entity not found or already deleted'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code (CLIENT_ERROR for failure)'
                  message:
                    type: string
                    description: 'Error message key from en.json'
                  result:
                    type: object
                    description: 'Empty object on error'
              examples:
                example1:
                  summary: 'Entity Not Found or Already Deleted'
                  value:
                    responseCode: CLIENT_ERROR
                    message: ENTITY_NOT_FOUND
                    result: {}
  /scp/v1/entities/list:
    get:
      operationId: listEntities
      summary: List Entities (Paginated & Searchable)
      tags:
        - Entity
      description: |-
        This API retrieves a paginated list of entities for a specific entity type, supporting optional search and pagination. It is used by administrators to browse and filter entities within their organization and tenant scope. Results are sorted by creation date for easy management.

        **List Entities with Pagination & Search** (required param: `entity_type_id`): Provides paginated results with optional label-based search and configurable page size.

        **Validations**:
        - `entity_type_id` is required and must be a valid positive integer (must reference existing entity type)
        - `page` must be a positive integer (1-indexed, defaults to 1)
        - `limit` must be between 1 and 100 (defaults to 100, capped at 100)
        - `search` text cannot contain special characters if provided
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
        - in: query
          name: entity_type_id
          description: 'Required entity type ID to filter entities (numeric, positive integer, must be valid entity type ID)'
          required: true
          schema:
            type: number
            minimum: 1
          example: 1
        - in: query
          name: page
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided or invalid. Minimum value is 1'
          schema:
            type: number
            minimum: 1
            default: 1
          example: 1
          required: false
        - in: query
          name: limit
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100. Values exceeding 100 will be capped at 100'
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 100
          example: 10
          required: false
        - in: query
          name: search
          description: 'Search term to filter entities by label (case-insensitive iLike match). Cannot contain special characters. Optional parameter - if not provided, all entities of specified type are returned'
          schema:
            type: string
            maxLength: 255
          example: english
          required: false
      responses:
        '200':
          description: 'Entities retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code indicator (OK for success)'
                  message:
                    type: string
                    description: 'Status message'
                  result:
                    type: object
                    description: 'Result object containing data array and count'
                    properties:
                      data:
                        type: array
                        description: 'Array of entity records'
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                              description: 'Unique entity identifier'
                            entity_type_id:
                              type: number
                              description: 'Entity type ID this entity belongs to'
                            value:
                              type: string
                              description: 'Unique entity value (lowercase, no spaces)'
                            label:
                              type: string
                              description: 'Human-readable entity label'
                            status:
                              type: string
                              description: 'Entity status (ACTIVE or INACTIVE)'
                              enum: ['ACTIVE', 'INACTIVE']
                            type:
                              type: string
                              description: 'Entity classification (SYSTEM or USER)'
                            created_by:
                              type: number
                              description: 'User ID who created the entity'
                            created_at:
                              type: string
                              format: date-time
                              description: 'ISO 8601 timestamp when entity was created'
                      count:
                        type: number
                        description: 'Total number of entities matching the filters'
                  meta:
                    type: object
                    description: 'Metadata object (empty for list operations)'
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Entity fetched successfully
                    result:
                      data:
                        - id: 1
                          entity_type_id: 1
                          value: english
                          label: English
                          status: ACTIVE
                          type: SYSTEM
                          created_by: 0
                          created_at: '2023-07-21T21:46:41.392Z'
                        - id: 2
                          entity_type_id: 1
                          value: hindi
                          label: Hindi
                          status: ACTIVE
                          type: SYSTEM
                          created_by: 0
                          created_at: '2023-07-22T10:15:30.123Z'
                      count: 2
                    meta: {}
  /scp/v1/cloud-services/getSignedUrl:
    post:
      operationId: getSignedUrl
      summary: Generate Signed URLs for File Upload
      tags:
        - Cloud Services
      description: |-
        This API generates temporary signed URLs for uploading files to cloud storage with support for multiple resource types (certificates, logos, signatures, templates, roll-outs). Used by clients to obtain secure, time-limited upload URLs before pushing files to cloud storage. Automatically organizes files by tenant, organization, and resource type in cloud folder structure. Supports both direct cloud storage URLs and service endpoint URLs based on deployment configuration.

        **Reference Types Supported**:
        - `certificate`: Certificate file uploads
        - `logo`: Logo and image uploads
        - `signature`: Digital signature uploads
        - `base_template`: Base template files
        - `roll_out`: Roll-out related files
        - `certificate_template`: Certificate template files
        - `resources`: Generic resource files

        **Validations**:
        - `request` object must contain resource IDs with non-empty files array (minimum 1 file)
        - `ref` (reference type) must be one of the supported types listed above
        - `organization_code` and `tenant_code` must be present in authentication token (required for scope)
        - File names must follow cloud storage naming conventions (no validation of special characters at API level)
        - Generated URLs expire after configured time period (default expiry based on environment settings)

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Required for all requests. Token provides user context (organization_code, tenant_code, user_id).'
          required: true
          schema:
            type: string
        - name: serviceUpload
          in: query
          description: 'Optional query parameter to switch between direct cloud storage URL and service upload endpoint. When true, uses service endpoint instead of direct cloud URL. Defaults to false.'
          required: false
          schema:
            type: string
            enum: ['true', 'false']
          example: 'false'
      requestBody:
        description: 'Request object containing resource IDs mapped to files array and reference type for organizing uploads'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  type: object
                  description: 'Object with resource IDs as keys. Each resource ID maps to an object containing files array with file names to upload. Supports single or multiple files per resource ID'
                  example:
                    resourceId1:
                      files:
                        - fileName1.png
                        - fileName2.jpg
                ref:
                  type: string
                  description: 'Reference type for organizing file uploads in cloud storage folder structure. Determines folder hierarchy and categorization. Must be one of the supported reference types'
                  enum:
                    - certificate
                    - logo
                    - signature
                    - base_template
                    - roll_out
                    - certificate_template
                    - resources
                  example: certificate
              required:
                - request
                - ref
            examples:
              example1:
                summary: Multiple files for certificate upload
                value:
                  request:
                    123:
                      files:
                        - certificateFile.png
                        - attestation.pdf
                  ref: certificate
              example2:
                summary: Single logo file upload
                value:
                  request:
                    logoResourceId:
                      files:
                        - company-logo.svg
                  ref: logo
              example3:
                summary: Multiple template files
                value:
                  request:
                    templateId456:
                      files:
                        - base_template.pdf
                        - guidelines.docx
                  ref: base_template
      responses:
        '200':
          description: 'Signed URLs generated successfully with expiry time configured for security'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code (OK for success, CLIENT_ERROR for failure)'
                    example: 'OK'
                  message:
                    type: string
                    description: 'Status message from en.json locales file'
                    example: 'Signed Url Generated Successfully.'
                  result:
                    type: object
                    description: 'Object with resource IDs as keys, each containing files array with signed URLs. Each resource ID maps to an object with files array'
                    additionalProperties:
                      type: object
                      properties:
                        files:
                          type: array
                          description: 'Array of file objects containing signed URLs and metadata for each file'
                          items:
                            type: object
                            required:
                              - file
                              - url
                              - downloadableUrl
                              - payload
                              - cloudStorage
                            properties:
                              file:
                                type: string
                                description: 'Full cloud storage file path in format: tenant_code/organization_code/userId/referenceType/resourceId/uniqueId/filename'
                                example: 'tenant_code/org_code/userId/certificate/projectId123/abc-uuid-xyz/certificateFile.png'
                              url:
                                type: string
                                description: 'Signed URL for file upload (POST/PUT) with write permission. Valid for configured expiry time (typically a few hours)'
                                example: 'https://storageaccount.blob.core.windows.net/container/...?sv=2023-01-03&sp=w&sig=SIGNATURE'
                              downloadableUrl:
                                type: string
                                description: 'Signed URL for file download (GET) with read permission. Valid for configured expiry time (typically a few hours)'
                                example: 'https://storageaccount.blob.core.windows.net/container/...?sv=2023-01-03&sp=r&sig=SIGNATURE'
                              payload:
                                type: object
                                description: 'Metadata object containing source file path reference'
                                required:
                                  - sourcePath
                                properties:
                                  sourcePath:
                                    type: string
                                    description: 'Source file path in cloud storage (same as file property)'
                                    example: 'tenant_code/org_code/userId/certificate/projectId123/abc-uuid-xyz/certificateFile.png'
                              cloudStorage:
                                type: string
                                description: 'Cloud storage provider name (configured in environment)'
                                example: 'AZURE'
                  meta:
                    type: object
                    description: 'Metadata object containing optional context information (typically empty for this API)'
                    properties:
                      correlation:
                        type: string
                        description: 'Correlation ID for request tracing (optional)'
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Signed Url Generated Successfully.
                    result:
                      projectId123:
                        files:
                          - file: tenant_code/org_code/userId/certificate/projectId123/abc-uuid-123/certificateFile.png
                            url: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/certificate/projectId123/abc-uuid-123/certificateFile.png?sv=2023-01-03&st=2024-05-08T03%3A02%3A44Z&se=2024-05-08T07%3A02%3A44Z&sr=b&sp=w&sig=SIGNATURE_HERE'
                            downloadableUrl: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/certificate/projectId123/abc-uuid-123/certificateFile.png?sv=2023-01-03&st=2024-05-08T03%3A02%3A44Z&se=2024-05-08T07%3A02%3A44Z&sr=b&sp=r&sig=SIGNATURE_HERE'
                            payload:
                              sourcePath: tenant_code/org_code/userId/certificate/projectId123/abc-uuid-123/certificateFile.png
                            cloudStorage: AZURE
                          - file: tenant_code/org_code/userId/certificate/projectId123/abc-uuid-124/attestation.pdf
                            url: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/certificate/projectId123/abc-uuid-124/attestation.pdf?sv=2023-01-03&st=2024-05-08T03%3A02%3A44Z&se=2024-05-08T07%3A02%3A44Z&sr=b&sp=w&sig=SIGNATURE_HERE2'
                            downloadableUrl: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/certificate/projectId123/abc-uuid-124/attestation.pdf?sv=2023-01-03&st=2024-05-08T03%3A02%3A44Z&se=2024-05-08T07%3A02%3A44Z&sr=b&sp=r&sig=SIGNATURE_HERE2'
                            payload:
                              sourcePath: tenant_code/org_code/userId/certificate/projectId123/abc-uuid-124/attestation.pdf
                            cloudStorage: AZURE
                    meta: {}
                example2:
                  value:
                    responseCode: OK
                    message: Signed Url Generated Successfully.
                    result:
                      logoResourceId:
                        files:
                          - file: tenant_code/org_code/userId/logo/logoResourceId/xyz-uuid-789/company-logo.svg
                            url: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/logo/logoResourceId/xyz-uuid-789/company-logo.svg?sv=2023-01-03&st=2024-05-08T10%3A00%3A00Z&se=2024-05-08T14%3A00%3A00Z&sr=b&sp=w&sig=LOGO_SIGNATURE'
                            downloadableUrl: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/logo/logoResourceId/xyz-uuid-789/company-logo.svg?sv=2023-01-03&st=2024-05-08T10%3A00%3A00Z&se=2024-05-08T14%3A00%3A00Z&sr=b&sp=r&sig=LOGO_SIGNATURE'
                            payload:
                              sourcePath: tenant_code/org_code/userId/logo/logoResourceId/xyz-uuid-789/company-logo.svg
                            cloudStorage: AZURE
                    meta: {}

  /scp/v1/cloud-services/getDownloadableUrl:
    post:
      operationId: getDownloadableUrl
      summary: Generate Downloadable URLs for Files
      tags:
        - Cloud Services
      description: |-
        This API generates temporary signed URLs for downloading files stored in cloud storage with read-only access. Used by clients to retrieve certificates, documents, templates, and other files previously uploaded with time-limited validity for security. Processes batch file requests and returns download URLs scoped to the authenticated user's organization and tenant. Supports Azure Blob Storage and other cloud providers configured in the system.

        **Validations**:
        - `filePaths` array is required and must contain at least one valid file path (minimum 1)
        - Each file path must follow format: `tenant_code/organization_code/userId/reference_type/resourceId/uniqueId/filename`
        - File paths must exist and be accessible in cloud storage
        - Empty or null file paths are skipped during processing
        - Batch processing continues even if individual files fail (partial results returned)

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Required for all requests. Token provides user context (organization_code, tenant_code, user_id).'
          required: true
          schema:
            type: string
      requestBody:
        description: 'Request object containing array of cloud storage file paths to generate downloadable URLs for'
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filePaths
              properties:
                filePaths:
                  type: array
                  minItems: 1
                  description: 'Array of cloud storage file paths to generate signed downloadable URLs. Each path should follow the format: tenant_code/organization_code/userId/reference_type/resourceId/uniqueId/filename'
                  items:
                    type: string
                  example:
                    - tenant_code/org_code/userId/certificate/project1/abc-uuid-123/certificate.pdf
                    - tenant_code/org_code/userId/logo/org1/xyz-uuid-789/logo.png
            examples:
              example1:
                summary: Multiple file downloads
                value:
                  filePaths:
                    - tenant_code/org_code/userId/certificate/project1/abc-uuid-123/certificate.pdf
                    - tenant_code/org_code/userId/certificate/project1/abc-uuid-124/attestation.pdf
                    - tenant_code/org_code/userId/signature/sig1/pqr-uuid-456/signature.jpg
              example2:
                summary: Single file download
                value:
                  filePaths:
                    - tenant_code/org_code/userId/logo/logoId/xyz-uuid-789/company-logo.svg

      responses:
        '200':
          description: 'Downloadable URLs generated successfully with read-only access'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response status code (OK for success, CLIENT_ERROR for failure)'
                    example: 'OK'
                  message:
                    type: string
                    description: 'Status message from en.json locales file'
                    example: 'Download Url Generated Successfully.'
                  result:
                    type: array
                    description: 'Array of file objects containing download URLs and metadata'
                    items:
                      type: object
                      required:
                        - cloudStorage
                        - filePath
                        - url
                      properties:
                        cloudStorage:
                          type: string
                          description: 'Cloud storage provider name (configured in environment)'
                          example: 'AZURE'
                        filePath:
                          type: string
                          description: 'Original cloud storage file path provided in request'
                          example: 'tenant_code/org_code/userId/certificate/project1/abc-uuid-123/certificate.pdf'
                        url:
                          type: string
                          description: 'Signed URL for downloading file (GET) with read-only permission. Valid for configured expiry time (typically a few hours)'
                          example: 'https://storageaccount.blob.core.windows.net/container/tenant_code/org_code/userId/certificate/project1/abc-uuid-123/certificate.pdf?sv=2023-01-03&st=2024-05-08T10%3A00%3A00Z&se=2024-05-08T14%3A00%3A00Z&sr=b&sp=r&sig=DOWNLOAD_SIGNATURE'
                  meta:
                    type: object
