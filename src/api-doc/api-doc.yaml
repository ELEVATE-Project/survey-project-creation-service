  '/scp/v1/projects/update/{projectId}':
    post:
      summary: Create or Update Project
      tags:
        - Projects
      operationId: updateProject
      description: |-
        **Overview**:
        - Creates a new project or updates an existing project based on whether `projectId` is provided
        - Project creation supports cloning from an existing published project using `reference_id` query parameter
        - Requires authentication token with user organization and tenant context
        - Project data is uploaded to cloud storage (blob_path) for persistence
        - Project status transitions: DRAFT (creation) → SUBMITTED → IN_REVIEW → APPROVED/REJECTED → PUBLISHED
        - Projects in PUBLISHED, REJECTED, REJECTED_AND_REPORTED, SUBMITTED, or INPROGRESS status cannot be updated

        **Validation Rules**:
        - `title` is required and must not exceed character limit (validated by utils.validateTitle)
        - `projectId` must be a valid integer (1 to 2147483647) for updates
        - `reference_id` cannot be used with `projectId` (only for creation)
        - `reference_id` must reference a PUBLISHED project in the same organization and tenant
        - Project must be in DRAFT or CREATION stage for updates, unless reviewer requested changes
        - Cannot update projects in COMPLETION stage
        - When reviewer requests changes, `is_under_edit` is automatically set to true
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: projectId
          description: 'Project ID for update operations (numeric, 1-2147483647). Omit or leave empty for project creation.'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          required: false
          example: 1
        - in: query
          name: reference_id
          description: 'Optional. ID of published project to clone during creation (numeric). Creates new project with copied structure, tasks, and configurations. Cannot be used with projectId. New project created in DRAFT status.'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          required: false
          example: 3
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The title of the project
                categories:
                  description: Categories associated with the project
                  type: object
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                recommended_duration:
                  description: Object containing information about the recommended duration.
                  type: object
                  properties:
                    type:
                      type: string
                      description: 'Type of recommended duration (e.g., "days", "hours").'
                    number:
                      description: The numeric value representing the recommended duration.
                      type: number
                keywords:
                  type: array
                  items:
                    type: string
                  description: The keywords associated with the project.
                recommended_for:
                  description: List of recommended designations for the project.
                  type: object
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                languages:
                  description: List of languages associated with the project.
                  type: object
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                learning_resources:
                  description: List of learning resources related to the project.
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        description: The name of the learning resource.
                        type: string
                      url:
                        description: The URL of the learning resource.
                        type: string
                solution_details:
                  type: object
                  description: Details about the observation solution.
                licence:
                  description: The license associated with the project.
                  type: object
                  properties:
                    label:
                      type: string
