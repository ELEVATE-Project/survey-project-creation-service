  '/scp/v1/programs/submitForReview/{id}':
    post:
      summary: Submit Program for Review
      tags:
        - Programs
      description: |-
        Use this API to submit a program for review.
        - The API endpoint for submitting the program for review is `/scp/v1/programs/submitForReview/{id}`.
        - It is mandatory to provide values for parameters marked as `required`.
        - The `id` parameter is mandatory and cannot be empty or null.
      parameters:
        - name: X-auth-token
          in: header
          description: The `X-auth-token` is required to use this API. It is available in the login API response.
          required: true
          schema:
            type: string
        - in: path
          name: id
          description: A valid program ID must be appended to the request URL.
          schema:
            type: integer
          required: true
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewer_ids:
                  description: The IDs of the reviewers assigned to review the project.
                  type: array
                  items:
                    type: string
                notes:
                  description: Additional notes for the reviewer.
                  type: string
            examples:
              example1:
                summary: Example when specific reviewers are selected
                description: 'When specific reviewers are selected, their user IDs are sent as an array, and the project is assigned to those reviewers.'
                value:
                  reviewer_ids:
                    - 23
                    - 25
                  notes: Note to the reviewer
              example2:
                summary: Example when sending to all reviewers
                description: 'When the project is sent to all reviewers, the API does not expect any body parameters, and the project will be available for all reviewers according to other factors.'
                value: {}
      responses:
        '201':
          description: Your program has been sent for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            type:
                              type: string
                            version:
                              type: integer
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Your program has been sent for review
                    meta:
                      formsVersion:
                        - id: 3
                          type: projectCreation
                          version: 3
        '400':
          description: Bad Request. Program not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteProgram400Response'
