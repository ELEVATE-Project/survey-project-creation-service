    delete:
      summary: Delete Program
      tags:
        - Programs
      description: |-
        **Overview**:
        - Soft deletes a program from the system (paranoid deletion)
        - Only programs in DRAFT status can be deleted
        - Validates program belongs to authenticated user
        - Program record marked as deleted but preserved in database

        **Validation Rules**:
        - `id` must be a valid integer (program ID, 1 to 2147483647)
        - Program must exist and belong to authenticated user (user_id match)
        - Program status must be DRAFT (cannot delete programs in other statuses)
        - Program must belong to user's organization and tenant
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id for ownership validation.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          description: 'Program ID to delete (integer, required, 1 to 2147483647). Program must be in DRAFT status and belong to authenticated user.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1

      responses:
        '202':
          description: 'Program deleted successfully (soft delete accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: Program deleted successfully
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            type:
                              type: string
                            version:
                              type: integer
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Program deleted successfully
                    meta:
                      formsVersion:
                        - id: 3
                          type: projectCreation
                          version: 3
        '400':
          description: 'Bad Request - Program not found or does not meet deletion criteria'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteProgram400Response'
