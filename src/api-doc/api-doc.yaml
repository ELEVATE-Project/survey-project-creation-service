  /scp/v1/resource/upForReview:
    get:
      summary: Up For Review Resource List
      tags:
        - Resource
      description: |-
        **Overview**:
        - Retrieves paginated list of resources assigned to reviewer or available for review
        - Supports sequential and parallel review workflows based on organization configuration
        - Filters resources based on reviewer assignments and review status
        - Excludes resources already reviewed (APPROVED, REJECTED, REQUESTED_FOR_CHANGES)
        - Returns resources with creator details, organization info, and review status
        - Excludes authenticated reviewer's own created resources
        - Includes in_progress_count for resources currently under review by the reviewer

        **Validation Rules**:
        - `type` must be from allowed values: project, program, survey, observation, observation_with_rubric
        - `status` must be from: INPROGRESS, NOT_STARTED, CHANGES_UPDATED, STARTED
        - `page` defaults to 1 (minimum 1)
        - `limit` defaults to 100 (maximum 100)
        - `search` performs case-insensitive title matching
        - Resources filtered by reviewer role and organization policies
        - Sequential review: only shows resources at correct review stage
        - Parallel review: shows all resources available for review
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains reviewer_id (user_id), organization_code, tenant_code, roles, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: page
          in: query
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided. Minimum value is 1.'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100. Values exceeding 100 will be capped at 100.'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          example: 10
        - name: search
          in: query
          description: 'Search text to filter resources by title (case-insensitive, uses iLike matching).'
          required: false
          schema:
            type: string
          example: 'education'
        - name: type
          in: query
          description: 'Resource type filter. Comma-separated values allowed for multiple types: project, program, observation, survey, observation_with_rubric.'
          required: false
          schema:
            type: string
          example: 'project,program'
        - name: status
          in: query
          description: 'Review status filter. Allowed values: INPROGRESS (currently reviewing), NOT_STARTED (not yet started), CHANGES_UPDATED (creator updated after changes requested), STARTED (review started). If INPROGRESS specified, only shows resources actively being reviewed by the user.'
          required: false
          schema:
            type: string
            enum:
              - INPROGRESS
              - NOT_STARTED
              - CHANGES_UPDATED
              - STARTED
          example: INPROGRESS
        - name: sort_by
          in: query
          description: 'Sort field. Options: status, title, created_at. Default sorting is by created_at if not specified.'
          required: false
          schema:
            type: string
            enum:
              - status
              - title
              - created_at
          example: status
        - name: sort_order
          in: query
          description: 'Sort order: asc (ascending) or desc (descending). Default is desc.'
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
          example: asc
      responses:
        '200':
          description: 'Resources listed successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
