          description: 'Entity created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code (OK for success)'
                  message:
                    type: string
                    description: 'Response message (ENTITY_CREATED_SUCCESSFULLY)'
                  result:
