  /scp/v1/resource/getPublishedResources:
    get:
      summary: Browse Existing List
      tags:
        - Resource
      description: |-
        **Overview**:
        - Retrieves paginated list of published resources filtered by user's role-based permissions
        - Supports resource types: project, program, survey, observation, observation_with_rubric
        - Applies organization visibility policies (CURRENT, ASSOCIATED, ALL) to control resource access
        - Resources filtered by PUBLISHED status and is_reusable flag
        - Includes creator details, reviewer names, and organization information
        - Supports search, filtering, and sorting capabilities
        - Default sort by updated_at if not specified

        **Validation Rules**:
        - `type` must be from allowed values: project, program, survey, observation, observation_with_rubric
        - Multiple types supported as comma-separated values
        - User must have role permissions for requested resource types
        - `page` defaults to 1 (minimum 1)
        - `limit` defaults to 100 (maximum 100)
        - `search` performs case-insensitive title matching
        - Organization visibility policy enforced based on organization configuration
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, roles array, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: page
          in: query
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided. Minimum value is 1.'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100. Values exceeding 100 will be capped at 100.'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          example: 10
        - name: search
          in: query
          description: 'Search text to filter resources by title (case-insensitive, uses iLike matching).'
          required: false
          schema:
            type: string
          example: 'education'
        - name: type
          in: query
          description: 'Resource type filter. Comma-separated values allowed for multiple types. Must be from: project, program, observation, survey, observation_with_rubric. Only types allowed by user role permissions will be returned.'
