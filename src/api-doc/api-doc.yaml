    post:
      summary: Add or Update Comment
      tags:
        - Comment
      description: |-
        You can use this API to create or update comment
         - The API Endpoint for adding or updating a comment is `/scp/v1/comments/update` 
         - It is mandatory to provide values for parameters which are marked as `required` 
         - This is a mandatory parameter and cannot be empty or null.
         - In case of bulk comment update , pass the body with `comment` as an array of objects with mandatory fields.
         - In case of single comment update , pass the comment id and body with `comment` as an object with mandatory fields.
         - If you are creating a comment for the first time. Its status can be DRAFT/OPEN not RESOLVED for the first time. It is handled in backend.
      parameters:
        - name: X-auth-token
          in: header
          description: 'To use this API, you require an X-auth-token. This is available in the login API Response.'
          required: true
          schema:
            type: string
        - in: path
          name: id
          description: Please append a valid comment Id to the Request URL. Id is not mandatory
          schema:
            type: number
          required: true
          example: 2
        - in: query
          name: resource_id
          description: Please append a valid resource Id to the Request URL.
          schema:
            type: number
          required: true
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  oneOf:
                    - type: object
                      properties:
                        id:
                          type: integer
                          description: ID of the comment
                        resource_id:
                          type: integer
                          description: ID of the resource associated with the comment
                        text:
                          type: string
                          description: The actual content of the comment
                        parent_id:
                          type: integer
                          description: 'ID of the parent comment, if applicable'
                        status:
                          type: string
                          description: 'Status of the comment (e.g., "OPEN", "DRAFT", "RESOLVED")'
                        context:
                          type: string
                          description: 'Context of the comment (e.g., "page" or any tag)'
                        page:
                          type: string
                          description: 'Page number associated with the comment (e.g., "1")'
                        is_read:
                          type: boolean
                          description: Whether the comment has been read
                    - type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: ID of the comment
                          resource_id:
                            type: integer
                            description: ID of the resource associated with the comment
                          text:
                            type: string
                            description: The actual content of the comment
                          user_id:
                            type: string
                            description: ID of the user who made the comment
                          parent_id:
                            type: integer
                            description: 'ID of the parent comment, if applicable'
                          status:
                            type: string
                            description: 'Status of the comment (e.g., "OPEN", "DRAFT", "RESOLVED")'
                          resolved_by:
                            type: string
                            description: 'ID of the user who resolved the comment, if applicable'
                          resolved_at:
                            type: string
                            format: date-time
                            description: Timestamp when the comment was resolved
                          context:
                            type: string
                            description: 'Context of the comment (e.g., "page" or any tag)'
                          page:
                            type: string
                            description: 'Page number associated with the comment (e.g., "1")'
                          is_read:
                            type: boolean
                            description: Whether the comment has been read
                          created_at:
                            type: string
                            format: date-time
                            description: Timestamp when the comment was created
                          updated_at:
                            type: string
                            format: date-time
                            description: Timestamp when the comment was last updated
                          deleted_at:
                            type: string
                            format: date-time
                            description: 'Timestamp when the comment was deleted, if applicable'
                          commenter:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: ID of the commenter
                              name:
                                type: string
                                description: Name of the commenter
                          resolver:
                            type: object
                            description: 'Details of the user who resolved the comment, if applicable'
            examples:
              array_of_comments:
                value:
                  comment:
                    - id: 26
                      resource_id: 371
                      text: Check spelling
                      user_id: '102'
                      parent_id: 0
                      status: RESOLVED
                      resolved_by: null
                      resolved_at: null
                      context: page
                      page: '1'
                      is_read: false
                    - resource_id: 371
                      text: Check spelling
                      user_id: '102'
                      parent_id: 0
                      status: OPEN
                      resolved_by: null
                      resolved_at: null
                      context: page
                      page: '1'
                      is_read: false
              one_comment:
                value:
                  comment:
                    id: 26
                    resource_id: 371
                    text: Check spelling
                    user_id: '102'
                    parent_id: 0
                    status: RESOLVED
                    resolved_by: null
                    resolved_at: null
                    context: page
                    page: '1'
                    is_read: false
                    created_at: '2024-08-27T13:25:02.752Z'
                    updated_at: '2024-08-27T13:25:02.752Z'
                    deleted_at: null
                    commenter:
                      id: 102
                      name: Default Org Admin Two
                    resolver: {}
      responses:
