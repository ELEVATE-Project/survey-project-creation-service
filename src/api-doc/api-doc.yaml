        **Validations**:
        - `type` must be from allowed values: project, program, survey, observation, observation_with_rubric
        - `status` must be from: INPROGRESS, NOT_STARTED, CHANGES_UPDATED, STARTED
        - `page` must be positive integer (1-indexed, defaults to 1)
        - `limit` must be between 1 and 100 (defaults to 100, capped at 100)
        - `search` performs case-insensitive title matching if provided
        - `sort_by` must be from: status, title, created_at (defaults to created_at)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains reviewer_id (user_id), organization_code, tenant_code, roles, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: page
          in: query
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided. Minimum value is 1.'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100. Values exceeding 100 will be capped at 100.'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          example: 10
        - name: search
          in: query
          description: 'Search text to filter resources by title (case-insensitive, uses iLike matching).'
          required: false
          schema:
            type: string
          example: 'education'
        - name: type
          in: query
          description: 'Resource type filter. Comma-separated values allowed for multiple types: project, program, observation, survey, observation_with_rubric.'
          required: false
          schema:
            type: string
          example: 'project,program'
        - name: status
          in: query
          description: 'Review status filter. Allowed values: INPROGRESS (currently reviewing), NOT_STARTED (not yet started), CHANGES_UPDATED (creator updated after changes requested), STARTED (review started). If INPROGRESS specified, only shows resources actively being reviewed by the user.'
          required: false
          schema:
            type: string
            enum:
              - INPROGRESS
              - NOT_STARTED
              - CHANGES_UPDATED
              - STARTED
          example: INPROGRESS
        - name: sort_by
          in: query
          description: 'Sort field. Options: status, title, created_at. Default sorting is by created_at if not specified.'
          required: false
          schema:
            type: string
            enum:
              - status
              - title
              - created_at
          example: status
        - name: sort_order
          in: query
          description: 'Sort order: asc (ascending) or desc (descending). Default is desc.'
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
          example: asc
      responses:
        '200':
          description: 'Resources listed successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: RESOURCE_LISTED_SUCCESSFULLY
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: 'Unique resource ID'
                            title:
                              type: string
                              description: 'Resource title'
                            type:
                              type: string
                              description: 'Resource type (project, program, survey, observation, observation_with_rubric)'
                            organization:
                              type: object
                              description: 'Organization details'
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                code:
                                  type: string
                            status:
                              type: string
                              description: 'Resource status (SUBMITTED, IN_REVIEW, INPROGRESS, APPROVED)'
                            stage:
                              type: string
                              description: 'Resource stage (CREATION, REVIEW, COMPLETION)'
                            submitted_on:
                              type: string
                              format: date-time
                              description: 'Timestamp when resource was submitted for review'
                            last_reviewed_on:
                              type: string
                              format: date-time
                              description: 'Timestamp of last review action'
                            created_at:
                              type: string
                              format: date-time
                              description: 'Timestamp when resource was created'
                            published_id:
                              type: string
                              description: 'Published resource ID from consumption portal (if previously published)'
                            published_on:
                              type: string
                              format: date-time
                              description: 'Timestamp when resource was published'
                            creator:
                              type: string
                              description: 'Name of resource creator'
                            notes:
                              type: string
                              description: 'Notes to reviewer from creator'
                            review_status:
                              type: string
                              description: 'Reviewer-specific review status (NOT_STARTED, STARTED, INPROGRESS, CHANGES_UPDATED)'
                            start_date:
                              type: string
                              format: date-time
                              description: 'Program start date (only for program type)'
                            end_date:
                              type: string
                              format: date-time
                              description: 'Program end date (only for program type)'
                      count:
                        type: integer
                        description: 'Total count of resources matching the filter'
                      in_progress_count:
                        type: integer
                        description: 'Count of resources currently being reviewed (INPROGRESS status) by the reviewer'
              examples:
                projectExample:
                  value:
                    responseCode: OK
                    message: Resource listed successfully
                    result:
                      data:
                        - id: 4
                          title: sample project
                          type: project
                          organization:
                            id: 24
