paths:
  /scp/v1/modules/create:
    post:
      summary: Create Module
      tags:
        - Modules
      description: |-
        Creates a new module in the system. Modules serve as foundational building blocks that organize and manage different types of resources (projects, programs, surveys, observations).

        **Access Control**: Admin-only API. Requires `admin` or `org_admin` role.

        **Business Rules**:
        - Module code must be globally unique across the system
        - Code must contain only letters, hyphens, and underscores (no spaces)
        - Code must follow naming convention (lowercase or mixed case with separators)
        - Status defaults to ACTIVE if not provided
        - Module code cannot be empty or null

        **Use Cases**:
        - Define new module types for resource management
        - Extend system capabilities with custom modules
        - Create foundational structure for permissions and role mapping

        **Important Notes**:
        - Once created, module code is immutable
        - Modules are referenced in permissions and role mappings
        - Cannot create modules with reserved names
      operationId: createModule
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Module object with code and optional status'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Unique module identifier. Must contain only letters, hyphens, and underscores (no spaces, no numbers)'
                  example: 'projects'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Module status. Defaults to ACTIVE if not provided. ACTIVE: Module is available for use, INACTIVE: Module is disabled'
                  example: ACTIVE
              required:
                - code
            examples:
              example1:
                summary: 'Create Active Module'
                value:
                  code: projects
                  status: ACTIVE
              example2:
                summary: 'Create Module (Status Optional)'
                value:
                  code: observations
      responses:
        '201':
          description: 'Module created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Module created successfully'
                  result:
                    type: object
                    description: 'Created module details'
                    properties:
                      id:
                        type: number
                        description: 'Unique module ID assigned by system'
                        example: 6
                      code:
                        type: string
                        description: 'Module code identifier'
                        example: 'projects'
                      status:
                        type: string
                        enum: [ACTIVE, INACTIVE]
                        description: 'Module status'
                        example: ACTIVE
                  meta:
                    type: object
                    description: 'Response metadata'
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for tracing'
              examples:
                example1:
                  summary: 'Successful Module Creation'
                  value:
                    responseCode: OK
                    message: Module created successfully
                    result:
                      id: 6
                      code: projects
                      status: ACTIVE
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
        '400':
          description: 'Bad Request - Invalid input or duplicate module code'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  error:
                    type: array
                    items:
                      type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                  message:
                    type: string
              examples:
                example1:
                  summary: 'Module Code Already Exists'
                  value:
                    responseCode: CLIENT_ERROR
                    error: []
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
                    message: module already exists
  '/scp/v1/modules/update/{id}':
    post:
      summary: Update Module
      tags:
        - Modules
      description: |-
        Updates an existing module configuration. This endpoint allows administrators to modify module properties such as code or status.

        **Access Control**: Admin-only API. Requires `admin` or `org_admin` role.

        **Business Rules**:
        - Module must exist (ID must be valid)
        - Updated code must remain unique if changed
        - Cannot update module ID itself
        - Status changes are audited for compliance

        **Use Cases**:
        - Deactivate/activate modules based on feature requirements
        - Update module configuration without recreating
        - Manage module lifecycle
      operationId: updateModule
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response'
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Module id
          required: true
          example: 6
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Unique code for modules.
              required:
                - code
            examples:
              example1:
                value:
                  code: projects
                  status: INACTIVE
      responses:
        '201':
          description: Created
          content:
            application/json: # Corrected from application.json
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      id:
                        type: number
                      status:
                        type: string
                      code:
                        type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Module updated successfully
                    result:
                      id: 6
                      code: projects
                      status: INACTIVE
                    meta:
                      correlation: dea5b252-75d2-40ed-a5a7-f8dec087467e
        '400':
          description: Bad Request. Module not Found.
          content:
            application/json: # Corrected from application.json
              schema:
                $ref: '#/components/schemas/updateModule400Response'
  /scp/v1/modules/list:
    get:
      summary: List Modules
      tags:
        - Modules
      description: |-
        Retrieves a paginated list of all modules in the system with optional filtering and search capabilities.

        **Access Control**: Admin-only API. Requires `admin` or `org_admin` role.

        **Features**:
        - Pagination support with configurable page size
        - Full-text search across module codes (partial match, case-insensitive)
        - Returns count of total matching modules
        - Search text cannot contain special characters

        **Query Parameters**:
        - `page`: Page number for pagination (1-indexed, defaults to 1)
        - `limit`: Records per page (defaults to 100, max 100)
        - `search`: Filter modules by code

        **Use Cases**:
        - Display all available modules
        - Search for specific module by code name
        - Implement paginated module listings
        - Monitor system modules
      operationId: listModules
      parameters:
        - name: X-auth-token
          required: true
          in: header
          description: 'Authentication token from login API response'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: page
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided or invalid'
          schema:
            type: number
            minimum: 1
            default: 1
          example: 1
          required: false
        - in: query
          name: limit
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100'
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 100
          example: 10
          required: false
        - in: query
          name: search
          description: 'Search term to filter modules by code (partial match, case-insensitive). Cannot contain special characters. Optional parameter'
          schema:
            type: string
            maxLength: 255
          example: projects
          required: false
      responses:
        '200':
          description: 'Modules retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Modules fetched successfully'
                  result:
                    type: object
                    description: 'Paginated modules data'
                    properties:
                      data:
                        type: array
                        description: 'List of modules for current page'
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                              description: 'Unique module ID'
                              example: 6
                            code:
                              type: string
                              description: 'Module code identifier'
                              example: 'projects'
                            status:
                              type: string
                              enum: [ACTIVE, INACTIVE]
                              description: 'Module status'
                              example: ACTIVE
                          required:
                            - id
                            - code
                            - status
                      count:
                        type: number
                        description: 'Total number of modules matching the search criteria'
                        example: 4
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for tracing'
                        example: '4cbb42f7-ed92-41a1-b93d-d689121cda08'
              examples:
                example1:
                  summary: 'List All Modules (Default Pagination)'
                  value:
                    responseCode: OK
                    message: Modules fetched successfully
                    result:
                      data:
                        - id: 6
                          code: projects
                          status: ACTIVE
                        - id: 2
                          code: observation
                          status: ACTIVE
                        - id: 4
                          code: program
                          status: ACTIVE
                        - id: 5
                          code: system
                          status: ACTIVE
                      count: 4
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
                example2:
                  summary: 'Search Modules by Code'
                  value:
                    responseCode: OK
                    message: MODULES_FETCHED_SUCCESSFULLY
                    result:
                      data:
                        - id: 6
                          code: projects
                          status: ACTIVE
                      count: 1
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
                example3:
                  summary: 'List Modules with Custom Pagination'
                  value:
                    responseCode: OK
                    message: MODULES_FETCHED_SUCCESSFULLY
                    result:
                      data:
                        - id: 2
                          code: observation
                          status: ACTIVE
                      count: 4
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
        '400':
          description: 'Bad Request - Invalid search text or parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getModuleList400Response'
  '/scp/v1/modules/delete/{id}':
    delete:
      summary: Delete Module
      tags:
        - Modules
      description: |-
        Soft deletes a module from the system. The module record is marked as deleted but preserved in the database for audit and compliance purposes.

        **Access Control**: Admin-only API. Requires `admin` or `org_admin` role.

        **Soft Delete Behavior**:
        - Module record is marked as deleted in the database (not permanently removed)
        - Deleted module cannot be accessed through normal API operations
        - Deleted module data is preserved for audit trails and compliance
        - Soft-deleted modules can be restored through database recovery if needed
        - Module code remains reserved and cannot be reused

        **Rules**:
        - Module ID must exist in the system
        - Module must not have already been deleted
        - Soft deletion is permanent (cannot be undone through API)

        **Important Notes**:
        - Use with caution in production environments
        - Deletion is logged with audit trail for compliance and security
        - Deleted module will not appear in list operations
        - Associated permissions still reference the deleted module code

        **Use Cases**:
        - Remove custom module definitions from active use
        - Archive outdated module structures while preserving history
        - Decommission modules with full audit trail
      operationId: deleteModule
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Unique module ID to soft delete (numeric, positive integer)'
          required: true
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 6
      responses:
        '200':
          description: 'Module deleted successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Module deleted successfully'
                  result:
                    type: object
                    description: 'Empty object on successful soft deletion'
                    properties: {}
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for audit trail'
              examples:
                example1:
                  summary: 'Successful Module Soft Deletion'
                  value:
                    responseCode: OK
                    message: MODULES_DELETED_SUCCESSFULLY
                    result: {}
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
        '400':
          description: 'Bad Request - Module not found or already deleted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateModule400Response'
  /scp/v1/permissions/create:
    post:
      summary: Create Permission
      tags:
        - Permissions
      description: |-
        Creates a new permission that maps an API endpoint to specific HTTP methods and modules. Permissions define granular access control for role-based authorization.

        **Access Control**: Admin-only API. Requires `admin` or `org_admin` role.

        **Rules**:
        - Permission code must be globally unique across the system
        - Code must contain only lowercase letters and underscores (no spaces, no uppercase, no hyphens, no numbers)
        - Module must exist in the system
        - API path must follow strict format pattern: `/[controller]/v[number]/[path]`
        - request_type must be an array with at least one HTTP method
        - Status defaults to ACTIVE if not provided
        - All fields must be non-empty and non-null

        **Use Cases**:
        - Define new API permissions for custom modules
        - Map endpoints to specific HTTP methods for role-based access
        - Create fine-grained access control for module operations
        - Support permission-to-role assignments
        - Multiple HTTP methods can be grouped under a single permission

        **Important Notes**:
        - Permission code must follow naming convention: `[action]_[resource]` (e.g., `create_project`, `list_user`)
        - API path format must start with `/scp` or similar service identifier
        - request_type accepts multiple methods: [GET], [POST], [GET, POST, DELETE], [GET, POST, PATCH, PUT, DELETE], etc.
        - Once created, permission properties should not change frequently
      operationId: createPermission
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Permission object mapping API endpoint to HTTP method and module'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-z_]+$'
                  description: 'Unique permission identifier. Must contain only lowercase letters and underscores (no spaces, numbers, uppercase, or hyphens)'
                  example: 'create_project'
                module:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Module name this permission belongs to (must exist in modules). Can contain letters, hyphens, and underscores'
                  example: 'projects'
                request_type:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PATCH, PUT, DELETE]
                  minItems: 1
                  description: 'Array of HTTP methods this permission grants access to. Can contain one or multiple methods (e.g., [POST], [GET, POST], [GET, POST, PATCH, PUT, DELETE])'
                  example: ['POST']
                api_path:
                  type: string
                  minLength: 5
                  description: 'API endpoint path following format: /[controller name]/v[number]/[path]. Pattern: /scp/v1/projects/create or /scp/v1/projects/:id'
                  example: '/scp/v1/projects/create'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Permission status. Defaults to ACTIVE if not provided. ACTIVE: Available for role assignment, INACTIVE: Disabled'
                  example: ACTIVE
              required:
                - code
                - module
                - request_type
                - api_path
            examples:
              example1:
                value:
                  code: create_project
                  module: projects
                  request_type: [POST]
                  api_path: /scp/v1/projects/create
                  status: ACTIVE
              example2:
                summary: 'Create GET Permission for Project List'
                value:
                  code: list_project
                  module: projects
                  request_type: [GET]
                  api_path: /scp/v1/projects/list
              example3:
                summary: 'Create Multiple Methods Permission'
                value:
                  code: project_full_access
                  module: projects
                  request_type: [GET, POST, PATCH, PUT, DELETE]
                  api_path: /scp/v1/projects/:id
      responses:
        '201':
          description: 'Permission created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'PERMISSION_CREATED_SUCCESSFULLY'
                  result:
                    type: object
                    description: 'Created permission details'
                    properties:
                      id:
                        type: number
                        description: 'Unique permission ID assigned by system'
                        example: 18
                      code:
                        type: string
                        description: 'Permission code identifier'
                        example: 'create_project'
                      module:
                        type: string
                        description: 'Module name'
                        example: 'projects'
                      request_type:
                        type: array
                        items:
                          type: string
                          enum: [GET, POST, PATCH, PUT, DELETE]
                        description: 'Array of HTTP methods'
                        example: ['POST']
                      status:
                        type: string
                        enum: [ACTIVE, INACTIVE]
                        description: 'Permission status'
                        example: ACTIVE
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID'
              examples:
                example1:
                  summary: 'Successful Permission Creation'
                  value:
                    responseCode: OK
                    message: Permission created successfully
                    result:
                      id: 18
                      code: create_project
                      module: projects
                      request_type: [POST]
                      status: ACTIVE
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
        '400':
          description: 'Bad Request - Invalid input or duplicate permission code'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  error:
                    type: array
                    items:
                      type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                  message:
                    type: string
              examples:
                example1:
                  value:
                    responseCode: CLIENT_ERROR
                    error: []
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
                    message: permission already exists
    parameters: []
  '/scp/v1/permissions/update/{id}':
    post:
      summary: Update Permission
      tags:
        - Permissions
      description: |-
        Updates an existing permission mapping API endpoint to HTTP methods and modules. Allows modification of permission properties such as code, module, request methods, and status.

        **Access Control**: Admin-only API. Requires `admin` or `org_admin` role.

        **Rules**:
        - Permission ID must exist in the system
        - Permission must not have already been deleted
        - Updated code must remain unique across the system if changed
        - Code must contain only lowercase letters and underscores (no spaces, no uppercase, no hyphens, no numbers)
        - Module must exist in the system
        - request_type must be an array with at least one HTTP method
        - API path must follow strict format pattern: `/[controller]/v[number]/[path]`
        - All fields must be non-empty and non-null when provided
        - Status field is optional and defaults to current value if not provided

        **Use Cases**:
        - Modify permission code while maintaining uniqueness
        - Update HTTP methods granted by a permission
        - Change module association for a permission
        - Update permission status (ACTIVE/INACTIVE)
        - Deactivate permissions without deleting them

        **Important Notes**:
        - Permission ID must be a valid positive integer
        - Code changes trigger uniqueness validation across all permissions
        - Response returns updated permission details in same format as create
        - All validation rules from permission creation apply to updates
        - Update is permanent and cannot be undone through API
      parameters:
        - name: X-auth-token
          in: header
          description: 'To use this API, you require an X-auth-token. This is available in the login API Response.'
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Id of the permission to update.
          required: true
          schema:
            type: number
          example: 2
      requestBody:
        description: 'Permission update object with code, module, request_type, api_path, and optional status'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-z_]+$'
                  description: 'Unique permission identifier. Must contain only lowercase letters and underscores (no spaces, numbers, uppercase, or hyphens). Code must remain unique after update'
                  example: 'create_project'
                module:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Module name this permission belongs to (must exist in modules). Can contain letters, hyphens, and underscores'
                  example: 'projects'
                request_type:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PATCH, PUT, DELETE]
                  minItems: 1
                  description: 'Array of HTTP methods this permission grants access to. Can contain one or multiple methods (e.g., [POST], [GET, POST], [GET, POST, PATCH, PUT, DELETE])'
                  example: ['POST']
                api_path:
                  type: string
                  minLength: 5
                  description: 'API endpoint path following format: /[controller name]/v[number]/[path]. Pattern: /scp/v1/projects/create or /scp/v1/projects/:id'
                  example: '/scp/v1/projects/create'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Permission status. ACTIVE: Available for role assignment, INACTIVE: Disabled. Optional field - if not provided, current status is maintained'
                  example: ACTIVE
              required:
                - code
                - module
                - request_type
                - api_path
            examples:
              example1:
                summary: 'Update Permission Code and Status'
                value:
                  code: update_project
                  module: projects
                  request_type: [PUT]
                  api_path: /scp/v1/projects/:id
                  status: ACTIVE
              example2:
                summary: 'Update Multiple HTTP Methods'
                value:
                  code: project_full_access
                  module: projects
                  request_type: [GET, POST, PATCH, PUT, DELETE]
                  api_path: /scp/v1/projects/:id
              example3:
                summary: 'Deactivate Permission (Status Update Only)'
                value:
                  code: create_project
                  module: projects
                  request_type: [POST]
                  api_path: /scp/v1/projects/create
                  status: INACTIVE
      responses:
        '201':
          description: 'Permission updated successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                    description: 'Response status code'
                  message:
                    type: string
                    example: 'PERMISSION_UPDATED_SUCCESSFULLY'
                    description: 'Response message'
