  /scp/v1/certificates/update:
    post:
      summary: Create certificate base template
      tags:
        - Certificate
      description: |-
        This API creates a new certificate base template with code, name, and metadata for generating customized organizational certificates. Certificate templates define the base design and branding structure with configurable logos and signature placements. Used in certificate management settings to add new template configurations for different certificate layouts and resource types. This API enables organizations to establish standardized certificate designs for their certificates across resources.

        **Overview:**
        - Creates new certificate template with code, name, and metadata
        - Stores base SVG template URL in cloud storage
        - Configures logos and signatures array structure for template
        - Scoped to authenticated user's organization and tenant
        - Returns created template with ID and all properties

        **Validations:**
        - `code` is required (unique per organization and tenant combination)
        - `name` is required (display name for template)
        - `url` is required (cloud storage path to SVG template)
        - `resource_type` is required (must be one of configured RESOURCE_TYPES)
        - `meta` is required (JSON object containing logos and signatures arrays)
        - Logos must be array of objects with stateLogo field
        - Signatures must be array of objects with signature, signatureName, signatureDesignation fields
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token containing user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
                - url
                - resource_type
                - meta
              properties:
                code:
                  type: string
                  description: Unique code identifier for template (must be unique per org/tenant)
                  example: two_logo_two_sign
                name:
                  type: string
                  description: Display name for the certificate template
                  example: Two Logo Two Signature
                url:
                  type: string
                  description: Cloud storage URL path to base SVG template
                  example: 'https://blob.storage.com/templates/two_logo_two_sig.svg?sv=2023'
                resource_type:
                  type: string
                  description: Resource type this template is for (e.g., project, program)
                  example: project
                meta:
                  type: object
                  required:
                    - logos
                    - signatures
                  description: Template configuration including logos, signatures, and QR code details
                  properties:
                    logos:
                      type: array
                      description: Array of logo configurations for the certificate template
                      items:
                        type: object
                        properties:
                          stateLogo:
                            type: string
                            description: State logo identifier
                            example: stateLogo1
                    signatures:
                      type: array
                      description: Array of signature configurations for the certificate template
                      items:
                        type: object
                        properties:
                          signature:
                            type: string
                            description: Signature image identifier
                            example: signatureImg1
                          signatureDesignation:
                            type: string
                            description: Designation title for the signature
                            example: signatureTitleDesignation1
                          signatureName:
                            type: string
                            description: Name associated with the signature
                            example: signatureTitleName1
                    QrCode:
                      type: string
                      nullable: true
                      description: QR code configuration (optional, can be null)
                      example: null
            examples:
              example1:
                value:
                  code: two_logo_two_sign
                  name: Two Logo Two Signature
                  resource_type: project
                  url: 'https://blob.storage.com/templates/cert_template.svg?sv=2023-01-03'
                  meta:
                    logos:
                      - stateLogo: stateLogo1
                      - stateLogo: stateLogo2
                    signatures:
                      - signature: signatureImg1
                        signatureDesignation: signatureTitleDesignation1
                        signatureName: signatureTitleName1
                      - signature: signatureImg2
                        signatureDesignation: signatureTitleDesignation2
                        signatureName: signatureTitleName2
                    QrCode: null
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                      code:
                        type: string
                      name:
                        type: string
                      url:
                        type: string
                      resource_type:
                        type: string
                      organization_code:
                        type: string
                      tenant_code:
                        type: string
                      meta:
                        type: object
                        properties:
                          logos:
                            type: array
                            items:
                              type: object
                              properties:
                                stateLogo:
                                  type: string
                          signatures:
                            type: array
                            items:
                              type: object
                              properties:
                                signature:
                                  type: string
                                signatureDesignation:
                                  type: string
                                signatureName:
                                  type: string
                          QrCode:
                            type: string
                            nullable: true
                      created_by:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
              examples:
