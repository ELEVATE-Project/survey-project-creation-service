  '/scp/v1/programs/publish/{id}':
    get:
      summary: Publish Program
      tags:
        - Programs
      description: |-
        **Overview**:
        - Publishes an approved program to make it available to target users
        - Validates program status (must be PUBLISHED or SUBMITTED)
        - Validates program details and resources before publishing
        - Updates program status to PUBLISHED and stage to COMPLETION
        - Records published_on timestamp

        **Validation Rules**:
        - `id` must be a valid integer (program ID, 1 to 2147483647)
        - Program must exist and user must have access
        - Program status must be PUBLISHED or SUBMITTED (cannot publish DRAFT, REJECTED programs)
        - Program must pass validation checks (all resources valid, no validation errors)
        - Program rollout must be created successfully
        - Rollout must publish successfully to distribution service
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Program ID to publish (integer, required, 1 to 2147483647). Program must be in valid status for publishing.'
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          example: 1
      responses:
        '200':
          description: 'You have successfully published the program'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'You have successfully published the program'
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: 'Program ID that was published'
                        example: 1
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            type:
                              type: string
                            version:
                              type: integer
        '400':
          description: 'Bad Request - Program not found, invalid status, or validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: CLIENT_ERROR
                  message:
                    type: string
                    example: 'This Program cannot be published.'
                  result:
                    type: object
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: string
