            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code (OK for success)'
                  message:
                    type: string
                    description: 'Response message (ENTITY_UPDATED_SUCCESSFULLY)'
                  result:
                    type: object
                    description: 'Updated entity object with all fields'
                    properties:
                      id:
                        type: number
                        description: 'Unique entity ID (auto-incremented, numeric, immutable)'
                      value:
                        type: string
                        description: 'Entity value (lowercase version)'
                      label:
                        type: string
                        description: 'Entity label as updated'
                      status:
                        type: string
                        description: 'Entity status (ACTIVE or INACTIVE)'
