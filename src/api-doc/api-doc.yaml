  '/scp/v1/rollouts/update/{rolloutid}':
    patch:
      summary: Update Rollout
      tags:
        - Rollout
      description: |-
        **Overview**:
        - Updates an existing rollout by ID
        - Validates user ownership (only creator can update their rollout)
        - Prevents changing resource_id if rollout is already published
        - Supports updating targeting criteria by state, entity type, districts, roles, and sub-roles
        - Allows updating viewer assignments and date range configuration
        - Returns rollout ID upon successful update

        **Validation Rules**:
        - `rolloutid` must be a valid integer (rollout ID, 1 to 2147483647)
        - Rollout must exist and belong to authenticated user (user_id match)
        - Rollout must belong to user's organization and tenant
        - `title` is optional (string, cannot exceed max title length if provided)
        - `resource_id` cannot be changed if rollout is already published
        - `start_date` is optional (must be before end_date if both provided)
        - `end_date` is optional (must be after start_date if both provided)
        - `targeting_criteria` is optional array with state, entity_targeting, roles, sub_roles, districts
        - `viewers` is optional array of user IDs (integers)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
        - name: rolloutid
          in: path
          description: 'Rollout ID to update (integer, required, 1 to 2147483647). Rollout must belong to authenticated user.'
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          example: 1
