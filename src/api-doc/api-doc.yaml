  /scp/v1/config/list:
    get:
      summary: List Configurations
      tags:
        - Config APIs
      description: |-
        **Overview**:
        - Retrieves comprehensive configuration for organization and instance levels
        - Returns targeting criteria configuration from organization config
        - Fetches resource-specific configurations for all resource types
        - Includes instance-level settings like auto-save interval and note length
        - Prioritizes user's organization config, falls back to default organization
        - Merges database configs with environment defaults for missing resource types
        - Scoped to user's organization and tenant

        **Validation Rules**:
        - X-auth-token must be valid and contain organization_code and tenant_code
        - Returns default configurations from environment variables if not set in database
        - Data managers and program managers default to environment values if not configured
        - Resource visibility policies prioritize user's org over default org
