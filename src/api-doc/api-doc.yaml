openapi: 3.0.0
info:
  title: Elevate Survey Project Creation Portal Service
  version: 1.0.0
  description: |-
    ## Overview
    The **Survey Project Creation Portal Service (SCP)** is an enterprise-grade, multi-tenant resource design platform that enables organizations to create, review, and publish structured resources including Projects, Programs, Surveys, and Observations.

    ## Key Features
    - **Multi-Tenant Architecture**: Supports multiple organizations with isolated data and configurations
    - **Flexible Resource Types**: Projects ✅ | Programs ✅ | Surveys 🔄 | Observations 🔄 (Fully implemented or in development)
    - **Advanced Review Workflows**: Sequential or Parallel review processes with configurable approval requirements
    - **Comprehensive RBAC**: 7+ roles (admin, org_admin, content_creator, reviewer, program_designer, rollout_manager, etc.)
    - **Organization-Level Customization**: Override instance defaults per resource type and organization
    - **Component Management**: Forms, entities, review stages, and permissions management

    ## API Access
    - **Base URL**: `{context}/scp/v1`
    - **Authentication**: Required via `X-auth-token` header (available in login API response)

    ## Header Requirements
    - **`X-auth-token`**: (Required) Authentication token from login response
    - **`X-tenant-code`**: (Required for admin) System-wide tenant identifier; backend extracts from token for other role
    - **`X-organization-code`**: (Required for admin) Organization identifier; backend extracts from token for other role
    - **Note**: These headers are configurable based on system requirements

    ## Role-Based Access
    - **admin**: Full system access including all tenants and organizations
    - **org_admin**: Organization-level configuration and resource management
    - **content_creator**: Create and manage resources
    - **reviewer**: Review and approve/reject submissions
    - **program_designer**: Design and manage programs
    - **rollout_manager**: Manage single resource rollouts
    - **Note**: These roles are configurable based on system requirements

    ## Important Notes
    - All mandatory parameters marked as `required` cannot be empty or null
    - Responses follow standard HTTP status codes (2xx for success, 4xx for client errors, 5xx for server errors)
    - All timestamps are in ISO 8601 format (UTC)
    - Pagination available on list endpoints (page, limit parameters)
  contact:
    email: tech-infra@shikshalokam.org
servers:
  - url: 'http://localhost:6001'
    description: 'Local server. NB :- port may vary according to the local setup.'
  - url: 'https://dev.elevate-apis.shikshalokam.org/'
    description: DEV server
  - url: 'https://qa.elevate-apis.shikshalokam.org/'
    description: QA server
paths:
  /scp/v1/modules/create:
    post:
      summary: Create Module
      tags:
        - Modules
      description: |-
        Creates a new module in the system. Modules organize and manage different types of resources (projects, programs, surveys, observations).

        **Validation Rules**:
        - Module code must be globally unique and immutable after creation
        - Code must contain only letters, hyphens, and underscores (no spaces or special characters)
        - Code must follow naming convention in lowercase or mixed case with separators
        - Status defaults to ACTIVE if not provided
        - Code cannot be empty, null, or reserved
      operationId: createModule
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Module object with code and optional status'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Unique module identifier. Must contain only letters, hyphens, and underscores (no spaces, no numbers)'
                  example: 'projects'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Module status. Defaults to ACTIVE if not provided. ACTIVE: Module is available for use, INACTIVE: Module is disabled'
                  example: ACTIVE
              required:
                - code
            examples:
              example1:
                summary: 'Create Active Module'
                value:
                  code: projects
                  status: ACTIVE
              example2:
                summary: 'Create Module (Status Optional)'
                value:
                  code: observations
      responses:
        '201':
          description: 'Module created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Module created successfully'
                  result:
                    type: object
                    description: 'Created module details'
                    properties:
                      id:
                        type: number
                        description: 'Unique module ID assigned by system'
                        example: 6
                      code:
                        type: string
                        description: 'Module code identifier'
                        example: 'projects'
                      status:
                        type: string
                        enum: [ACTIVE, INACTIVE]
                        description: 'Module status'
                        example: ACTIVE
                  meta:
                    type: object
                    description: 'Response metadata'
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for tracing'
              examples:
                example1:
                  summary: 'Successful Module Creation'
                  value:
                    responseCode: OK
                    message: Module created successfully
                    result:
                      id: 6
                      code: projects
                      status: ACTIVE
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
        '400':
          description: 'Bad Request - Invalid input or duplicate module code'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  error:
                    type: array
                    items:
                      type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                  message:
                    type: string
              examples:
                example1:
                  summary: 'Module Code Already Exists'
                  value:
                    responseCode: CLIENT_ERROR
                    error: []
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
                    message: module already exists
  '/scp/v1/modules/update/{id}':
    post:
      summary: Update Module
      tags:
        - Modules
      description: |-
        Updates an existing module configuration including code and status properties.

        **Validation Rules**:
        - Module ID must exist and be valid
        - Updated code must remain unique across the system if changed
        - Code must contain only letters, hyphens, and underscores (no spaces or special characters)
        - Status must be either ACTIVE or INACTIVE
        - Module ID itself cannot be modified
      operationId: updateModule
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response'
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Module id
          required: true
          example: 6
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Unique code for modules.
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: Status of the module.
              required:
                - code
            examples:
              ModuleUpdate:
                value:
                  code: projects
                  status: INACTIVE
      responses:
        '201':
          description: Created
          content:
            application/json: # Corrected from application.json
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      id:
                        type: number
                      status:
                        type: string
                      code:
                        type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Module updated successfully
                    result:
                      id: 6
                      code: projects
                      status: INACTIVE
                    meta:
                      correlation: dea5b252-75d2-40ed-a5a7-f8dec087467e
        '400':
          description: Bad Request. Module not Found.
          content:
            application/json: # Corrected from application.json
              schema:
                $ref: '#/components/schemas/updateModule400Response'
  /scp/v1/modules/list:
    get:
      summary: List Modules
      tags:
        - Modules
      description: |-
        Retrieves a paginated list of all modules in the system with optional search and filtering.

        **Capabilities**:
        - Pagination with configurable page size (defaults to 10, max 100 per page)
        - Full-text search across module codes (partial match, case-insensitive)
        - Search text cannot contain special characters
        - Returns total count of matching modules

        **Query Parameters**:
        - `page`: Page number (1-indexed, defaults to 1)
        - `limit`: Records per page (defaults to 10, max 100)
        - `search`: Filter modules by code (optional, case-insensitive partial match)
      operationId: listModules
      parameters:
        - name: X-auth-token
          required: true
          in: header
          description: 'Authentication token from login API response'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: page
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided or invalid'
          schema:
            type: number
            minimum: 1
            default: 1
          example: 1
          required: false
        - in: query
          name: limit
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100'
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 100
          example: 10
          required: false
        - in: query
          name: search
          description: 'Search term to filter modules by code (partial match, case-insensitive). Cannot contain special characters. Optional parameter'
          schema:
            type: string
            maxLength: 255
          example: projects
          required: false
      responses:
        '200':
          description: 'Modules retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Modules fetched successfully'
                  result:
                    type: object
                    description: 'Paginated modules data'
                    properties:
                      data:
                        type: array
                        description: 'List of modules for current page'
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                              description: 'Unique module ID'
                              example: 6
                            code:
                              type: string
                              description: 'Module code identifier'
                              example: 'projects'
                            status:
                              type: string
                              enum: [ACTIVE, INACTIVE]
                              description: 'Module status'
                              example: ACTIVE
                          required:
                            - id
                            - code
                            - status
                      count:
                        type: number
                        description: 'Total number of modules matching the search criteria'
                        example: 4
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for tracing'
                        example: '4cbb42f7-ed92-41a1-b93d-d689121cda08'
              examples:
                example1:
                  summary: 'List All Modules (Default Pagination)'
                  value:
                    responseCode: OK
                    message: Modules fetched successfully
                    result:
                      data:
                        - id: 6
                          code: projects
                          status: ACTIVE
                        - id: 2
                          code: observation
                          status: ACTIVE
                        - id: 4
                          code: program
                          status: ACTIVE
                        - id: 5
                          code: system
                          status: ACTIVE
                      count: 4
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
                example2:
                  summary: 'Search Modules by Code'
                  value:
                    responseCode: OK
                    message: MODULES_FETCHED_SUCCESSFULLY
                    result:
                      data:
                        - id: 6
                          code: projects
                          status: ACTIVE
                      count: 1
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
                example3:
                  summary: 'List Modules with Custom Pagination'
                  value:
                    responseCode: OK
                    message: MODULES_FETCHED_SUCCESSFULLY
                    result:
                      data:
                        - id: 2
                          code: observation
                          status: ACTIVE
                      count: 4
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
        '400':
          description: 'Bad Request - Invalid search text or parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getModuleList400Response'
  '/scp/v1/modules/delete/{id}':
    delete:
      summary: Delete Module
      tags:
        - Modules
      description: |-
        Soft deletes a module from the system. The module record is marked as deleted but preserved for audit and compliance.

        **Soft Delete Details**:
        - Module record is marked as deleted in the database (not permanently removed)
        - Deleted module cannot be accessed through normal API operations
        - Module data is preserved for audit trails and compliance
        - Module code remains reserved and cannot be reused
        - Soft-deleted modules can be restored through database recovery if needed

        **Validation Rules**:
        - Module ID must exist in the system
        - Module must not have already been deleted
        - Soft deletion is permanent (cannot be undone through API)
      operationId: deleteModule
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Unique module ID to soft delete (numeric, positive integer)'
          required: true
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 6
      responses:
        '200':
          description: 'Module deleted successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Module deleted successfully'
                  result:
                    type: object
                    description: 'Empty object on successful soft deletion'
                    properties: {}
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for audit trail'
              examples:
                example1:
                  summary: 'Successful Module Soft Deletion'
                  value:
                    responseCode: OK
                    message: MODULES_DELETED_SUCCESSFULLY
                    result: {}
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
        '400':
          description: 'Bad Request - Module not found or already deleted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateModule400Response'
  /scp/v1/permissions/create:
    post:
      summary: Create Permission
      tags:
        - Permissions
      description: |-
        Creates a new permission that maps an API endpoint to specific HTTP methods and modules for role-based access control.

        **Details**:
        - Permission code serves as a unique identifier and remains immutable after creation
        - Code accepts lowercase letters and underscores for standardized naming
        - Module must be an existing module in the system
        - API path follows a consistent format pattern: `/[controller]/v[number]/[path]` (starting with `/scp`)
        - HTTP methods can be specified as an array including GET, POST, PATCH, PUT, DELETE
        - Status is set to ACTIVE by default for immediate availability
        - All required fields must be provided with non-empty values
      operationId: createPermission
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Permission object mapping API endpoint to HTTP method and module'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-z_]+$'
                  description: 'Unique permission identifier. Must contain only lowercase letters and underscores (no spaces, numbers, uppercase, or hyphens)'
                  example: 'create_project'
                module:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Module name this permission belongs to (must exist in modules). Can contain letters, hyphens, and underscores'
                  example: 'projects'
                request_type:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PATCH, PUT, DELETE]
                  minItems: 1
                  description: 'Array of HTTP methods this permission grants access to. Can contain one or multiple methods (e.g., [POST], [GET, POST], [GET, POST, PATCH, PUT, DELETE])'
                  example: ['POST']
                api_path:
                  type: string
                  minLength: 5
                  description: 'API endpoint path following format: /[controller name]/v[number]/[path]. Pattern: /scp/v1/projects/create or /scp/v1/projects/:id'
                  example: '/scp/v1/projects/create'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Permission status. Defaults to ACTIVE if not provided. ACTIVE: Available for role assignment, INACTIVE: Disabled'
                  example: ACTIVE
              required:
                - code
                - module
                - request_type
                - api_path
            examples:
              example1:
                value:
                  code: create_project
                  module: projects
                  request_type: [POST]
                  api_path: /scp/v1/projects/create
                  status: ACTIVE
              example2:
                summary: 'Create GET Permission for Project List'
                value:
                  code: list_project
                  module: projects
                  request_type: [GET]
                  api_path: /scp/v1/projects/list
              example3:
                summary: 'Create Multiple Methods Permission'
                value:
                  code: project_full_access
                  module: projects
                  request_type: [GET, POST, PATCH, PUT, DELETE]
                  api_path: /scp/v1/projects/:id
      responses:
        '201':
          description: 'Permission created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'PERMISSION_CREATED_SUCCESSFULLY'
                  result:
                    type: object
                    description: 'Created permission details'
                    properties:
                      id:
                        type: number
                        description: 'Unique permission ID assigned by system'
                        example: 18
                      code:
                        type: string
                        description: 'Permission code identifier'
                        example: 'create_project'
                      module:
                        type: string
                        description: 'Module name'
                        example: 'projects'
                      request_type:
                        type: array
                        items:
                          type: string
                          enum: [GET, POST, PATCH, PUT, DELETE]
                        description: 'Array of HTTP methods'
                        example: ['POST']
                      status:
                        type: string
                        enum: [ACTIVE, INACTIVE]
                        description: 'Permission status'
                        example: ACTIVE
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID'
              examples:
                example1:
                  summary: 'Successful Permission Creation'
                  value:
                    responseCode: OK
                    message: Permission created successfully
                    result:
                      id: 18
                      code: create_project
                      module: projects
                      request_type: [POST]
                      status: ACTIVE
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
        '400':
          description: 'Bad Request - Invalid input or duplicate permission code'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  error:
                    type: array
                    items:
                      type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                  message:
                    type: string
              examples:
                example1:
                  value:
                    responseCode: CLIENT_ERROR
                    error: []
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
                    message: permission already exists
    parameters: []
  '/scp/v1/permissions/update/{id}':
    post:
      summary: Update Permission
      tags:
        - Permissions
      description: |-
        Updates an existing permission mapping API endpoint to HTTP methods and modules. Allows modification of permission properties such as code, module, request methods, and status.

        **Validations**:
        - Permission ID must exist in the system
        - Permission must not have already been deleted
        - Updated code must remain unique across the system if changed
        - Code must contain only lowercase letters and underscores (no spaces, no uppercase, no hyphens, no numbers)
        - Module must exist in the system
        - request_type must be an array with at least one HTTP method
        - API path must follow strict format pattern: `/[controller]/v[number]/[path]`
        - All fields must be non-empty and non-null when provided
        - Status field is optional and defaults to current value if not provided

        **Important Notes**:
        - Permission ID must be a valid positive integer
        - Code changes trigger uniqueness validation across all permissions
        - Response returns updated permission details in same format as create
        - All validation rules from permission creation apply to updates
        - Update is permanent and cannot be undone through API
      parameters:
        - name: X-auth-token
          in: header
          description: 'To use this API, you require an X-auth-token. This is available in the login API Response.'
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Id of the permission to update.
          required: true
          schema:
            type: number
          example: 2
      requestBody:
        description: 'Permission update object with code, module, request_type, api_path, and optional status'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-z_]+$'
                  description: 'Unique permission identifier. Must contain only lowercase letters and underscores (no spaces, numbers, uppercase, or hyphens). Code must remain unique after update'
                  example: 'create_project'
                module:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Module name this permission belongs to (must exist in modules). Can contain letters, hyphens, and underscores'
                  example: 'projects'
                request_type:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PATCH, PUT, DELETE]
                  minItems: 1
                  description: 'Array of HTTP methods this permission grants access to. Can contain one or multiple methods (e.g., [POST], [GET, POST], [GET, POST, PATCH, PUT, DELETE])'
                  example: ['POST']
                api_path:
                  type: string
                  minLength: 5
                  description: 'API endpoint path following format: /[controller name]/v[number]/[path]. Pattern: /scp/v1/projects/create or /scp/v1/projects/:id'
                  example: '/scp/v1/projects/create'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Permission status. ACTIVE: Available for role assignment, INACTIVE: Disabled. Optional field - if not provided, current status is maintained'
                  example: ACTIVE
              required:
                - code
                - module
                - request_type
                - api_path
            examples:
              example1:
                summary: 'Update Permission Code and Status'
                value:
                  code: update_project
                  module: projects
                  request_type: [PUT]
                  api_path: /scp/v1/projects/:id
                  status: ACTIVE
              example2:
                summary: 'Update Multiple HTTP Methods'
                value:
                  code: project_full_access
                  module: projects
                  request_type: [GET, POST, PATCH, PUT, DELETE]
                  api_path: /scp/v1/projects/:id
              example3:
                summary: 'Deactivate Permission (Status Update Only)'
                value:
                  code: create_project
                  module: projects
                  request_type: [POST]
                  api_path: /scp/v1/projects/create
                  status: INACTIVE
      responses:
        '201':
          description: 'Permission updated successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                    description: 'Response status code'
                  message:
                    type: string
                    example: 'PERMISSION_UPDATED_SUCCESSFULLY'
                    description: 'Response message'
                  result:
                    type: object
                    description: 'Updated permission details'
                    properties:
                      id:
                        type: number
                        description: 'Unique permission ID'
                        example: 18
                      code:
                        type: string
                        description: 'Updated permission code identifier'
                        example: 'create_project'
                      module:
                        type: string
                        description: 'Module name'
                        example: 'projects'
                      request_type:
                        type: array
                        items:
                          type: string
                          enum: [GET, POST, PATCH, PUT, DELETE]
                        description: 'Array of HTTP methods'
                        example: ['POST']
                      status:
                        type: string
                        enum: [ACTIVE, INACTIVE]
                        description: 'Permission status after update'
                        example: ACTIVE
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for audit trail'
              examples:
                example1:
                  summary: 'Successful Permission Update'
                  value:
                    responseCode: OK
                    message: Permission updated successfully
                    result:
                      id: 18
                      code: create_project
                      module: projects
                      request_type: [POST]
                      status: ACTIVE
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
        '400':
          description: 'Bad Request - Invalid input or permission not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updatePermission400Response'
  /scp/v1/permissions/getPermissions:
    get:
      summary: Get Paginated List of All Permissions
      tags:
        - Permissions
      description: |-
        Retrieves a paginated list of all permissions in the system with optional search and filtering capabilities.

        **Features**:
        - Pagination support with configurable page size (defaults to 100, max 100 per page)
        - Full-text search across permission codes (case-insensitive, partial match)
        - Search text cannot contain special characters
        - Returns total count of matching permissions
        - Each permission includes all details: id, code, module, request_type (array), api_path, status

        **Search Behavior**:
        - Search filters permissions by code field (case-insensitive partial match)
        - Uses iLike operator for flexible searching (e.g., searching 'project' matches 'create_project', 'list_project', 'update_project')
        - If no search term provided, returns all permissions
        - Special characters in search text will be rejected with validation error

        **Query Parameters**:
        - `page`: Page number for pagination (1-indexed, defaults to 1)
        - `limit`: Records per page (defaults to 100, max 100)
        - `search`: Filter permissions by code (optional, case-insensitive partial match)

        **Use Cases**:
        - Display all available permissions with pagination
        - Search for specific permission by code
        - Monitor all system permissions
      operationId: getPermissions
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: page
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided or invalid. Minimum value is 1'
          schema:
            type: number
            minimum: 1
            default: 1
          example: 1
          required: false
        - in: query
          name: limit
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100. Invalid values default to 100'
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 100
          example: 10
          required: false
        - in: query
          name: search
          description: 'Search term to filter permissions by code (case-insensitive partial match). Cannot contain special characters. Optional parameter - if not provided, all permissions are returned'
          schema:
            type: string
            maxLength: 255
          example: project
          required: false
      responses:
        '200':
          description: 'Permissions retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                    description: 'Response status code'
                  message:
                    type: string
                    example: 'PERMISSION_FETCHED_SUCCESSFULLY'
                    description: 'Response message'
                  result:
                    type: object
                    description: 'Paginated permissions data'
                    properties:
                      data:
                        type: array
                        description: 'Array of permission objects'
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                              description: 'Unique permission ID'
                              example: 18
                            code:
                              type: string
                              description: 'Permission code identifier (lowercase letters and underscores)'
                              example: 'create_project'
                            module:
                              type: string
                              description: 'Module name this permission belongs to'
                              example: 'projects'
                            request_type:
                              type: array
                              description: 'Array of HTTP methods this permission grants access to'
                              items:
                                type: string
                                enum: [GET, POST, PATCH, PUT, DELETE]
                              example: ['POST']
                            api_path:
                              type: string
                              description: 'API endpoint path this permission is mapped to'
                              example: '/scp/v1/projects/create'
                            status:
                              type: string
                              enum: [ACTIVE, INACTIVE]
                              description: 'Permission status (ACTIVE: available for role assignment, INACTIVE: disabled)'
                              example: 'ACTIVE'
                      count:
                        type: number
                        description: 'Total number of permissions matching the search criteria'
                        example: 25
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for tracking'
                        example: '4cbb42f7-ed92-41a1-b93d-d689121cda08'
              examples:
                example1:
                  summary: 'List All Permissions (Default Pagination - Page 1, 10 results)'
                  value:
                    responseCode: OK
                    message: Permissions fetched successfully.
                    result:
                      data:
                        - id: 1
                          code: create_project
                          module: projects
                          request_type: [POST]
                          api_path: /scp/v1/projects/create
                          status: ACTIVE
                      count: 1
  /scp/v1/permissions/list:
    get:
      summary: Get User Permissions Based on Assigned Roles
      tags:
        - Permissions
      description: |-
        Retrieves the permissions accessible to the authenticated user based on their assigned roles. This API provides information about the modules and HTTP methods the user can access.

        **Overview**:
        - Requires a valid authentication token and is accessible to all authenticated users
        - Extracts user roles from the authentication token
        - Fetches permissions mapped to each role from the role-permission-mapping
        - Merges permissions across multiple roles with deduplication
        - Returns consolidated permissions grouped by module
        - Returns an array of permission objects containing module names and allowed HTTP methods
        - No pagination or search applied

      operationId: listPermissions
      parameters:
        - name: X-auth-token
          in: header
          description: "Authentication token from login API response. This token contains the user's roles which are used to filter permissions. Any authenticated user can access this API to view their own permissions."
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      responses:
        '200':
          description: 'User permissions retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                    description: 'Response status code'
                  message:
                    type: string
                    example: 'PERMISSION_FETCHED_SUCCESSFULLY'
                    description: 'Response message'
                  result:
                    type: array
                    description: 'Array of permission objects grouped by module. Each module appears only once with merged request_type from all user roles'
                    items:
                      type: object
                      properties:
                        module:
                          type: string
                          description: 'Module name (e.g., projects, programs, observations). One entry per accessible module'
                          example: 'projects'
                        request_type:
                          type: array
                          description: 'Array of HTTP methods user can perform on this module. Merged from all user roles and deduplicated'
                          items:
                            type: string
                            enum: [GET, POST, PATCH, PUT, DELETE]
                          example: ['GET', 'POST', 'PUT', 'PATCH']
              examples:
                example1:
                  summary: 'Admin User Permissions (Full Access)'
                  value:
                    responseCode: OK
                    message: Permissions fetched successfully.
                    result:
                      - module: project
                        request_type:
                          - POST
                          - GET
  '/scp/v1/permissions/delete/{id}':
    delete:
      summary: Delete Permission by ID (Soft Delete)
      tags:
        - Permissions
      operationId: deletePermission
      description: |-
        **Overview**:
        - Soft deletes a permission from the system while preserving data for audit and compliance purposes
        - Admin-only API requiring `admin` or `org_admin` role from authentication token
        - Permission record is marked as deleted in database but not permanently removed
        - Deleted permission cannot be accessed through normal API operations (getPermissions, list)
        - Permission code remains reserved and cannot be reused for new permissions
        - Role-permission-mapping entries referencing deleted permission are also soft-deleted
        - Use with caution in production environments as deletion cannot be undone through API
        - Deletion is logged with audit trail for compliance and security
        - Any roles mapped to this permission will have the mapping removed

        **Validation Rules**:
        - Permission ID must be a valid positive integer (1 to 2147483647) and exist in the system
        - Permission must not have already been deleted
        - ID parameter is required and cannot be empty or null
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Unique permission ID to soft delete (numeric, positive integer, required, 1 to 2147483647)'
          required: true
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 2
      responses:
        '202':
          description: 'Permission deleted successfully (soft delete accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response status code'
                    example: 'OK'
                  message:
                    type: string
                    description: 'Response message confirming deletion'
                    example: 'PERMISSION_DELETED_SUCCESSFULLY'
                  result:
                    type: object
                    description: 'Empty result object for delete operations'
                    properties: {}
                  meta:
                    type: object
                    description: 'Metadata containing request correlation ID'
                    properties:
                      correlation:
                        type: string
                        description: 'Unique correlation ID for tracking the request'
                        example: 'a3f7cde4-83f2-4143-a5c4-7e3291085cb4'
              examples:
                example1:
                  summary: 'Successful Permission Deletion (Soft Delete)'
                  value:
                    responseCode: OK
                    message: Permission deleted successfully
                    result: {}
                    meta:
                      correlation: a3f7cde4-83f2-4143-a5c4-7e3291085cb4
        '400':
          description: Bad Request. Permissions does not exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updatePermission400Response'
  /scp/v1/role-permission-mapping/create:
    post:
      summary: Create Role-Permission Mapping
      tags:
        - Role Permission Mapping
      operationId: createRolePermissionMapping
      description: |-
        **Overview**:
        - Creates a new mapping between a role and a permission, granting the role access to specific API endpoints and HTTP methods
        - API automatically retrieves module and request_type from the permission record
        - created_by field captures the user who created the mapping (from authentication token)
        - Multiple permissions can be assigned to a single role
        - Single permission can be assigned to multiple roles
        - Changes take effect immediately for new user sessions
        - Existing sessions may require re-authentication to reflect new permissions
        - Useful for assigning permissions to newly created roles, adding new permissions to existing roles, granting specific API access to role-based user groups, building role-based access control (RBAC) mappings, and supporting permission scaling as new features are added

        **Validation Rules**:
        - Permission ID must exist in the system and be in ACTIVE status (not soft-deleted)
        - Role title must exist in the system and follow naming convention: letters, hyphens, underscores only
        - Each role-permission combination must be unique (no duplicate mappings)
        - Permission must be in ACTIVE status
        - Permission must not have been soft-deleted
        - Permission record must contain valid module, request_type, and api_path
        - role_title must follow naming convention: letters, hyphens, underscores only
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role. Token ID is captured in created_by field.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Role-permission mapping object with permission_id and role_title'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permission_id:
                  type: number
                  description: 'Unique permission ID to map to the role (numeric, must exist in permissions table)'
                  example: 1
                  minimum: 1
                role_title:
                  type: string
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Role title to associate with the permission (letters, hyphens, underscores only, case-sensitive)'
                  example: 'content_creator'
              required:
                - permission_id
                - role_title
            examples:
              example1:
                summary: 'Map Create Permission to Content Creator Role'
                value:
                  permission_id: 1
                  role_title: content_creator
              example2:
                summary: 'Map List Permission to Reviewer Role'
                value:
                  permission_id: 5
                  role_title: reviewer
              example3:
                summary: 'Map Full Access Permission to Admin Role'
                value:
                  permission_id: 12
                  role_title: admin
      responses:
        '201':
          description: 'Role-permission mapping created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response status code'
                    example: 'OK'
                  message:
                    type: string
                    description: 'Response message confirming successful creation'
                    example: 'ROLE_PERMISSION_CREATED_SUCCESSFULLY'
                  result:
                    type: object
                    description: 'Created role-permission mapping details'
                    properties:
                      role_title:
                        type: string
                        description: 'Role title associated with the permission'
                        example: 'content_creator'
                      permission_id:
                        type: number
                        description: 'Permission ID included in the mapping'
                        example: 1
                      module:
                        type: string
                        description: 'Module extracted from the permission record'
                        example: 'projects'
                      request_type:
                        type: array
                        items:
                          type: string
                          enum: [GET, POST, PATCH, PUT, DELETE]
                        description: 'Array of HTTP methods for this permission'
                        example: ['POST']
                  meta:
                    type: object
                    description: 'Response metadata'
              examples:
                example1:
                  summary: 'Successful Role-Permission Mapping Creation'
                  value:
                    responseCode: OK
                    message: Permission added to the role
                    result:
                      role_title: content_creator
                      permission_id: 1
                      module: projects
                      request_type: [POST]
                    meta: {}
                example2:
                  summary: 'Multiple Methods Permission Mapped to Role'
                  value:
                    responseCode: OK
                    message: ROLE_PERMISSION_CREATED_SUCCESSFULLY
                    result:
                      role_Title: reviewer
                      permission_Id: 8
                      module: programs
                      request_type: [GET, POST, PATCH]
                    meta: {}
        '400':
          description: 'Bad Request - Invalid input or permission/role not found'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  error:
                    type: array
                    items:
                      type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                  message:
                    type: string
              examples:
                example1:
                  value:
                    responseCode: CLIENT_ERROR
                    error: []
                    message: Permission for this role already exists
    parameters: []
  /scp/v1/role-permission-mapping/list:
    get:
      summary: List Permissions for User's Roles
      tags:
        - Role Permission Mapping
      operationId: listRolePermissionMappings
      description: |-
        **Overview**:
        - Retrieves all permissions assigned to the authenticated user's roles with automatic deduplication of request methods across multiple permissions for the same module
        - User-facing API requiring valid authentication token - any authenticated user can access their own permissions without admin role
        - Extracts user roles from authentication token and filters role-permission-mapping table by each user role (supports multiple roles)
        - Returns consolidated permissions grouped by module with deduplicated HTTP methods
        - Returns only module and request_type fields (not permission codes or IDs)
        - Supports multiple user roles merged automatically across all assigned roles
        - Empty result returns 200 status with ROLE_PERMISSION_NOT_FOUND message instead of error
        - No pagination or search parameters required - automatic extraction from authentication token
      parameters:
        - name: X-auth-token
          required: true
          in: header
          description: "Authentication token from login API response. Token contains the user's assigned roles which are used to filter permissions. Any authenticated user can access this endpoint."
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      responses:
        '200':
          description: 'Role permissions retrieved successfully (empty or populated)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response status code'
                    example: 'OK'
                  message:
                    type: string
                    description: 'Response message: FETCHED_ROLE_PERMISSION_SUCCESSFULLY (with permissions) or ROLE_PERMISSION_NOT_FOUND (empty list)'
                    example: 'FETCHED_ROLE_PERMISSION_SUCCESSFULLY'
                  result:
                    type: object
                    description: 'Result object containing permissions array'
                    properties:
                      permissions:
                        type: array
                        description: 'Array of role permissions, deduplicated by module'
                        items:
                          type: object
                          description: 'Permission object with module and HTTP methods'
                          properties:
                            module:
                              type: string
                              description: 'Module name this permission grants access to'
                              example: 'projects'
                            request_type:
                              type: array
                              items:
                                type: string
                                enum: [GET, POST, PATCH, PUT, DELETE]
                              description: 'Array of allowed HTTP methods for this module (deduplicated)'
                              example: ['GET', 'POST']
                  meta:
                    type: object
                    description: 'Response metadata'
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Permissions list fetched successfully
                    result:
                      permissions:
                        - module: entity-type
                          request_type:
                            - 'POST,'
                            - 'DELETE,'
                            - 'GET,'
                            - 'PUT,'
                            - PATCH
  /scp/v1/role-permission-mapping/delete:
    post:
      summary: Delete rolePermissionMapping
      tags:
        - Role Permission Mapping
      operationId: deleteRolePermissionMapping
      description: |-
        Deletes a mapping between a role and a permission, removing the role's access to specific API endpoints and HTTP methods.

        **Rules**:
        - Role-permission mapping must exist (combination of role_title and permission_id)
        - role_title must exist in the system
        - permission_id must exist in the system
        - Both role_title and permission_id are required fields

        **Use Cases**:
        - Remove permissions from roles
        - Revoke API access for specific role-permission combinations
        - Update role capabilities by removing specific permissions
        - Manage role-based access control (RBAC) lifecycle

        **Important Notes**:
        - Operation is permanent - mapping is deleted from database
        - Changes take effect immediately for new user sessions
        - Existing sessions may require re-authentication to reflect permission changes
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Role-permission mapping deletion object with role_title and permission_id'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role_title:
                  type: string
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Role title to remove from mapping (letters, hyphens, underscores only)'
                  example: 'content_creator'
                permission_id:
                  type: number
                  description: 'Unique permission ID to remove from the role (numeric, must exist in permissions table)'
                  example: 1
                  minimum: 1
              required:
                - role_title
                - permission_id
            examples:
              example1:
                summary: 'Remove Permission from Content Creator Role'
                value:
                  role_title: content_creator
                  permission_id: 1
              example2:
                summary: 'Remove Permission from Reviewer Role'
                value:
                  role_title: reviewer
                  permission_id: 5
      responses:
        '200':
          description: 'Role-permission mapping deleted successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'OK'
                  message:
                    type: string
                    example: 'ROLE_PERMISSION_DELETED_SUCCESSFULLY'
                  result:
                    type: object
                    properties: {}
                  meta:
                    type: object
              examples:
                example1:
                  summary: 'Successful Role-Permission Mapping Deletion'
                  value:
                    responseCode: OK
                    message: Permission delete from the role
                    result: {}
                    meta: {}
        '400':
          description: Bad Request. Role-permission mapping not found or invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createMapping400Response'
  /scp/v1/entity-types/create:
    post:
      summary: Create Entity Type
      tags:
        - Entity Types
      operationId: createEntityType
      description: |-
        Creates a new entity type in the system. Entity types are used to categorize and manage different types of entities (e.g., languages, regions, schools).

        **Rules**:
        - Entity type `value` must be globally unique per organization
        - `value` must contain only letters and underscores (no spaces, lowercase)
        - `label` can contain letters, numbers, and spaces
        - `data_type` must contain only letters and brackets (e.g., STRING, Array[STRING])
        - `status` defaults to ACTIVE if not provided
        - `allow_filtering` is set automatically by the system (cannot be provided in request)
        - `allow_custom_entities` defaults to true
        - `has_entities` defaults to true

        **Optional Advanced Fields**:
        - `is_external`: Boolean flag to mark entity type as external (stored in config)
        - `depended_on`: Entity type ID this type depends on (must exist and belong to same org)
        - `model`: Data model mapping for external integrations

        **Use Cases**:
        - Create organizational entity types for categorization
        - Define custom entity types for business requirements
        - Set up external entity type integrations
        - Create dependent entity hierarchies

        **Important Notes**:
        - Entity type value is auto-converted to lowercase
        - Organization code and tenant code are derived from authentication token
        - Created by and Updated by are automatically captured from user token
        - Config object is automatically populated with external and dependency metadata
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Entity type object with required fields'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  pattern: '^[A-Za-z_]+$'
                  description: 'Unique identifier for the entity type (letters and underscores only, will be converted to lowercase)'
                  example: 'language'
                label:
                  type: string
                  pattern: '^[A-Za-z0-9 ]+$'
                  description: 'Descriptive label for the entity type (letters, numbers, and spaces allowed)'
                  example: 'Languages'
                data_type:
                  type: string
                  pattern: '^[A-Za-z\[\]]+$'
                  description: 'Data type specification (letters and brackets, e.g., STRING, Array[STRING])'
                  example: 'STRING'
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
                  description: 'Entity type status (defaults to ACTIVE if not provided)'
                  example: ACTIVE
                  default: ACTIVE
                is_external:
                  type: boolean
                  description: 'Optional flag to mark entity type as external (stored in config object)'
                  example: false
                depended_on:
                  type: number
                  description: 'Optional ID of another entity type that this type depends on (must exist and belong to same organization)'
                  example: 1
                  minimum: 1
                model:
                  type: string
                  description: 'Optional data model mapping for external integrations'
                  example: 'ExternalModel'
              required:
                - value
                - label
                - data_type
            examples:
              example1:
                summary: 'Create Simple Entity Type'
                value:
                  value: language
                  label: Languages
                  data_type: STRING
                  status: ACTIVE
              example2:
                summary: 'Create External Entity Type'
                value:
                  value: school
                  label: Schools
                  data_type: STRING
                  is_external: true
              example3:
                summary: 'Create Dependent Entity Type'
                value:
                  value: subject
                  label: Subjects
                  data_type: STRING
                  depended_on: 1
      responses:
        '201':
          description: 'Entity type created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'OK'
                  message:
                    type: string
                    example: 'ENTITY_TYPE_CREATED_SUCCESSFULLY'
                  result:
                    type: object
                    properties:
                      id:
                        type: number
                        description: 'Unique identifier for the created entity type'
                      value:
                        type: string
                        description: 'Unique identifier (lowercase)'
                      label:
                        type: string
                        description: 'Descriptive label'
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - INACTIVE
                        description: 'Current status of entity type'
                      allow_filtering:
                        type: boolean
                        description: 'Whether filtering is allowed (system-controlled, defaults to false)'
                      data_type:
                        type: string
                        description: 'Data type specification'
                      allow_custom_entities:
                        type: boolean
                        description: 'Whether custom entities can be created (defaults to true)'
                      has_entities:
                        type: boolean
                        description: 'Whether entity type has associated entities (defaults to true)'
                      parent_id:
                        type: number
                        nullable: true
