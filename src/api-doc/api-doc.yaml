  /scp/v1/programs/addResources/{program_id}:
    post:
      summary: Add resources to program
      tags:
        - Programs
      description: |-
        **Overview**:
        - Adds resources to an existing program by creating copies of reusable resources
        - Validates program exists and belongs to authenticated user
        - Only reusable resources can be added to programs
        - Returns program ID upon successful addition

        **Validation Rules**:
        - `program_id` must be a valid integer (1 to 2147483647)
        - Program must exist and belong to authenticated user (user_id match)
        - `resource_ids` is required (array of integers, at least one resource)
        - All resource IDs must be valid and exist in the system
        - Resources must be reusable (is_reusable flag must be true)
        - Request body must contain only resource_ids field
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: program_id
          description: 'Program ID to add resources to (integer, required, 1 to 2147483647). Program must belong to authenticated user.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resource_ids
              properties:
                resource_ids:
                  type: array
                  items:
                    type: integer
                  example: [2, 12, 200, 1]
      responses:
        '200':
          description: 'Resources have been added to the program successfully.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: Resources have been added to the program successfully.
                  result:
                    type: integer
                    example: 123
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
        '400':
          description: 'Bad Request - Program not found, invalid resource IDs, or non-reusable resources'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteProgram400Response'
  /scp/v1/programs/removeResources/{program_id}:
    post:
      summary: Remove resources from program
      tags:
        - Programs
      description: |-
        **Overview**:
        - Removes resources from an existing program by deleting resource mappings
        - For published programs, only resources added after publishing can be removed
        - Validates all resource IDs exist in the program before removal
        - Prevents removal of resources added before program publication
        - Returns program ID upon successful removal

        **Validation Rules**:
        - `program_id` must be a valid integer (1 to 2147483647)
        - Program must exist in the system
        - `resource_ids` is required (array of integers, at least one resource)
        - All resource IDs must be valid and exist in the program
        - For published programs, resources added before publishing cannot be removed
        - Request body must contain only resource_ids field
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains organization_code, tenant_code for scoping.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: program_id
          description: 'Program ID to remove resources from (integer, required, 1 to 2147483647).'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resource_ids
              properties:
                resource_ids:
                  type: array
                  description: 'Array of resource IDs to remove from the program. All IDs must exist in the program.'
                  items:
                    type: integer
                  example: [2, 5, 8]
      responses:
        '200':
          description: 'Resources removed successfully.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Resources removed successfully.'
                  result:
                    type: integer
                    description: 'Program ID from which resources were removed'
                    example: 123
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: string
        '400':
          description: 'Bad Request - Program not found, invalid resource IDs, or resources cannot be removed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: CLIENT_ERROR
                  message:
                    type: string
                    example: 'Resource cannot be removed after the program has been published.'
                  result:
                    type: object
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: string

  '/scp/v1/programs/submitForReview/{id}':
    post:
      summary: Submit Program for Review
      tags:
        - Programs
      description: |-
        **Overview**:
        - Submits a program for review by assigned reviewers or all available reviewers
        - Validates program ownership (only creator can submit)
        - Validates program status (cannot submit if already in non-reviewable status)
        - Checks all comments are resolved before submission
        - Opens all draft comments when submitting
        - Automatically publishes if review is not mandatory for the organization
        - Updates program status to SUBMITTED and stage to REVIEW

        **Validation Rules**:
        - `id` must be a valid integer (program ID, 1 to 2147483647)
        - Program must exist and belong to authenticated user
        - Program cannot be in non-reviewable status (PUBLISHED, REJECTED, REJECTED_AND_REPORTED, SUBMITTED, INPROGRESS)
        - All open comments must be resolved before submission
        - `notes` is optional (must not exceed MAX_RESOURCE_NOTE_LENGTH if provided)
        - `reviewer_ids` is optional array of reviewer user IDs (minimum 1 element if provided)
        - If no reviewer_ids provided, program available to all eligible reviewers
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          description: 'Program ID to submit for review (integer, required, 1 to 2147483647). Program must belong to authenticated user.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewer_ids:
                  description: 'Optional array of reviewer user IDs to assign for review. If omitted, program available to all eligible reviewers.'
                  type: array
                  items:
                    type: integer
                  example: [23, 25]
                notes:
                  description: 'Optional notes for the reviewer. Must not exceed MAX_RESOURCE_NOTE_LENGTH characters.'
                  type: string
                  example: 'Please review the program structure and content'
            examples:
              example1:
                summary: Submit to specific reviewers
                description: 'When specific reviewers are selected, their user IDs are sent as an array.'
                value:
                  reviewer_ids: [23, 25]
                  notes: 'Please review the program structure and content'
              example2:
                summary: Submit to all reviewers
                description: 'When submitted to all reviewers, no body parameters required.'
                value: {}
      responses:
        '200':
          description: 'Your program has been sent for review'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Your program has been sent for review'
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: 'Program ID that was submitted for review'
                        example: 1
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            type:
                              type: string
                            version:
                              type: integer
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: 'Your program has been sent for review'
                    result:
                      id: 1
                    meta:
                      formsVersion:
                        - id: 3
                          type: programCreation
                          version: 3
        '400':
          description: 'Bad Request - Program not found, access denied, unresolved comments, or validation failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteProgram400Response'
  /scp/v1/programs/reviewerList:
    get:
      summary: Program - Reviewer List
      tags:
        - Programs
      description: |-
        **Overview**:
        - Retrieves paginated list of program reviewers from user service
        - Fetches users with reviewer role (configurable via DEFAULT_REVIEWER_ROLE)
        - Excludes authenticated user from the list
        - Returns reviewer details including name, email, phone, and organization information
        - Supports pagination for large datasets
        - Scoped to user's organization and tenant

        **Validation Rules**:
        - `page` defaults to 1 if not provided (minimum 1)
        - `limit` defaults to 100 if not provided (maximum 100)
        - Authenticated user is automatically excluded from results
        - Returns empty list if no reviewers found or user service call fails
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for user service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: page
          in: query
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided.'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100.'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
