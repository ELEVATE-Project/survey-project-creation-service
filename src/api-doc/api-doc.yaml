  /scp/v1/resource/list:
    get:
      summary: Resource List
      tags:
        - Resource
      operationId: listResources
      description: |-
        **Overview**:
        - Retrieves paginated list of resources (projects, programs, surveys, observations) based on listing type
        - Supports three listing modes: drafts, submitted_for_review, up_for_review
        - Fetches user-created resources with organization and creator details
        - Applies search, filtering, and sorting capabilities
        - Returns resources with metadata including status, dates, and review information
        - Scoped to authenticated user and their organization/tenant

        **Validation Rules**:
        - `listing` parameter is mandatory (drafts, submitted_for_review, or browse_existing)
        - `type` must be from allowed values: project, program, survey, observation, observation_with_rubric
        - `status` is only applicable for submitted_for_review listing (redundant for drafts)
        - `page` defaults to 1 if not provided (minimum 1)
        - `limit` defaults to 100 if not provided (maximum 100)
        - `search` cannot contain special characters
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: page
          in: query
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided or invalid. Minimum value is 1.'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100. Values exceeding 100 will be capped at 100.'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          example: 10
        - name: search
          in: query
          description: 'Search text to filter resources by title (case-insensitive). Cannot contain special characters.'
          required: false
          schema:
            type: string
          example: 'education'
        - name: type
