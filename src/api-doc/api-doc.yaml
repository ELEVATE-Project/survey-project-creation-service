                  value:
                    responseCode: CLIENT_ERROR
                    message: Value exceeds the allowed length for the field title
                    result: {}
  '/scp/v1/projects/update/{projectId}':
    post:
      summary: Update Project
      tags:
        - Projects
      operationId: updateProject
      description: |-
        This API updates existing projects with new metadata, tasks, and configuration. Supports updating projects in DRAFT or CREATION stage with automatic draft saving and validation. Used by administrators and creators to modify project details through the lifecycle before submission. Project updates are scoped to organization and tenant, with data stored in cloud storage.

        **Validations**:
        - `projectId` must be valid integer (1 to 2147483647) and must exist in system
        - `title` required and cannot exceed character limit
        - Project must be in DRAFT or CREATION stage for updates
