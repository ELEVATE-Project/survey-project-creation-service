  /scp/v1/actions/update:
    post:
      summary: Create Action
      tags:
        - Actions
      description: |-
        This API creates a new action that can be assigned to activities within the system. Actions represent specific tasks or operations that can be performed as part of an activity workflow. This API is used in activity management to define reusable action templates that can be referenced when configuring activities and tracking user interactions.

        **Overview:**
        - Creates new action with unique code and description
        - Action code must be unique across the system (alphanumeric with hyphens/underscores only)
        - Sets action status to ACTIVE by default
        - Returns created action with ID and all properties
        - Used as reference in activity workflows

        **Validations:**
        - `code` is required (unique, alphanumeric with hyphens and underscores only, no spaces)
        - `description` is required (string, maximum 255 characters)
        - `status` is optional (ACTIVE or INACTIVE, defaults to ACTIVE)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - description
              properties:
                code:
                  type: string
                  description: 'Unique action code (alphanumeric with hyphens/underscores, no spaces)'
                  example: 'submit_activity'
                description:
                  type: string
                  description: 'Action description (max 255 characters)'
                  example: 'Submit activity for review'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Action status (defaults to ACTIVE if not provided)'
                  example: 'ACTIVE'
      responses:
        '200':
          description: 'Action created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Action created successfully'
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: 'Action ID'
                      code:
                        type: string
                        description: 'Action code'
                      description:
                        type: string
                        description: 'Action description'
                      status:
                        type: string
                        description: 'Action status'
        '400':
          description: 'Bad Request - Invalid code format, duplicate code, or validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'CLIENT_ERROR'
                  message:
                    type: string
                    example: 'Action already exists'

  '/scp/v1/actions/update/{id}':
    post:
      summary: Update Action
      tags:
        - Actions
      description: |-
        This API updates an existing action's properties such as code, description, or status. Actions are used to track specific operations within activity workflows. This API is used in action management interfaces to modify action details after creation without recreating the entire action record.

        **Overview:**
        - Updates action code, description, or status for existing action
        - Validates action exists before updating
        - Code must be unique (if being changed)
        - Returns updated action with all properties
        - Used to maintain action definitions in workflow system

        **Validations:**
        - `id` must be a valid integer (1 to 2147483647) and must exist
        - `code` is optional (if provided, must be alphanumeric with hyphens/underscores, must be unique)
        - `description` is optional (if provided, must be 255 characters or less)
        - `status` is optional (must be ACTIVE or INACTIVE if provided)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          description: 'Action ID to update (integer, required, 1 to 2147483647).'
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Action code (optional, must be unique)'
                  example: 'submit_activity_v2'
                description:
                  type: string
                  description: 'Action description (optional, max 255 characters)'
                  example: 'Submit activity for review and approval'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Action status (optional)'
                  example: 'ACTIVE'
      responses:
        '200':
          description: 'Action updated successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Action updated successfully'
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                      code:
                        type: string
                      description:
                        type: string
                      status:
                        type: string
        '400':
          description: 'Bad Request - Action not found, duplicate code, or validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'CLIENT_ERROR'
                  message:
                    type: string
                    example: 'Action not found.'

  /scp/v1/actions/list:
    get:
      summary: List Actions
      tags:
        - Actions
      description: |-
        This API retrieves a paginated list of all available actions in the system. Actions are building blocks used in activity workflows to define reusable operations and tasks. This API is used in action management interfaces and activity configuration screens to display available actions for selection and assignment.

        **Overview:**
        - Retrieves paginated list of all actions with pagination support
        - Returns actions with ID, code, and status
        - Supports searching by action code (case-insensitive partial matching)
        - Returns total count and paginated data
        - Useful for displaying action selection dropdowns and management tables

        **Validations:**
        - `page` defaults to 1 if not provided (must be minimum 1)
        - `limit` defaults to system default if not provided (maximum 100)
        - `search` is optional (filters by action code using case-insensitive matching)
        - Returns empty data array with count 0 if no actions match criteria
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: page
          description: 'Page number for pagination (1-indexed, defaults to 1).'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - in: query
          name: limit
          description: 'Number of records per page (defaults to system default, maximum 100).'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10
        - in: query
          name: search
          description: 'Search text to filter actions by code (case-insensitive).'
          required: false
          schema:
            type: string
          example: 'submit'
      responses:
        '200':
          description: 'Actions fetched successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Actions fetched successfully'
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        description: 'Array of actions'
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: 'Action ID'
                            code:
                              type: string
                              description: 'Action code'
                            status:
                              type: string
                              description: 'Action status'
                      count:
                        type: integer
                        description: 'Total count of actions matching criteria'
              examples:
                with actions:
                  value:
                    responseCode: OK
                    message: 'Actions fetched successfully'
                    result:
                      data:
                        - id: 1
                          code: 'submit_activity'
                          status: 'ACTIVE'
                        - id: 2
                          code: 'approve_activity'
                          status: 'ACTIVE'
                        - id: 3
                          code: 'reject_activity'
                          status: 'ACTIVE'
                      count: 3
                without actions:
                  value:
                    responseCode: OK
                    message: 'Actions fetched successfully'
                    result:
                      data: []
                      count: 0

  '/scp/v1/actions/delete/{id}':
    delete:
      summary: Delete Action
      tags:
        - Actions
      description: |-
        This API deletes an action from the system. Actions can only be deleted if they are not referenced by any existing activities. This API is used in action management interfaces to remove unused action definitions and maintain a clean action repository.

        **Overview:**
        - Soft deletes an action (paranoid deletion with timestamp)
        - Validates action exists before deletion
        - Prevents deletion if action is referenced by any activities
        - Returns success message without response body on successful deletion
        - Used to remove unused action definitions from workflow system

        **Validations:**
        - `id` must be a valid integer (1 to 2147483647) and must exist
        - Action must not be referenced by any activities (linked activities prevent deletion)
        - Action must exist in the system before deletion
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          description: 'Action ID to delete (integer, required, 1 to 2147483647). Action must not be referenced by any activities.'
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          example: 1
      responses:
        '202':
          description: 'Action deleted successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Action deleted successfully'
        '400':
          description: 'Bad Request - Action not found or has associated activities'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'CLIENT_ERROR'
                  message:
                    type: string
                    example:
                      - 'Action not found.'
                      - 'Activities have been added for this action, so it cannot be deleted.'

  '/scp/v1/activities/list/{resourceId}':
    get:
      summary: List Resource Activities
      tags:
        - Activities
      description: |-
        This API retrieves a paginated list of all activities performed on a specific resource within the system. Activities track important state changes and user actions such as project creation, submission, review, approval, rejection, and publication. This API is used in resource detail views and activity logs to show users a complete audit trail of actions performed on a resource by different team members.

        **Overview:**
        - Retrieves activity history for a specific resource (project, program, survey, observation, etc.)
        - Returns formatted activity descriptions with user names, action details, and timestamps
        - Supports pagination to handle resources with many activities
        - Shows current user as "You" in activity descriptions for clarity
        - Tracks all state transitions: creation, submission, review, approval, rejection, publication
        - Scoped to authenticated user's organization and tenant

        **Validations:**
        - `resourceId` is required (integer, must be a valid resource ID, 1 to 2147483647)
        - `page` defaults to 1 if not provided (minimum 1)
        - `limit` defaults to system default if not provided (maximum 100)
        - Resource must exist in authenticated user's organization and tenant
        - User must have access to the resource to view its activities
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: resourceId
          description: 'Resource ID to fetch activities for (integer, required, 1 to 2147483647). Can be project, program, survey, or observation ID.'
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          example: 42
        - in: query
          name: page
          description: 'Page number for pagination (1-indexed, defaults to 1).'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - in: query
          name: limit
          description: 'Number of records per page (defaults to system default, maximum 100).'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10
      responses:
        '200':
          description: 'Activities fetched successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Activities fetched successfully'
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        description: 'Array of formatted activity descriptions'
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: 'Activity record ID'
                            action:
                              type: string
                              description: 'Formatted activity description (User Name + Action + Resource ID + Timestamp)'
                      count:
                        type: integer
                        description: 'Total count of activities for the resource'
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: 'Activities fetched successfully'
                    result:
                      data:
                        - id: 1
                          action: 'You created the project with id 42 on 11/10/2024, 2:30:45 PM'
                        - id: 2
                          action: 'John Smith submitted the project with id 42 on 11/11/2024, 9:15:20 AM'
                        - id: 3
                          action: 'Sarah Johnson started review for project id 42 on 11/11/2024, 10:45:30 AM'
                        - id: 4
                          action: 'Sarah Johnson approved the project with id 42 on 11/12/2024, 11:30:15 AM'
                        - id: 5
                          action: 'John Smith published the project with id 42 on 11/12/2024, 3:45:00 PM'
                      count: 5
                example2:
                  value:
                    responseCode: OK
                    message: 'Activities fetched successfully'
                    result:
                      data: []
                      count: 0
        '400':
          description: 'Bad Request - Resource ID not provided or invalid'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'CLIENT_ERROR'
                  message:
                    type: string
                    example: 'Resource ID is required'
        '500':
          description: 'Internal Server Error - Failed to fetch activities'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'CLIENT_ERROR'
                  message:
                    type: string
                    example: 'Internal server error'

  /user/v1/user-role/create:
    post:
      summary: Create User Roles
      tags:
        - User Service APIS
      description: |
