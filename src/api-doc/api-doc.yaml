                        description: 'Entity type classification (SYSTEM, USER, or custom value)'
                      entity_type_id:
                        type: number
                        description: 'Foreign key referencing entity type'
                      organization_code:
                        type: string
                        description: 'Organization code from authentication token'
                      tenant_code:
                        type: string
                        description: 'Tenant code from authentication token'
                      created_by:
