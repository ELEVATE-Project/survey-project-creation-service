  - url: 'http://localhost:6001'
    description: 'Local server. NB :- port may vary according to the local setup.'
  - url: 'https://dev.elevate-apis.shikshalokam.org/'
    description: DEV server
  - url: 'https://qa.elevate-apis.shikshalokam.org/'
    description: QA server
paths:
  /scp/v1/modules/create:
    post:
      summary: Create Module
      tags:
        - Modules
      description: |-
        This API creates a new module that organizes and manages different types of resources (projects, programs, surveys, observations) in the system. Modules serve as organizational containers that group related resources and control their availability within the platform. Used during system setup and administration to establish the foundational module structure for resource categorization. This API enables administrators to define which resource types can be managed and tracked within their organization.

        **Validations:**
        - Module code must be globally unique and immutable after creation
        - Code must contain only letters, hyphens, and underscores (no spaces or special characters)
        - Status defaults to ACTIVE if not provided
        - Code cannot be empty, null, or reserved
      operationId: createModule
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Module object with code and optional status'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Unique module identifier. Must contain only letters, hyphens, and underscores (no spaces, no numbers)'
                  example: 'projects'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Module status. Defaults to ACTIVE if not provided. ACTIVE: Module is available for use, INACTIVE: Module is disabled'
                  example: ACTIVE
              required:
                - code
            examples:
              example1:
                summary: 'Create Active Module'
                value:
                  code: projects
                  status: ACTIVE
              example2:
                summary: 'Create Module (Status Optional)'
                value:
                  code: observations
      responses:
        '201':
          description: 'Module created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Module created successfully'
                  result:
                    type: object
                    description: 'Created module details'
                    properties:
                      id:
                        type: number
                        description: 'Unique module ID assigned by system'
                        example: 6
                      code:
                        type: string
                        description: 'Module code identifier'
                        example: 'projects'
                      status:
                        type: string
                        enum: [ACTIVE, INACTIVE]
                        description: 'Module status'
                        example: ACTIVE
                  meta:
                    type: object
                    description: 'Response metadata'
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for tracing'
              examples:
                example1:
                  summary: 'Successful Module Creation'
                  value:
                    responseCode: OK
                    message: Module created successfully
                    result:
                      id: 6
                      code: projects
                      status: ACTIVE
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
        '400':
          description: 'Bad Request - Invalid input or duplicate module code'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  error:
                    type: array
                    items:
                      type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                  message:
                    type: string
              examples:
                example1:
                  summary: 'Module Code Already Exists'
                  value:
                    responseCode: CLIENT_ERROR
                    error: []
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
                    message: module already exists
  '/scp/v1/modules/update/{id}':
    post:
      summary: Update Module
      tags:
        - Modules
      description: |-
        This API updates the configuration of an existing module including its code and status within the system. Modules serve as foundational organizational containers that control resource availability across the platform. Used during system maintenance and administration to modify module codes or change their active/inactive status. This API enables administrators to evolve module configurations as organizational needs change and resources are added or removed.

        **Validations:**
        - Module ID must exist and be valid
        - Updated code must remain unique across the system if changed
        - Code must contain only letters, hyphens, and underscores (no spaces or special characters)
        - Status must be either ACTIVE or INACTIVE
      operationId: updateModule
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response'
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Module id
          required: true
          example: 6
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Unique code for modules.
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: Status of the module.
              required:
                - code
            examples:
              ModuleUpdate:
                value:
                  code: projects
                  status: INACTIVE
      responses:
        '201':
          description: Created
          content:
            application/json: # Corrected from application.json
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      id:
                        type: number
                      status:
                        type: string
                      code:
                        type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Module updated successfully
                    result:
                      id: 6
                      code: projects
                      status: INACTIVE
                    meta:
                      correlation: dea5b252-75d2-40ed-a5a7-f8dec087467e
        '400':
          description: Bad Request. Module not Found.
          content:
            application/json: # Corrected from application.json
              schema:
                $ref: '#/components/schemas/updateModule400Response'
  /scp/v1/modules/list:
    get:
      summary: List Modules
      tags:
        - Modules
      description: |-
        This API retrieves a paginated list of all available modules in the system with support for search and filtering. Modules are foundational organizational containers used to manage and categorize different types of resources across the platform. Used by administrators and system managers to discover and review all configured modules for resource management. This API enables browsing and searching for specific modules with flexible pagination controls.

        **Validations:**
        - Search text cannot contain special characters
        - Page number must be a positive integer (1-indexed)
        - Limit must be between 1 and 100 (defaults to 100 if exceeded)
      operationId: listModules
      parameters:
        - name: X-auth-token
          required: true
          in: header
          description: 'Authentication token from login API response'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: page
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided or invalid'
          schema:
            type: number
            minimum: 1
            default: 1
          example: 1
          required: false
        - in: query
          name: limit
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100'
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 100
          example: 10
          required: false
        - in: query
          name: search
          description: 'Search term to filter modules by code (partial match, case-insensitive). Cannot contain special characters. Optional parameter'
          schema:
            type: string
            maxLength: 255
          example: projects
          required: false
      responses:
        '200':
          description: 'Modules retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Modules fetched successfully'
                  result:
                    type: object
                    description: 'Paginated modules data'
                    properties:
                      data:
                        type: array
                        description: 'List of modules for current page'
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                              description: 'Unique module ID'
                              example: 6
                            code:
                              type: string
                              description: 'Module code identifier'
                              example: 'projects'
                            status:
                              type: string
                              enum: [ACTIVE, INACTIVE]
                              description: 'Module status'
                              example: ACTIVE
                          required:
                            - id
                            - code
                            - status
                      count:
                        type: number
                        description: 'Total number of modules matching the search criteria'
                        example: 4
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for tracing'
                        example: '4cbb42f7-ed92-41a1-b93d-d689121cda08'
              examples:
                example1:
                  summary: 'List All Modules (Default Pagination)'
                  value:
                    responseCode: OK
                    message: Modules fetched successfully
                    result:
                      data:
                        - id: 6
                          code: projects
                          status: ACTIVE
                        - id: 2
                          code: observation
                          status: ACTIVE
                        - id: 4
                          code: program
                          status: ACTIVE
                        - id: 5
                          code: system
                          status: ACTIVE
                      count: 4
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
                example2:
                  summary: 'Search Modules by Code'
                  value:
                    responseCode: OK
                    message: MODULES_FETCHED_SUCCESSFULLY
                    result:
                      data:
                        - id: 6
                          code: projects
                          status: ACTIVE
                      count: 1
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
                example3:
                  summary: 'List Modules with Custom Pagination'
                  value:
                    responseCode: OK
                    message: MODULES_FETCHED_SUCCESSFULLY
                    result:
                      data:
                        - id: 2
                          code: observation
                          status: ACTIVE
                      count: 4
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
        '400':
          description: 'Bad Request - Invalid search text or parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getModuleList400Response'
  '/scp/v1/modules/delete/{id}':
    delete:
      summary: Delete Module
      tags:
        - Modules
      description: |-
        This API soft deletes a module from the system while preserving the record for audit and compliance purposes. Module records are marked as deleted in the database but not permanently removed, and deleted modules cannot be accessed through normal API operations. Used by system administrators to decommission modules while maintaining audit trails and compliance documentation. Soft deletion is permanent through the API and cannot be undone, though data can be restored through database recovery if needed.

        **Validation Rules**:
        - Module ID must exist in the system
      operationId: deleteModule
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Unique module ID to soft delete (numeric, positive integer)'
          required: true
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 6
      responses:
        '200':
          description: 'Module deleted successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Module deleted successfully'
                  result:
                    type: object
                    description: 'Empty object on successful soft deletion'
                    properties: {}
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for audit trail'
              examples:
                example1:
                  summary: 'Successful Module Soft Deletion'
                  value:
                    responseCode: OK
                    message: MODULES_DELETED_SUCCESSFULLY
                    result: {}
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
        '400':
          description: 'Bad Request - Module not found or already deleted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateModule400Response'
  /scp/v1/permissions/create:
    post:
      summary: Create Permission
      tags:
        - Permissions
      description: |-
        This API establishes fine-grained access control by mapping API endpoints to specific HTTP methods and modules. Used by administrators to define which API operations are available within the system and assign them to roles for implementing role-based access control (RBAC). Permission codes are immutable identifiers automatically created in ACTIVE status, enabling immediate availability for role mapping.

        **Validations**:
        - Permission code must be globally unique and immutable after creation (lowercase letters and underscores only)
        - Module must exist in the system and follow naming conventions (letters, hyphens, underscores)
        - API path must follow format pattern: `/[controller]/v[number]/[path]` (starting with `/scp`)
        - HTTP methods must be specified as array: GET, POST, PATCH, PUT, DELETE (minimum one method required)
        - All required fields (code, module, request_type, api_path) must be provided with non-empty values
      operationId: createPermission
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Permission object mapping API endpoint to HTTP method and module'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-z_]+$'
                  description: 'Unique permission identifier. Must contain only lowercase letters and underscores (no spaces, numbers, uppercase, or hyphens)'
                  example: 'create_project'
                module:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Module name this permission belongs to (must exist in modules). Can contain letters, hyphens, and underscores'
                  example: 'projects'
                request_type:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PATCH, PUT, DELETE]
                  minItems: 1
                  description: 'Array of HTTP methods this permission grants access to. Can contain one or multiple methods (e.g., [POST], [GET, POST], [GET, POST, PATCH, PUT, DELETE])'
                  example: ['POST']
                api_path:
                  type: string
                  minLength: 5
                  description: 'API endpoint path following format: /[controller name]/v[number]/[path]. Pattern: /scp/v1/projects/create or /scp/v1/projects/:id'
                  example: '/scp/v1/projects/create'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Permission status. Defaults to ACTIVE if not provided. ACTIVE: Available for role assignment, INACTIVE: Disabled'
                  example: ACTIVE
              required:
                - code
                - module
                - request_type
                - api_path
            examples:
              example1:
                value:
                  code: create_project
                  module: projects
                  request_type: [POST]
                  api_path: /scp/v1/projects/create
                  status: ACTIVE
              example2:
                summary: 'Create GET Permission for Project List'
                value:
                  code: list_project
                  module: projects
                  request_type: [GET]
                  api_path: /scp/v1/projects/list
              example3:
                summary: 'Create Multiple Methods Permission'
                value:
                  code: project_full_access
                  module: projects
                  request_type: [GET, POST, PATCH, PUT, DELETE]
                  api_path: /scp/v1/projects/:id
      responses:
        '201':
          description: 'Permission created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'PERMISSION_CREATED_SUCCESSFULLY'
                  result:
                    type: object
                    description: 'Created permission details'
                    properties:
                      id:
                        type: number
                        description: 'Unique permission ID assigned by system'
                        example: 18
                      code:
                        type: string
                        description: 'Permission code identifier'
                        example: 'create_project'
                      module:
                        type: string
                        description: 'Module name'
                        example: 'projects'
                      request_type:
                        type: array
                        items:
                          type: string
                          enum: [GET, POST, PATCH, PUT, DELETE]
                        description: 'Array of HTTP methods'
                        example: ['POST']
                      status:
                        type: string
                        enum: [ACTIVE, INACTIVE]
                        description: 'Permission status'
                        example: ACTIVE
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID'
              examples:
                example1:
                  summary: 'Successful Permission Creation'
                  value:
                    responseCode: OK
                    message: Permission created successfully
                    result:
                      id: 18
                      code: create_project
                      module: projects
                      request_type: [POST]
                      status: ACTIVE
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
        '400':
          description: 'Bad Request - Invalid input or duplicate permission code'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  error:
                    type: array
                    items:
                      type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                  message:
                    type: string
              examples:
                example1:
                  value:
                    responseCode: CLIENT_ERROR
                    error: []
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
                    message: permission already exists
    parameters: []
  '/scp/v1/permissions/update/{id}':
    post:
      summary: Update Permission
      tags:
        - Permissions
      description: |-
        This API modifies existing permission mappings to control API endpoint access and HTTP method assignments. Used by administrators to maintain and evolve permission configurations as system requirements change, including updating permission codes, associated modules, HTTP methods, and status. Changes take effect immediately for new sessions and updates are permanent, enabling dynamic management of role-based access control (RBAC).

        **Validations**:
        - Permission ID must exist in the system and not be soft-deleted
        - Updated code must remain unique across the system if changed (lowercase letters and underscores only)
        - Module must exist in the system and follow naming conventions (letters, hyphens, underscores)
        - request_type must be an array with minimum one HTTP method: GET, POST, PATCH, PUT, DELETE
        - API path must follow format pattern: `/[controller]/v[number]/[path]` (starting with `/scp`)
        - All provided fields must be non-empty and non-null (code, module, request_type, api_path are required)
        - Status field is optional and maintains current value if not provided
      parameters:
        - name: X-auth-token
          in: header
          description: 'To use this API, you require an X-auth-token. This is available in the login API Response.'
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: Id of the permission to update.
          required: true
          schema:
            type: number
          example: 2
      requestBody:
        description: 'Permission update object with code, module, request_type, api_path, and optional status'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-z_]+$'
                  description: 'Unique permission identifier. Must contain only lowercase letters and underscores (no spaces, numbers, uppercase, or hyphens). Code must remain unique after update'
                  example: 'create_project'
                module:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Module name this permission belongs to (must exist in modules). Can contain letters, hyphens, and underscores'
                  example: 'projects'
                request_type:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PATCH, PUT, DELETE]
                  minItems: 1
                  description: 'Array of HTTP methods this permission grants access to. Can contain one or multiple methods (e.g., [POST], [GET, POST], [GET, POST, PATCH, PUT, DELETE])'
                  example: ['POST']
                api_path:
                  type: string
                  minLength: 5
                  description: 'API endpoint path following format: /[controller name]/v[number]/[path]. Pattern: /scp/v1/projects/create or /scp/v1/projects/:id'
                  example: '/scp/v1/projects/create'
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: 'Permission status. ACTIVE: Available for role assignment, INACTIVE: Disabled. Optional field - if not provided, current status is maintained'
                  example: ACTIVE
              required:
                - code
                - module
                - request_type
                - api_path
            examples:
              example1:
                summary: 'Update Permission Code and Status'
                value:
                  code: update_project
                  module: projects
                  request_type: [PUT]
                  api_path: /scp/v1/projects/:id
                  status: ACTIVE
              example2:
                summary: 'Update Multiple HTTP Methods'
                value:
                  code: project_full_access
                  module: projects
                  request_type: [GET, POST, PATCH, PUT, DELETE]
                  api_path: /scp/v1/projects/:id
              example3:
                summary: 'Deactivate Permission (Status Update Only)'
                value:
                  code: create_project
                  module: projects
                  request_type: [POST]
                  api_path: /scp/v1/projects/create
                  status: INACTIVE
      responses:
        '201':
          description: 'Permission updated successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                    description: 'Response status code'
                  message:
                    type: string
                    example: 'PERMISSION_UPDATED_SUCCESSFULLY'
                    description: 'Response message'
                  result:
                    type: object
                    description: 'Updated permission details'
                    properties:
                      id:
                        type: number
                        description: 'Unique permission ID'
                        example: 18
                      code:
                        type: string
                        description: 'Updated permission code identifier'
                        example: 'create_project'
                      module:
                        type: string
                        description: 'Module name'
                        example: 'projects'
                      request_type:
                        type: array
                        items:
                          type: string
                          enum: [GET, POST, PATCH, PUT, DELETE]
                        description: 'Array of HTTP methods'
                        example: ['POST']
                      status:
                        type: string
                        enum: [ACTIVE, INACTIVE]
                        description: 'Permission status after update'
                        example: ACTIVE
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for audit trail'
              examples:
                example1:
                  summary: 'Successful Permission Update'
                  value:
                    responseCode: OK
                    message: Permission updated successfully
                    result:
                      id: 18
                      code: create_project
                      module: projects
                      request_type: [POST]
                      status: ACTIVE
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
        '400':
          description: 'Bad Request - Invalid input or permission not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updatePermission400Response'
  /scp/v1/permissions/getPermissions:
    get:
      summary: Get Paginated List of All Permissions
      tags:
        - Permissions
      description: |-
        This API retrieves all system permissions with flexible pagination and search capabilities. Used by administrators to discover, audit, and monitor permission configurations across the system with support for code-based filtering. Results include complete permission details (id, code, module, request_type, api_path, status) with case-insensitive partial matching on permission codes.

        **Validations**:
        - Page number must be a positive integer (1-indexed, defaults to 1, minimum value 1)
        - Limit must be between 1 and 100 (defaults to 100, values exceeding 100 are capped)
        - Search text cannot contain special characters (validation error if present)
        - Search filters permissions by code field using iLike operator for flexible partial matching (e.g., 'project' matches 'create_project', 'list_project', 'update_project')
        - If no search term provided, returns all permissions sorted by relevance
        - Each result includes all details: id, code, module, request_type (array), api_path, status with total count of matching permissions
      operationId: getPermissions
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: page
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided or invalid. Minimum value is 1'
          schema:
            type: number
            minimum: 1
            default: 1
          example: 1
          required: false
        - in: query
          name: limit
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100. Invalid values default to 100'
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 100
          example: 10
          required: false
        - in: query
          name: search
          description: 'Search term to filter permissions by code (case-insensitive partial match). Cannot contain special characters. Optional parameter - if not provided, all permissions are returned'
          schema:
            type: string
            maxLength: 255
          example: project
          required: false
      responses:
        '200':
          description: 'Permissions retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                    description: 'Response status code'
                  message:
                    type: string
                    example: 'PERMISSION_FETCHED_SUCCESSFULLY'
                    description: 'Response message'
                  result:
                    type: object
                    description: 'Paginated permissions data'
                    properties:
                      data:
                        type: array
                        description: 'Array of permission objects'
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                              description: 'Unique permission ID'
                              example: 18
                            code:
                              type: string
                              description: 'Permission code identifier (lowercase letters and underscores)'
                              example: 'create_project'
                            module:
                              type: string
                              description: 'Module name this permission belongs to'
                              example: 'projects'
                            request_type:
                              type: array
                              description: 'Array of HTTP methods this permission grants access to'
                              items:
                                type: string
                                enum: [GET, POST, PATCH, PUT, DELETE]
                              example: ['POST']
                            api_path:
                              type: string
                              description: 'API endpoint path this permission is mapped to'
                              example: '/scp/v1/projects/create'
                            status:
                              type: string
                              enum: [ACTIVE, INACTIVE]
                              description: 'Permission status (ACTIVE: available for role assignment, INACTIVE: disabled)'
                              example: 'ACTIVE'
                      count:
                        type: number
                        description: 'Total number of permissions matching the search criteria'
                        example: 25
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                        description: 'Unique request correlation ID for tracking'
                        example: '4cbb42f7-ed92-41a1-b93d-d689121cda08'
              examples:
                example1:
                  summary: 'List All Permissions (Default Pagination - Page 1, 10 results)'
                  value:
                    responseCode: OK
                    message: Permissions fetched successfully.
                    result:
                      data:
                        - id: 1
                          code: create_project
                          module: projects
                          request_type: [POST]
                          api_path: /scp/v1/projects/create
                          status: ACTIVE
                      count: 1
  /scp/v1/permissions/list:
    get:
      summary: Get User Permissions Based on Assigned Roles
      tags:
        - Permissions
      description: |-
        This API retrieves the modules and HTTP methods accessible to the authenticated user based on their assigned roles. Used by client applications to discover available API operations and enforce UI-level access control based on user permissions. Results are automatically consolidated and deduplicated across multiple roles with no pagination required, returning only module names and allowed HTTP methods.

        **Validations**:
        - Authentication token is required and must be valid (any authenticated user can access)
        - User roles are automatically extracted from the authentication token
        - Role-permission mappings are fetched and merged with automatic deduplication of HTTP methods across multiple permissions for the same module
        - Results are grouped by module with deduplicated request_type (HTTP methods)
        - Returns only module and request_type fields (not permission codes or IDs)
        - Empty results return 200 status with ROLE_PERMISSION_NOT_FOUND message (not an error)

      operationId: listPermissions
      parameters:
        - name: X-auth-token
          in: header
          description: "Authentication token from login API response. This token contains the user's roles which are used to filter permissions. Any authenticated user can access this API to view their own permissions."
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      responses:
        '200':
          description: 'User permissions retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                    description: 'Response status code'
                  message:
                    type: string
                    example: 'PERMISSION_FETCHED_SUCCESSFULLY'
                    description: 'Response message'
                  result:
                    type: array
                    description: 'Array of permission objects grouped by module. Each module appears only once with merged request_type from all user roles'
                    items:
                      type: object
                      properties:
                        module:
                          type: string
                          description: 'Module name (e.g., projects, programs, observations). One entry per accessible module'
                          example: 'projects'
                        request_type:
                          type: array
                          description: 'Array of HTTP methods user can perform on this module. Merged from all user roles and deduplicated'
                          items:
                            type: string
                            enum: [GET, POST, PATCH, PUT, DELETE]
                          example: ['GET', 'POST', 'PUT', 'PATCH']
              examples:
                example1:
                  summary: 'Admin User Permissions (Full Access)'
                  value:
                    responseCode: OK
                    message: Permissions fetched successfully.
                    result:
                      - module: project
                        request_type:
                          - POST
                          - GET
  '/scp/v1/permissions/delete/{id}':
    delete:
      summary: Delete Permission by ID (Soft Delete)
      tags:
        - Permissions
      operationId: deletePermission
      description: |-
        This API soft deletes a permission from the system while preserving the record for audit and compliance purposes. Admin-only operation requiring `admin` or `org_admin` role that marks the permission as deleted in the database without permanent removal. Cascading soft deletion also removes role-permission-mapping entries, and the permission code remains reserved preventing reuse. Use with caution as deletion is permanent through the API and cannot be undone.

        **Validations**:
        - Permission ID must be a valid positive integer (1 to 2147483647), exist in system, and not be already soft-deleted
        - Admin or org_admin role required from authentication token

      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Unique permission ID to soft delete (numeric, positive integer, required, 1 to 2147483647)'
          required: true
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 2
      responses:
        '202':
          description: 'Permission deleted successfully (soft delete accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response status code'
                    example: 'OK'
                  message:
                    type: string
                    description: 'Response message confirming deletion'
                    example: 'PERMISSION_DELETED_SUCCESSFULLY'
                  result:
                    type: object
                    description: 'Empty result object for delete operations'
                    properties: {}
                  meta:
                    type: object
                    description: 'Metadata containing request correlation ID'
                    properties:
                      correlation:
                        type: string
                        description: 'Unique correlation ID for tracking the request'
                        example: 'a3f7cde4-83f2-4143-a5c4-7e3291085cb4'
              examples:
                example1:
                  summary: 'Successful Permission Deletion (Soft Delete)'
                  value:
                    responseCode: OK
                    message: Permission deleted successfully
                    result: {}
                    meta:
                      correlation: a3f7cde4-83f2-4143-a5c4-7e3291085cb4
        '400':
          description: Bad Request. Permissions does not exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updatePermission400Response'
  /scp/v1/role-permission-mapping/create:
    post:
      summary: Create Role-Permission Mapping
      tags:
        - Role Permission Mapping
      operationId: createRolePermissionMapping
      description: |-
        This API creates a mapping between a role and a permission, granting the role access to specific API endpoints and HTTP methods. Admin-only operation that automatically retrieves module and request_type from the permission record and captures the authenticated user ID in created_by field. Changes take effect immediately for new user sessions, though existing sessions may require re-authentication to reflect new permissions. Multiple permissions can be assigned to a single role and vice versa, enabling flexible role-based access control (RBAC) configuration.

        **Validations**:
        - Permission ID must exist in the system and be in ACTIVE status (not soft-deleted)
        - Role title must exist in the system and follow naming convention (letters, hyphens, underscores only)
        - Each role-permission combination must be unique (no duplicate mappings)
        - Permission record must contain valid module, request_type, and api_path fields
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role. Token ID is captured in created_by field.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Role-permission mapping object with permission_id and role_title'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permission_id:
                  type: number
                  description: 'Unique permission ID to map to the role (numeric, must exist in permissions table)'
                  example: 1
                  minimum: 1
                role_title:
                  type: string
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Role title to associate with the permission (letters, hyphens, underscores only, case-sensitive)'
                  example: 'content_creator'
              required:
                - permission_id
                - role_title
            examples:
              example1:
                summary: 'Map Create Permission to Content Creator Role'
                value:
                  permission_id: 1
                  role_title: content_creator
              example2:
                summary: 'Map List Permission to Reviewer Role'
                value:
                  permission_id: 5
                  role_title: reviewer
              example3:
                summary: 'Map Full Access Permission to Admin Role'
                value:
                  permission_id: 12
                  role_title: admin
      responses:
        '201':
          description: 'Role-permission mapping created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response status code'
                    example: 'OK'
                  message:
                    type: string
                    description: 'Response message confirming successful creation'
                    example: 'ROLE_PERMISSION_CREATED_SUCCESSFULLY'
                  result:
                    type: object
                    description: 'Created role-permission mapping details'
                    properties:
                      role_title:
                        type: string
                        description: 'Role title associated with the permission'
                        example: 'content_creator'
                      permission_id:
                        type: number
                        description: 'Permission ID included in the mapping'
                        example: 1
                      module:
                        type: string
                        description: 'Module extracted from the permission record'
                        example: 'projects'
                      request_type:
                        type: array
                        items:
                          type: string
                          enum: [GET, POST, PATCH, PUT, DELETE]
                        description: 'Array of HTTP methods for this permission'
                        example: ['POST']
                  meta:
                    type: object
                    description: 'Response metadata'
              examples:
                example1:
                  summary: 'Successful Role-Permission Mapping Creation'
                  value:
                    responseCode: OK
                    message: Permission added to the role
                    result:
                      role_title: content_creator
                      permission_id: 1
                      module: projects
                      request_type: [POST]
                    meta: {}
                example2:
                  summary: 'Multiple Methods Permission Mapped to Role'
                  value:
                    responseCode: OK
                    message: ROLE_PERMISSION_CREATED_SUCCESSFULLY
                    result:
                      role_Title: reviewer
                      permission_Id: 8
                      module: programs
                      request_type: [GET, POST, PATCH]
                    meta: {}
        '400':
          description: 'Bad Request - Invalid input or permission/role not found'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  error:
                    type: array
                    items:
                      type: string
                  meta:
                    type: object
                    properties:
                      correlation:
                        type: string
                  message:
                    type: string
              examples:
                example1:
                  value:
                    responseCode: CLIENT_ERROR
                    error: []
                    message: Permission for this role already exists
    parameters: []
  /scp/v1/role-permission-mapping/list:
    get:
      summary: List Permissions for User's Roles
      tags:
        - Role Permission Mapping
      operationId: listRolePermissionMappings
      description: |-
        This API retrieves all modules and HTTP methods accessible to the authenticated user based on their assigned roles. User-facing endpoint that automatically extracts user roles from the authentication token and merges permissions across multiple roles with deduplication. Results are consolidated and grouped by module, returning only module names and allowed HTTP methods without pagination.

        **Validations**:
        - Authentication token is required and must be valid (any authenticated user can access)
      parameters:
