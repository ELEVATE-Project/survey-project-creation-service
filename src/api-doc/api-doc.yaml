  '/scp/v1/entity-types/update/{id}':
    post:
      summary: Update Entity Type
      tags:
        - Entity Types
      operationId: updateEntityType
      description: |-
        Updates an existing entity type configuration. Allows modification of entity type properties such as value, label, status, and advanced options.

        **Rules**:
        - Entity type ID must exist in the system
        - Updated `value` must remain unique per organization if changed
        - `value` must contain only letters and underscores (no spaces, lowercase)
        - `label` can contain letters, numbers, and spaces
        - `data_type` must contain only letters and brackets (e.g., STRING, Array[STRING])
        - `data_type` is mandatory and must be provided in update
        - `status` must be either ACTIVE or INACTIVE
        - `allow_filtering` cannot be modified (system-controlled)
        - Value is auto-converted to lowercase during update

        **Optional Update Fields**:
        - `value`: Update unique identifier (will be converted to lowercase)
        - `label`: Update descriptive label
        - `status`: Change entity type status (ACTIVE/INACTIVE)
        - `is_external`: Boolean flag for external entity type (stored in config)
        - `depended_on`: Entity type ID this type depends on (must exist and belong to same org)

        **Use Cases**:
        - Update entity type properties based on business requirements
        - Change status to activate/deactivate entity types
        - Update entity type labels or descriptions
        - Manage entity type configuration changes
        - Set up dependency relationships

        **Important Notes**:
        - At least `data_type` is mandatory for updates
        - Organization code and tenant code are derived from authentication token
        - Updated by field is automatically captured from user token
        - Config object is automatically populated with external and dependency metadata
        - All timestamps are automatically managed
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Valid entity type ID to update (numeric, positive integer, 1 to 2147483647)'
          required: true
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 2
      requestBody:
        description: 'Entity type update object with optional fields'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  pattern: '^[A-Za-z_]+$'
                  description: 'Optional unique identifier (letters and underscores only, will be converted to lowercase)'
                  example: 'language'
                label:
                  type: string
                  pattern: '^[A-Za-z0-9 ]+$'
                  description: 'Optional descriptive label (letters, numbers, and spaces allowed)'
                  example: 'Languages'
                data_type:
                  type: string
                  pattern: '^[A-Za-z\[\]]+$'
                  description: 'Mandatory data type specification (letters and brackets, e.g., STRING, Array[STRING])'
                  example: 'STRING'
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
                  description: 'Optional status update (ACTIVE or INACTIVE)'
                  example: ACTIVE
                is_external:
                  type: boolean
                  description: 'Optional flag to mark/update entity type as external (stored in config object)'
                  example: false
                depended_on:
                  type: number
                  description: 'Optional ID of another entity type that this type depends on (must exist and belong to same organization)'
                  example: 1
                  minimum: 1
              required:
                - data_type
            examples:
              example1:
                summary: 'Update Entity Type Label and Status'
                value:
                  label: Languages Updated
                  status: ACTIVE
                  data_type: STRING
      responses:
        '202':
          description: 'Entity type updated successfully (Accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'OK'
                  message:
                    type: string
                    example: 'ENTITY_TYPE_UPDATED_SUCCESSFULLY'
                  result:
                    type: object
                    properties:
                      id:
                        type: number
                        description: 'Unique identifier for the entity type'
                      value:
                        type: string
                        description: 'Unique identifier (lowercase)'
                      label:
                        type: string
                        description: 'Descriptive label'
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - INACTIVE
                        description: 'Current status of entity type'
                      allow_filtering:
                        type: boolean
                        description: 'Whether filtering is allowed (system-controlled)'
                      data_type:
                        type: string
                        description: 'Data type specification'
                      allow_custom_entities:
                        type: boolean
                        description: 'Whether custom entities can be created'
                      has_entities:
                        type: boolean
                        description: 'Whether entity type has associated entities'
                      parent_id:
                        type: number
                        nullable: true
                        description: 'Parent entity type ID if hierarchical (null if not applicable)'
                      config:
                        type: object
                        description: 'Configuration object containing is_external, depended_on, is_dependent metadata'
                      validations:
                        type: object
                        nullable: true
                        description: 'Custom validation rules (null if not defined)'
                      created_by:
                        type: string
                        description: 'User ID who created the entity type'
                      updated_by:
                        type: string
                        description: 'User ID who last updated the entity type'
                      organization_code:
                        type: string
                        description: 'Organization code from authentication token'
                      tenant_code:
                        type: string
                        description: 'Tenant code from authentication token'
                      created_at:
                        type: string
                        format: date-time
                        description: 'Timestamp when entity type was created'
                      updated_at:
                        type: string
                        format: date-time
                        description: 'Timestamp when entity type was last updated'
                      deleted_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: 'Soft deletion timestamp (null if not deleted)'
                  meta:
                    type: object
                    description: 'Response metadata'
              examples:
                example1:
                  summary: 'Successful Entity Type Update'
                  value:
                    responseCode: OK
                    message: ENTITY_TYPE_UPDATED_SUCCESSFULLY
                    result:
                      id: 1
                      value: language
