  /scp/v1/config/createOrUpdate:
    post:
      summary: Create or Update Organization Configuration
      tags:
        - Config APIs
      description: |-
        This API creates or updates organization-level configuration with role assignments and resource visibility policies for data and program managers. Organizations use this API to establish governance rules defining which users have data/program manager roles and control cross-organization resource sharing. Used in organization admin settings to configure foundational policies that govern role-based access and resource visibility workflows. This API enables organizations to define their resource management structure with upserting support (create if not exists, update if exists).

        **Overview:**
        - Supports upserting configuration (create if not exists, update if exists)
        - Independently manages data/program manager role assignments and resource visibility policies
        - Configures both internal and external organization resource sharing policies
        - Scoped to authenticated user's organization and tenant
        - Can update policies without affecting managers and vice versa

        **Validations:**
        - At least one field (data_managers, program_managers, or visibility policies) must be provided
        - `data_managers` and `program_managers` are optional (array of role names)
        - `resource_visibility_policy` is optional (controls internal organization resource sharing)
        - `external_resource_visibility_policy` is optional (controls external organization resource sharing)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains organization_code and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data_managers:
                  type: array
                  description: 'Array of role names for data managers (optional)'
                  items:
                    type: string
                  example: ['data_admin', 'data_lead']
                program_managers:
                  type: array
                  description: 'Array of role names for program managers (optional)'
                  items:
                    type: string
                  example: ['program_admin', 'program_lead']
                resource_visibility_policy:
                  type: string
                  description: 'Resource visibility policy for organization (optional)'
                  example: 'CURRENT'
                external_resource_visibility_policy:
                  type: string
                  description: 'External resource visibility policy (optional)'
                  example: 'ASSOCIATED'
      responses:
        '200':
          description: 'Organization configuration updated successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Config updated successfully'
        '201':
          description: 'Organization configuration created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Config added successfully'
        '400':
          description: 'Bad Request - Invalid organization code or tenant code'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'CLIENT_ERROR'
                  message:
                    type: string
                    example: 'Organization code and tenant code are required'

  /scp/v1/config/updateRelatedOrgs:
    post:
      summary: Update Related Organizations
      tags:
        - Config APIs
      description: |-
        This API updates which organizations have visibility and access to reusable resources created by the current organization. Related organizations define the external organizational network for cross-organization resource sharing and collaboration. Used in organization configuration settings to manage cross-organization resource sharing policies and establish trusted partner organizations. This API enables organizations to control which other organizations can discover and use their reusable resources.

        **Overview:**
        - Updates reusable resources with list of visible organizations
        - Manages cross-organization resource accessibility
        - Applies to all reusable resources in authenticated user's organization and tenant
        - Automatically updates visible_to_organizations field for matching resources
        - Supports adding multiple related organizations in single request

        **Validations:**
        - `related_org_details` is required (array of organization objects)
        - Each organization object must have `code` field (string, will be trimmed)
        - Empty or null codes are automatically filtered out
        - If no valid codes provided, API returns success with no-update message
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains organization_code and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - related_org_details
              properties:
                related_org_details:
                  type: array
                  description: 'Array of related organization objects'
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                        description: 'Organization code'
                  example:
                    - code: 'org_partner_1'
                    - code: 'org_partner_2'
                    - code: 'org_partner_3'
      responses:
        '200':
          description: 'Related organizations updated successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: 'Related organizations updated successfully'
        '400':
          description: 'Bad Request - Update failed or invalid data'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'CLIENT_ERROR'
                  message:
                    type: string
                    example: 'Related organizations update failed'

  /scp/v1/certificates/list:
    get:
      summary: List Certificate Templates
      tags:
        - Certificate
      description: |-
        This API retrieves all certificate base templates configured for an organization with full metadata for customization and generation. Certificate templates are base designs that define the structure for generating customized certificates with organization-specific logos and signatures. Used in the certificate management interface to display and help users select templates for different certificate layouts. This API supports filtering by resource type and searching by template name for easy template discovery.

        **Overview:**
        - Retrieves certificate templates scoped to authenticated user's organization and tenant
        - Returns templates with full metadata including logos and signatures configuration
        - Fetches presigned URLs for accessing template SVG files from cloud storage
        - Supports filtering by resource type (project, program, etc.)
        - Supports searching templates by name
        - Returns empty list if no templates match the filter criteria

        **Validations:**
        - X-auth-token must be valid and contain organization_code and tenant_code
        - `resource_type` is optional (query parameter) - if omitted, returns templates for all resource types
        - `search` is optional (query parameter) - filters templates by name using case-insensitive matching
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token containing user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: resource_type
          description: Optional resource type to filter templates (e.g., project, program).
          schema:
            type: string
          example: project
        - in: query
          name: search
          description: Optional search keyword to filter templates by name (case-insensitive).
          schema:
            type: string
          example: one logo
