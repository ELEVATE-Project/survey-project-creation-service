  /scp/v1/form/read:
    post:
      operationId: formRead
      summary: Read Form
      tags:
        - Form
      description: |-
        This API retrieves a complete form template with all field definitions, controls, and validation rules. Supports two operational modes: fetch by form ID or search by type/sub_type combination, with automatic fallback to system default forms if organization-specific form not found. Used by administrators and clients to retrieve form configurations for rendering, validation, or management. Forms are scoped to organization and tenant with priority given to user's organization over system defaults.

        **How to Fetch Data**:

        **Method 1 - Fetch by Form ID (Direct)**:
        - Pass `formId` as query parameter: `GET /scp/v1/form/read?formId=16`
        - Returns specific form directly without requiring request body
        - Fastest approach when you know the form ID

        **Method 2 - Fetch by Type and Sub-Type (Lookup)**:
        - Send request body with `type` and `sub_type`: `{type: "project", sub_type: "createProject"}`
        - Searches form by identifier combination
        - Use when you don't have form ID but know the form type

        **Validations**:
        - `formId` must be valid positive integer (1 to 2147483647)
        - Either `formId` query parameter OR request body (type+sub_type) required
        - Form must exist in user's organization or system default
        - Only tenant-scoped forms returned; org forms take precedence over defaults

      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Required for all requests. Token provides organization_code and tenant_code context for form scoping.'
          required: true
          schema:
            type: string
        - in: query
          name: formId
          description: 'Optional form ID to retrieve specific form directly (numeric, positive integer, 1 to 2147483647). If provided, request body is ignored. Cannot be used with type/sub_type.'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          required: false
          example: 16
      requestBody:
        description: 'Optional request body with type and sub_type for form lookup. Required if formId query parameter is not provided. Either formId or (type+sub_type) must be supplied.'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: 'Form type identifier (e.g., project, program, survey). Used with sub_type to find specific form.'
                  example: 'project'
                sub_type:
                  type: string
                  description: 'Form sub-type or category (e.g., createProject, updateProject). Used with type to identify form uniquely.'
                  example: 'createProject'
            examples:
              example1:
                summary: 'Retrieve Form by Type and Sub-Type'
                value:
                  type: project
                  sub_type: createProject
      responses:
        '200':
          description: 'Form retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response status code (OK for success)'
                    example: 'OK'
                  message:
                    type: string
                    description: 'Localized message from server'
                    example: 'Form fetched successfully'
                  result:
                    type: object
                    description: 'Complete form object with all configuration and controls'
                    properties:
                      id:
                        type: number
                        description: 'Unique form identifier'
                        example: 16
                      type:
                        type: string
                        description: 'Form type (project, program, survey, etc.)'
                        example: 'project'
                      sub_type:
                        type: string
                        description: 'Form sub-type or category'
                        example: 'createProject'
                      data:
                        type: object
                        description: 'Form structure containing template configuration and field controls'
                        properties:
                          template_name:
                            type: string
                            description: 'Name of the form template'
                            example: 'Project Creation Template'
                          fields:
                            type: object
                            description: 'Object containing all form controls'

                      version:
                        type: number
                        description: 'Current form version (incremented on updates)'
                        example: 1
                      created_at:
                        type: string
                        format: date-time
                        description: 'Form creation timestamp'
                        example: '2023-07-18T20:48:10.492Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: 'Last form update timestamp'
                        example: '2023-07-18T20:48:10.492Z'
                      deleted_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: 'Soft delete timestamp (null if not deleted)'
                        example: null
                      organization_code:
                        type: string
                        description: 'Organization code that owns this form'
                        example: 'default_code'
                      tenant_code:
                        type: string
                        description: 'Tenant code that owns this form'
                        example: 'default_tenant'
                  meta:
                    type: object
                    description: 'Metadata including form version information'
                    properties:
                      formsVersion:
                        type: array
                        description: 'Array of available form versions'
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                              description: 'Form ID'
                              example: 16
                            type:
                              type: string
                              description: 'Form type'
                              example: 'project'
                            version:
                              type: number
                              description: 'Form version'
                              example: 1
                      correlation:
                        type: string
                        description: 'Correlation ID for request tracking'
              examples:
                example1:
                  summary: 'Successful Form Read Response'
                  value:
                    responseCode: OK
                    message: Form fetched successfully
                    result:
                      id: 16
                      type: project
                      sub_type: createProject
                      version: 1
                      data:
                        template_name: Project Creation Template
                        fields:
                          controls:
                            - name: title
                              label: Project Title
                              value: ''
                              class: ion-margin
                              type: text
                              position: floating
                              validators:
                                required: true
                                min_length: 5
                              disabled: false
                              show_select_all: false
                            - name: categories
                              label: Select Categories
                              value: ''
                              class: ion-margin
                              type: chip
                              position: floating
                              disabled: false
                              show_select_all: true
                              validators:
                                required: true
                      created_at: '2023-07-18T20:48:10.492Z'
                      updated_at: '2023-07-18T20:48:10.492Z'
                      deleted_at: null
                      organization_code: default_code
                      tenant_code: default_tenant
                    meta:
                      formsVersion:
                        - id: 16
                          type: project
                          version: 1
                      correlation: 'correlation-uuid-string'
        '400':
          description: 'Bad Request - Form not found, invalid input, or missing required parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateForm400Response'
  /scp/v1/projects/update:
    post:
      summary: Create Project
      tags:
        - Projects
      operationId: createProject
      description: |-
        This API creates new projects in DRAFT status with customizable metadata, tasks, and configuration. Supports cloning published projects using `reference_id` to copy structure, tasks, and configurations. Used by administrators and creators to initialize new projects for project lifecycle management. Project data is stored in cloud storage and scoped automatically to the authenticated user's organization and tenant.

        **Validations**:
        - `title` required and cannot exceed character limit
        - `reference_id` must reference PUBLISHED project in same organization/tenant (optional, for cloning)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: reference_id
          description: 'Optional. ID of published project to clone (numeric). Copies project structure, tasks, and configurations. New project created in DRAFT status. Cannot be used with another project reference.'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          required: false
          example: 3
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'The title of the project'
            examples:
              project creation:
                value:
                  title: Sample Project
      responses:
        '200':
          description: 'Project created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'OK'
                  message:
                    type: string
                    example: 'PROJECT_CREATED_SUCCESSFULLY'
                  result:
                    type: object
                    properties:
                      id:
                        type: number
                        description: 'Unique project ID (resource ID)'
                        example: 1
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                            type:
                              type: string
                            version:
                              type: number
              examples:
                createExample:
                  summary: 'Project Created Successfully'
                  value:
                    responseCode: OK
                    message: Project Created Successfully
                    result:
                      id: 1
                    meta:
                      formsVersion:
                        - id: 3
                          type: projectCreation
                          version: 3
        '400':
          description: 'Bad Request - Various validation or business rule failures'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'CLIENT_ERROR'
                  message:
                    type: string
                    enum:
                      - Value exceeds the allowed length for the field title
                      - FILE_UPLOADED_FAILED
                    example: 'Value exceeds the allowed length for the field title'
                  result:
                    type: object
              examples:
                characterLimitExample:
