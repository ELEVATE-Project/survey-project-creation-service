  '/review-stages/update/{id}':
    post:
      summary: Update Review Stage
      tags:
        - Review Stages
      description: |-
        This API enables organizations to update review stage role assignments and hierarchy levels for implementing sequential approval workflows. Review stages define which roles are responsible for reviewing resources at each level, making them essential for configuring complex multi-stakeholder approval chains. Used in organization settings and workflow configuration interfaces to adjust approval stage hierarchies and role assignments for different resource types. This API ensures consistent enforcement of approval workflows where multiple roles with different responsibilities review resources in a defined sequence.

        **Overview:**
        - Updates review stage role and level hierarchy within organization scope
        - Validates resource type exists in environment configuration
        - Scoped to authenticated user's organization and tenant context
        - Returns updated review stage record with all properties

        **Validations:**
        - ID must be a positive integer between 1 and 2147483647
        - ID must reference existing review stage in organization
        - Role field is required and must not be empty
        - Role must match pattern ^[a-z_-]+$ (lowercase with hyphens/underscores only)
        - Level must be a numeric integer value
        - Resource type must be defined in RESOURCE_TYPES environment variable
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: ID of the review stage to update
          example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - level
                - resource_type
              properties:
                role:
                  type: string
                  pattern: '^[a-z_-]+$'
                  description: Role identifier for review stage (lowercase, hyphens/underscores allowed)
                  example: content_creator
                level:
                  type: integer
                  description: Level in role hierarchy for sequential reviews
                  example: 1
                resource_type:
                  type: string
                  description: Resource type for this review stage (e.g., project, program)
                  example: project
      responses:
        '200':
          description: Review stages updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                      role:
                        type: string
                      level:
                        type: integer
                      resource_type:
                        type: string
                      organization_code:
                        type: string
                      tenant_code:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Review stages updated successfully
                    result:
                      id: 2
                      role: content_creator
                      level: 1
                      resource_type: project
                      organization_code: org_123
                      tenant_code: default
                      createdAt: '2024-01-15T10:30:00Z'
                      updatedAt: '2024-01-20T14:45:00Z'
        '400':
          description: Bad Request - Invalid ID, role format, resource type, or review stage not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
              examples:
                invalidId:
                  value:
                    responseCode: CLIENT_ERROR
                    message: 'id param is invalid, must be an integer'
                notFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Review stages not found
                invalidResource:
                  value:
                    responseCode: CLIENT_ERROR
                    message: 'resource_type project is not a valid'
