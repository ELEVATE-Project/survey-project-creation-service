  /scp/v1/resource/publishCallback:
    post:
      summary: Callback URL for Update Published Resource
      tags:
        - Resource
      description: |-
        This API is a callback endpoint invoked by the consumption portal after successfully publishing a resource to confirm and update resource status. Updates the resource with the published_id from the consumption service and sets status to PUBLISHED with stage to COMPLETION, recording the published timestamp. Used by consumption portal integration to establish the link between SCP resources and their published counterparts in consumption systems. Ensures complete synchronization of published resource metadata across systems.
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from consumption portal or internal service.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: resource_id
          in: query
          description: 'Resource ID (integer, required). Must be a valid resource that was submitted for publishing.'
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: published_id
          in: query
          description: 'Published resource ID from consumption portal (string, required). This is the identifier assigned by the consumption service.'
          required: true
          schema:
            type: string
          example: '507f1f77bcf86cd799439011'
      responses:
        '202':
          description: 'Resource updated successfully (Accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                            type:
                              type: string
                            version:
                              type: number
              examples:
                updatedExampleRes:
                  value:
                    responseCode: OK
                    message: Resource updated successfully
                    meta:
                      formsVersion:
                        - id: 3
                          type: projecsuccessfullytCreation
                          version: 3
  '/scp/v1/reviews/start/{resourceId}':
    post:
      summary: Start Review
      tags:
        - Review
      description: |-
        This API initiates the review process by a reviewer for a submitted resource and creates or updates the review record to INPROGRESS status. Supports both sequential and parallel review workflows based on organization configuration, with enforcement of exclusivity in sequential mode to prevent simultaneous reviews. Updates resource status to INPROGRESS while recording the last_reviewed_on timestamp for audit tracking. Used by reviewers to begin assessment of resources during the approval workflow.
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains reviewer_id (user_id), organization_code, tenant_code, and roles array.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: resourceId
          description: 'Unique resource ID to start reviewing (integer, 1 to 2147483647). Resource must be submitted for review.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 12
      responses:
        '200':
          description: 'Review started successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: Review started successfully
              examples:
                success:
                  value:
                    responseCode: OK
                    message: Review started successfully
        '400':
          description: 'Bad Request - Resource not found, not available for review, or already being reviewed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: CLIENT_ERROR
                  message:
                    type: string
                    example: Resource not found
              examples:
                notFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource not found
                alreadyReviewing:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource is already PUBLISHED. You can't review it
  '/scp/v1/reviews/update/{resourceId}':
    post:
      summary: Request Changes on Resource Review
      tags:
        - Review
      description: |-
        This API allows reviewers to request changes on a resource under review and optionally attach comments with detailed feedback. Updates the review status to REQUESTED_FOR_CHANGES and resource status accordingly while recording the last_reviewed_on timestamp. Supports both single and bulk comment submissions with draft and open visibility modes for flexible feedback management. Used by reviewers to communicate required modifications before approval during the review workflow.
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains reviewer_id (user_id), organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: resourceId
          description: 'Unique resource ID to request changes on (integer, 1 to 2147483647). Resource must be under review by authenticated reviewer.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 12
      requestBody:
        description: 'Optional request body containing comments for the review'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  description: 'Optional comment field. Can be a single object or array of comment objects. Comments can have DRAFT status (private to reviewer) or OPEN status (visible to creator). Include comment id if updating existing DRAFT comment.'
                  oneOf:
                    - type: object
                    - type: array
                      items:
                        type: object
            examples:
              singleComment:
                value:
                  comment:
                    id: 10
                    text: Check spelling
                    context: page
                    page: 1
                    status: OPEN
              multipleComments:
                value:
                  comment:
                    - text: Fix formatting on page 1
                      context: page
                      page: 1
                      status: OPEN
                    - id: 10
                      text: Updated comment
                      status: OPEN
      responses:
        '200':
          description: 'Changes requested successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                success:
                  value:
                    responseCode: OK
                    message: Changes requested successfully
                    result: {}
        '400':
          description: 'Bad Request - Resource not found, not reviewable, or changes already requested'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                notFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource not found
                    result: {}
                alreadyRequested:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Changes already requested
                    result: {}
  '/scp/v1/reviews/approve/{resourceId}':
    post:
      summary: Approve Resource Review
      tags:
        - Review
      description: |-
        This API enables reviewers to approve resources under review and automatically publishes them when approval thresholds are met based on organization configuration. Updates review status to APPROVED with support for both sequential and parallel review workflows while recording audit timestamps. Optionally accepts comments for approval feedback and automatically cleans up all associated comments upon successful publication. Used by reviewers to complete resource approval and trigger publication when minimum approval requirements are satisfied.
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains reviewer_id (user_id), organization_code, tenant_code, and token for publishing.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: resourceId
          description: 'Unique resource ID to approve (integer, 1 to 2147483647). Resource must be under review by authenticated reviewer.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 12
      requestBody:
        description: 'Optional request body containing comments for the approval'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  description: 'Optional comment array. Comments are created/updated with OPEN status and visible to creator.'
                  type: array
                  items:
                    type: object
            examples:
              withComments:
                value:
                  comment:
                    - text: 'Approved with minor suggestions'
                      context: page
                      page: 1
                      status: OPEN
              noComments:
                value: {}
      responses:
        '200':
          description: 'Review approved successfully or resource published'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                approved:
                  value:
                    responseCode: OK
                    message: Review approved successfully
                    result: {}
                published:
                  value:
                    responseCode: OK
                    message: You have successfully published the resource
                    result: {}
                programPublished:
                  value:
                    responseCode: OK
                    message: You have successfully published the program
                    result: {}
        '400':
          description: 'Bad Request - Resource not found, not reviewable, already approved, or approval failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                notFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource not found
                    result: {}
                approvalFailed:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource approval either failed or has already been approved.
                    result: {}
  '/scp/v1/reviews/rejectOrReport/{resourceId}':
    post:
      summary: Reject or Report Resource Review
      tags:
        - Review
      description: |-
        This API enables reviewers to decline resource approval by rejecting or escalating issues through the report flag based on quality assessment outcomes. Updates review and resource status to final states while recording audit timestamps and optional notes explaining the rejection reason. Supports optional comments and comprehensive feedback with configurable resource type rejection restrictions for compliance. Used by reviewers to return resources that don't meet quality standards or to escalate policy violations to administrators.
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains reviewer_id (user_id), organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: resourceId
          description: 'Unique resource ID to reject or report (integer, 1 to 2147483647). Resource must be under review by authenticated reviewer.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 5
        - in: query
          name: isReported
          description: 'Optional boolean flag. If true, resource is rejected and reported. If false or omitted, resource is only rejected.'
          schema:
            type: boolean
          required: false
          example: true
      requestBody:
        description: 'Optional request body containing notes and comments for the rejection/report'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  description: 'Optional notes explaining the reason for rejection/report. Allowed characters: alphanumeric, space, underscore, ampersand, angle brackets, hyphen.'
                  type: string
                comment:
                  description: 'Optional comment field. Can be a single object or array of comment objects. Comments are created/updated with OPEN status.'
                  oneOf:
                    - type: object
                    - type: array
                      items:
                        type: object
            examples:
              rejectWithNotes:
                value:
                  notes: invalid resource
                  comment:
                    - text: Content violates guidelines
                      context: page
                      page: 1
                      status: OPEN
              reportWithComment:
                value:
                  notes: Inappropriate content reported
                  comment:
                    id: 10
                    text: Check spelling
                    context: page
                    page: 1
                    status: OPEN
      responses:
        '200':
          description: 'Resource rejected or reported successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                rejected:
                  value:
                    responseCode: OK
                    message: This resource has been rejected
                    result: {}
                rejectedAndReported:
                  value:
                    responseCode: OK
                    message: This resource has been rejected and reported
                    result: {}
        '400':
          description: 'Bad Request - Resource not found, not reviewable, or rejection not allowed for resource type'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                notFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource not found
                    result: {}
                notRejectable:
                  value:
                    responseCode: CLIENT_ERROR
                    message: The program cannot be rejected or reported
                    result: {}
  '/scp/v1/comments/update/{id}':
    post:
      summary: Add or Update Comment
      tags:
        - Comment
      description: |-
        Creates or updates review comments on a resource during drafting and review. Supports DRAFT (private), OPEN (shared), and RESOLVED (with resolver tracking) states, plus threaded replies via `parent_id`. Used by creators and reviewers to exchange precise, location-based feedback while enforcing resource-level commentability rules. Accepts single or bulk create requests; updates modify one existing comment identified by path `id`.

        **Overview**:
        - Create: send a single object or an array of comment objects
        - Update: send a single comment object and provide the comment `id` in the path
        - Visibility: DRAFT (default), OPEN, RESOLVED (captures resolver details)
        - Threading: `parent_id` enables replies (defaults to 0 for root)
        - Constraints: commenting blocked on PUBLISHED, REJECTED, REJECTED_AND_REPORTED unless program-associated

        **Validation**:
        - `resource_id` (query): required positive integer (1–2147483647)
        - `id` (path, update only): positive integer (1–2147483647)
        - `text`, `context`, `page` (body): required
        - `status` (body, optional): DRAFT | OPEN | RESOLVED (default DRAFT)
        - `parent_id` (body, optional): defaults to 0
        - Update accepts a single object; create accepts an object or array
        - Resource must exist and be in DRAFT, SUBMITTED, IN_REVIEW, or INPROGRESS
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          description: 'Comment ID for update operations. When provided, updates specific comment. When omitted, creates new comment(s). Must be integer (1 to 2147483647).'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 2
        - in: query
          name: resource_id
          description: 'Required resource ID (integer, positive). Resource must exist and be in commentable status.'
          schema:
            type: integer
            minimum: 1
          required: true
          example: 1
      requestBody:
        description: |-
          **Comment Data Structure**:
          The `comment` property accepts either a single comment object or an array of comments (for bulk operations).

          **Field Details**:
          - `id` (optional): Comment ID - only for UPDATE operations. Identifies existing comment to modify.
          - `text` (required): Comment content/body. Automatically mapped to `comment` field in database.
          - `context` (required): Context type - typically "page" for page-level comments.
          - `page` (required): Page identifier - numeric string indicating page number or location.
          - `status` (optional): Comment visibility (DRAFT=private, OPEN=visible, RESOLVED=closed). Defaults to DRAFT.
          - `parent_id` (optional): Parent comment ID for threaded replies. Defaults to 0 for root comments.
          - `resource_id` (required in query, shown here for clarity): The resource this comment belongs to.

          **Important Notes**:
          - Request uses `text` field, but database stores as `comment` field (auto-converted)
          - For CREATE: omit `id` field
          - For UPDATE: include `id` field with existing comment ID
          - For RESOLVE: set `status: RESOLVED`
          - For bulk operations: pass array of comment objects
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
              properties:
                comment:
                  description: 'Single comment object or array of comment objects'
                  oneOf:
                    - type: object
                      description: 'Single comment (create or update)'
                      properties:
                        id:
                          type: integer
                          description: 'Comment ID (only for UPDATE, omit for CREATE)'
                        resource_id:
                          type: integer
                          description: 'Resource ID comment belongs to'
                        text:
                          type: string
                          description: 'Comment content (required)'
                        context:
                          type: string
                          description: 'Context type (required, usually "page")'
                        page:
                          type: string
                          description: 'Page identifier (required, numeric string)'
                        status:
                          type: string
                          enum: [DRAFT, OPEN, RESOLVED]
                          description: 'Comment status (optional, defaults DRAFT)'
                        parent_id:
                          type: integer
                          description: 'Parent comment ID for threaded replies (optional, defaults 0)'
                    - type: array
                      description: 'Array of comments (for bulk create/update)'
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: 'Comment ID (only if updating)'
                          resource_id:
                            type: integer
                          text:
                            type: string
                          context:
                            type: string
                          page:
                            type: string
                          status:
                            type: string
                            enum: [DRAFT, OPEN, RESOLVED]
                          parent_id:
                            type: integer
            examples:
              scenario1SingleCreate:
                summary: 'Scenario 1: Create Single Comment'
                description: 'Creates one new comment without id field. Status defaults to DRAFT.'
                value:
                  comment:
                    resource_id: 66
                    parent_id: 0
                    status: DRAFT
                    context: page
                    page: '1'
                    text: '<p>assd</p>'
              scenario2BulkCreate:
                summary: 'Scenario 2: Bulk Create Comments'
                description: 'Creates multiple comments in single request. All without id field.'
                value:
                  comment:
                    - resource_id: 66
                      parent_id: 0
                      status: DRAFT
                      context: page
                      page: '1'
                      text: '<p>First comment</p>'
                    - resource_id: 66
                      parent_id: 0
                      status: OPEN
                      context: page
                      page: '2'
                      text: '<p>Second comment visible to all</p>'
                    - resource_id: 66
                      parent_id: 0
                      status: DRAFT
                      context: page
                      page: '3'
                      text: '<p>Third comment private</p>'
              scenario3BulkUpdate:
                summary: 'Scenario 3: Bulk Update Comments'
                description: 'Updates multiple existing comments. All include id field with comment ID.'
                value:
                  comment:
                    - id: 33
                      resource_id: 66
                      parent_id: 0
                      status: OPEN
                      context: page
                      page: '1'
                      text: '<p>Updated comment 1 - now visible</p>'
                    - id: 34
                      resource_id: 66
                      parent_id: 0
                      status: OPEN
                      context: page
                      page: '2'
                      text: '<p>Updated comment 2 - now visible</p>'
              scenario4MixedCreateUpdate:
                summary: 'Scenario 4: Mixed Create and Update'
                description: 'Single request with mix of creating (no id) and updating (with id) comments.'
                value:
                  comment:
                    - id: 33
                      resource_id: 66
                      parent_id: 0
                      status: OPEN
                      context: page
                      page: '1'
                      text: '<p>Updating existing comment</p>'
                    - resource_id: 66
                      parent_id: 0
                      status: DRAFT
                      context: page
                      page: '1'
                      text: '<p>Creating new comment</p>'
                    - id: 35
                      resource_id: 66
                      parent_id: 0
                      status: RESOLVED
                      context: page
                      page: '2'
                      text: '<p>Another update - resolving this one</p>'
              scenario5Resolve:
