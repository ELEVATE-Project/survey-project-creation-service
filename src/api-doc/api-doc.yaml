    get:
      summary: Rollout List
      tags:
        - Rollout
      description: |-
        **Overview**:
        - Retrieves paginated list of rollouts created by authenticated user
        - Includes creator details and organization information from external services
        - Supports search by title (case-insensitive), filtering by resource type and status
        - Returns rollouts with metadata including dates, status, and creator info
        - Scoped to user's organization and tenant

        **Validation Rules**:
        - `page` defaults to 1 if not provided (minimum 1)
        - `limit` defaults to 100 if not provided (maximum 100)
        - `search` performs case-insensitive title matching
        - `resource_type` filters by resource type (comma-separated for multiple types, excludes 'program')
        - `status` must be from: DRAFT, ROLLED_OUT, INACTIVE, PROCESSING, FAILED (comma-separated)
        - `sort_by` options: status, title (defaults to title if not specified)
        - `sort_order` options: asc, desc
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: page
          in: query
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided. Minimum value is 1.'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100.'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          example: 10
        - name: search
          in: query
          description: 'Search text to filter rollouts by title (case-insensitive, uses iLike matching).'
          required: false
          schema:
            type: string
          example: 'education project'
        - name: resource_type
          in: query
          description: 'Resource type filter. Comma-separated values for multiple types. Excludes program-type rollouts. Valid values: project, survey, observation.'
          required: false
          schema:
            type: string
          example: project
        - name: status
          in: query
          description: 'Status filter. Comma-separated values for multiple statuses. Valid values: DRAFT (pending), ROLLED_OUT (published), INACTIVE, PROCESSING, FAILED.'
          required: false
          schema:
            type: string
            enum: [DRAFT, ROLLED_OUT, INACTIVE, PROCESSING, FAILED]
          example: DRAFT
        - name: sort_by
          in: query
          description: 'Sort field. Options: status, title. Default sorting is by title if not specified.'
          required: false
          schema:
            type: string
            enum: [status, title]
          example: status
        - name: sort_order
          in: query
          description: 'Sort order: asc (ascending) or desc (descending).'
          required: false
          schema:
            type: string
            enum:
