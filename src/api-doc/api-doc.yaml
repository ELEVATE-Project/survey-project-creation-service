      summary: Reviewer List
      tags:
        - Projects
      operationId: getReviewerList
      description: |-
        **Overview**:
        - Retrieves a paginated list of users with reviewer role from the user service
        - Excludes the authenticated user from the reviewer list
        - Fetches reviewer details including name, email, phone, organization information
        - Supports pagination with configurable page size (max 100 records per page)
        - Returns empty list if no reviewers found or user service call fails
        - Scoped to user's organization and tenant

        **Validation Rules**:
        - `page` must be a positive integer (defaults to 1 if not provided or invalid)
        - `limit` must be a positive integer between 1 and 100 (defaults to 100)
        - Authenticated user is automatically excluded from results
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for user service API calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: page
          in: query
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided or invalid. Minimum value is 1.'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
