                    responseCode: CLIENT_ERROR
                    message:
                      key: FORBIDDEN_RESOURCE_UPDATE
                      interpolation:
                        resourceTitle: Sample Project
                        reviewer_count: 0
                    result: {}
    delete:
      summary: Delete Project (Soft Delete)
      tags:
        - Projects
      operationId: deleteProject
      description: |-
        **Overview**:
        - Soft deletes a project from the system by marking it as deleted in the database
        - Only the project creator can delete their own projects
        - Project data is preserved in database with deletion timestamp for audit purposes
        - Requires authentication token with user_id, organization_code, and tenant_code

        **Validation Rules**:
        - `projectId` must be a valid integer (1 to 2147483647)
        - Project must exist and belong to the authenticated user (user_id match)
        - Project must be in DRAFT status (cannot delete submitted/published projects)
        - Project must be in CREATION stage (cannot delete projects in REVIEW or COMPLETION stage)
        - Project must belong to user's organization and tenant
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: projectId
          description: 'Unique project ID to soft delete (numeric, positive integer, 1 to 2147483647). Must belong to authenticated user.'
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1
      responses:
        '202':
          description: 'Project deleted successfully (soft delete accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'OK'
                  message:
                    type: string
                    example: 'PROJECT_DELETED_SUCCESSFUL'
                  result:
                    type: object
                    description: 'Empty object for successful deletion'
                    example: {}
                  meta:
                    type: object
              examples:
                deleteExample:
                  summary: 'Project Deleted Successfully'
                  value:
                    responseCode: OK
                    message: PROJECT_DELETED_SUCCESSFUL
                    result: {}
                    meta: {}
        '400':
          description: 'Bad Request - Project not found or does not meet deletion criteria'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'CLIENT_ERROR'
                  message:
                    type: string
                    example: 'PROJECT_NOT_FOUND'
                  result:
                    type: object
              examples:
                notFoundExample:
                  summary: 'Project Not Found'
                  value:
                    responseCode: CLIENT_ERROR
                    message: PROJECT_NOT_FOUND
                    result: {}
                unauthorizedExample:
                  summary: 'Project Not Owned by User'
                  value:
                    responseCode: CLIENT_ERROR
                    message: PROJECT_NOT_FOUND
                    result: {}
  '/scp/v1/projects/submitForReview/{projectId}':
    post:
      summary: Submit Project for Review
      tags:
        - Projects
      operationId: submitForReview
      description: |-
        **Overview**:
        - Submits a project for review by creating review entries for selected reviewers or making it available to all reviewers
        - Validates project data including tasks, entity tagging, and task dates before submission
        - Supports optional reviewer selection or submission to all reviewers based on organization configuration
        - If review is not mandatory (per organization config), project is automatically published
        - Changes project status to SUBMITTED and stage to REVIEW upon successful submission
        - Only project creator can submit their own projects for review

        **Validation Rules**:
        - `projectId` must be a valid integer (1 to 2147483647) and exist in the system
        - Project must belong to the authenticated user (creator only)
        - Project cannot be in PUBLISHED, REJECTED, REJECTED_AND_REPORTED, or already SUBMITTED status
        - All open comments must be resolved before submission
        - Project task count must not exceed MAX_PROJECT_TASK_COUNT environment variable limit
        - `notes` character length must not exceed MAX_RESOURCE_NOTE_LENGTH (optional field)
        - `reviewer_ids` must be an array of valid reviewer user IDs (optional, excluding creator)
        - Reviewer IDs must belong to users with reviewer role in the same organization and tenant
        - Entity tagging validation is performed if enabled
        - Task start/end date validation if ENABLE_TASK_START_END_DATE_IN_PROJECTS is true
        - All entity type validations for project and tasks are enforced
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for reviewer validation.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: projectId
          description: 'Unique project ID to submit for review (numeric, positive integer, 1 to 2147483647). Must belong to authenticated user.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1
      requestBody:
        description: 'Optional request body for reviewer selection and notes'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewer_ids:
                  description: 'Optional array of reviewer user IDs. If provided, project is assigned to specific reviewers. If omitted, project is available to all reviewers based on organization config.'
                  type: array
                  items:
                    type: string
                  minItems: 1
                  example: ['23', '25']
                notes:
                  description: 'Optional notes for reviewers. Character length must not exceed MAX_RESOURCE_NOTE_LENGTH environment variable.'
                  type: string
                  maxLength: 500
                  example: 'Note to the reviewer'
            examples:
              specificReviewers:
                summary: 'Submit to specific reviewers'
                description: 'When specific reviewers are selected, their user IDs are sent as an array, and the project is assigned to those reviewers.'
                value:
                  reviewer_ids:
                    - '23'
                    - '25'
                  notes: 'Note to the reviewer'
              allReviewers:
                summary: 'Submit to all reviewers'
                description: 'When the project is sent to all reviewers, no body parameters are required. The project will be available for all reviewers based on organization configuration.'
                value: {}
      responses:
        '200':
          description: 'Project submitted for review successfully (or auto-published if review not mandatory)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'OK'
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: 'Project ID'
                        example: 1
                  meta:
                    type: object
              examples:
                submitExample:
                  summary: 'Project Submitted Successfully'
                  value:
                    responseCode: OK
                    message: Project Submitted Successfully
                    result:
                      id: 1
                    meta: {}
        '400':
          description: 'Bad Request - Various validation failures'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteProject400Response'
  '/scp/v1/projects/republish/{projectId}':
    post:
      summary: Republish Project
      tags:
        - Projects
      operationId: republishProject
      description: |-
        **Overview**:
        - Republishes an already published project to the consumption portal/service
        - Validates project exists and user has access (authorization check via project details)
        - Only projects with PUBLISHED status can be republished
        - Project must not have been previously published (no published_id)
        - Publishes project data through Kafka or API endpoint based on configuration
        - Updates project status to PUBLISHED with published_on timestamp
        - Project stage changes to COMPLETION after republish
        - All associated comments are deleted after successful republish

        **Validation Rules**:
        - `projectId` must be a valid integer (1 to 2147483647)
        - Project must exist and belong to user's organization and tenant
        - Project status must be PUBLISHED (cannot republish drafts or submitted projects)
        - Project must not have published_id already set (prevents duplicate republish)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for authorization.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: projectId
          description: 'Unique project ID to republish (numeric, positive integer, 1 to 2147483647). Must be a published project.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 1
      responses:
        '200':
          description: 'Project republished successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
              examples:
                republishExample:
                  value:
                    responseCode: OK
                    message: Project republished successfully.
                    result:
                      id: 1
        '400':
          description: 'Bad Request - Various validation failures'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleteProject400Response'
