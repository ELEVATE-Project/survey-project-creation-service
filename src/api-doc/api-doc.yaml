      description: |-
        This API retrieves a paginated list of published resources (projects, programs, surveys, observations) filtered by user's role-based permissions and organization visibility policies. Supports multiple resource types with flexible search, filtering, and sorting capabilities including creator details and reviewer information. Resources are filtered by PUBLISHED status and is_reusable flag to ensure only appropriate resources are displayed. Used by all users to discover and browse published resources available to them within their organization scope.

        **Validations**:
        - `type` must be from allowed values: project, program, survey, observation, observation_with_rubric
        - `page` must be positive integer (1-indexed, defaults to 1)
        - `limit` must be between 1 and 100 (defaults to 100, capped at 100)
        - `search` performs case-insensitive title matching if provided
        - `sort_by` must be from: created_at, updated_at, title (defaults to updated_at)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, roles array, and token for service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: page
          in: query
          description: 'Page number for pagination (1-indexed). Defaults to 1 if not provided. Minimum value is 1.'
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: 'Number of records per page. Defaults to 100 if not provided. Maximum allowed is 100. Values exceeding 100 will be capped at 100.'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          example: 10
        - name: search
          in: query
          description: 'Search text to filter resources by title (case-insensitive, uses iLike matching).'
          required: false
          schema:
            type: string
          example: 'education'
        - name: type
          in: query
          description: 'Resource type filter. Comma-separated values allowed for multiple types. Must be from: project, program, observation, survey, observation_with_rubric. Only types allowed by user role permissions will be returned.'
          required: false
          schema:
            type: string
          example: 'project,program'
        - name: sort_by
          in: query
          description: 'Sort field. Options: created_at, updated_at, title. Default is updated_at if not specified.'
