  /scp/v1/resource/publishCallback:
    post:
      summary: Callback URL for Update Published Resource
      tags:
        - Resource
      description: |-
        **Overview**:
        - Callback endpoint used by consumption portal after successfully publishing a resource
        - Updates resource with published_id from consumption portal
        - Sets resource status to PUBLISHED and stage to COMPLETION
        - Records published_on timestamp
        - Only updates resources not in DRAFT status
        - Returns 400 error if resource not found or already in DRAFT status

        **Validation Rules**:
        - `resource_id` is required (integer, positive)
        - `published_id` is required (string from consumption portal)
        - Resource must exist and not be in DRAFT status
        - Resource must have been submitted for publishing
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from consumption portal or internal service.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: resource_id
          in: query
          description: 'Resource ID (integer, required). Must be a valid resource that was submitted for publishing.'
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: published_id
          in: query
          description: 'Published resource ID from consumption portal (string, required). This is the identifier assigned by the consumption service.'
          required: true
          schema:
            type: string
          example: '507f1f77bcf86cd799439011'
      responses:
        '202':
          description: 'Resource updated successfully (Accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                  meta:
                    type: object
                    properties:
                      formsVersion:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                            type:
                              type: string
                            version:
                              type: number
              examples:
                updatedExampleRes:
                  value:
                    responseCode: OK
                    message: Resource updated successfully
                    meta:
                      formsVersion:
                        - id: 3
                          type: projecsuccessfullytCreation
                          version: 3
  '/scp/v1/reviews/start/{resourceId}':
    post:
      summary: Start Review
      tags:
        - Review
      description: |-
        **Overview**:
        - Initiates review process for a submitted resource by a reviewer
        - Creates review record if not exists or updates existing review to INPROGRESS
        - Validates resource is available for review (not PUBLISHED, REJECTED, or DRAFT)
        - Updates resource status to INPROGRESS if not already in REQUESTED_FOR_CHANGES
        - Records last_reviewed_on timestamp in resource
        - Supports both sequential and parallel review workflows based on organization config
        - Prevents multiple reviewers from reviewing simultaneously in sequential mode

        **Validation Rules**:
        - `resourceId` must be a valid integer (1 to 2147483647)
        - Resource must exist in reviewer's organization and tenant
        - Resource must be in reviewable status (SUBMITTED, IN_REVIEW, INPROGRESS, CHANGES_UPDATED)
        - For sequential review: no other reviewer should be actively reviewing
        - Reviewer must have reviewer role in organization
        - Review record created with status INPROGRESS
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains reviewer_id (user_id), organization_code, tenant_code, and roles array.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: resourceId
          description: 'Unique resource ID to start reviewing (integer, 1 to 2147483647). Resource must be submitted for review.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 12
      responses:
        '200':
          description: 'Review started successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: Review started successfully
              examples:
                success:
                  value:
                    responseCode: OK
                    message: Review started successfully
        '400':
          description: 'Bad Request - Resource not found, not available for review, or already being reviewed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: CLIENT_ERROR
                  message:
                    type: string
                    example: Resource not found
              examples:
                notFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource not found
                alreadyReviewing:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource is already PUBLISHED. You can't review it
  '/scp/v1/reviews/update/{resourceId}':
    post:
      summary: Request Changes on Resource Review
      tags:
        - Review
      description: |-
        **Overview**:
        - Allows reviewer to request changes on a resource under review
        - Updates review status to REQUESTED_FOR_CHANGES
        - Optionally creates or updates comments associated with the review
        - Updates resource status to REQUESTED_FOR_CHANGES
        - Records last_reviewed_on timestamp in resource
        - Validates reviewer has an active review for the resource
        - Prevents requesting changes if already requested

        **Validation Rules**:
        - `resourceId` must be a valid integer (1 to 2147483647)
        - Resource must exist in reviewer's organization and tenant
        - Resource must be in reviewable status (SUBMITTED, IN_REVIEW, INPROGRESS, CHANGES_UPDATED)
        - Reviewer must have an ongoing review record for the resource
        - Review status cannot already be REQUESTED_FOR_CHANGES
        - `comment` is optional but if provided can be object or array of objects
        - Comments support draft status and can be finalized with OPEN status
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains reviewer_id (user_id), organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: resourceId
          description: 'Unique resource ID to request changes on (integer, 1 to 2147483647). Resource must be under review by authenticated reviewer.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 12
      requestBody:
        description: 'Optional request body containing comments for the review'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  description: 'Optional comment field. Can be a single object or array of comment objects. Comments can have DRAFT status (private to reviewer) or OPEN status (visible to creator). Include comment id if updating existing DRAFT comment.'
                  oneOf:
                    - type: object
                    - type: array
                      items:
                        type: object
            examples:
              singleComment:
                value:
                  comment:
                    id: 10
                    text: Check spelling
                    context: page
                    page: 1
                    status: OPEN
              multipleComments:
                value:
                  comment:
                    - text: Fix formatting on page 1
                      context: page
                      page: 1
                      status: OPEN
                    - id: 10
                      text: Updated comment
                      status: OPEN
      responses:
        '200':
          description: 'Changes requested successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                success:
                  value:
                    responseCode: OK
                    message: Changes requested successfully
                    result: {}
        '400':
          description: 'Bad Request - Resource not found, not reviewable, or changes already requested'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                notFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource not found
                    result: {}
                alreadyRequested:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Changes already requested
                    result: {}
  '/scp/v1/reviews/approve/{resourceId}':
    post:
      summary: Approve Resource Review
      tags:
        - Review
      description: |-
        **Overview**:
        - Approves a resource under review and updates review status to APPROVED
        - Optionally creates or updates comments associated with the approval
        - Checks if minimum approval threshold is met based on organization configuration
        - Automatically publishes resource if approval threshold reached
        - Supports sequential review (next stage increment) and parallel review workflows
        - Updates resource status and last_reviewed_on timestamp
        - Deletes all comments after successful publication

        **Validation Rules**:
        - `resourceId` must be a valid integer (1 to 2147483647)
        - Resource must exist in reviewer's organization and tenant
        - Resource must be in reviewable status (SUBMITTED, IN_REVIEW, INPROGRESS, CHANGES_UPDATED)
        - Reviewer must have an ongoing review record for the resource
        - Review cannot already be APPROVED or REQUESTED_FOR_CHANGES
        - `comment` is optional (can be array of comment objects)
        - Resource publishes when approved count >= min_approval from org config
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains reviewer_id (user_id), organization_code, tenant_code, and token for publishing.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: resourceId
          description: 'Unique resource ID to approve (integer, 1 to 2147483647). Resource must be under review by authenticated reviewer.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 12
      requestBody:
        description: 'Optional request body containing comments for the approval'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  description: 'Optional comment array. Comments are created/updated with OPEN status and visible to creator.'
                  type: array
                  items:
                    type: object
            examples:
              withComments:
                value:
                  comment:
                    - text: 'Approved with minor suggestions'
                      context: page
                      page: 1
                      status: OPEN
              noComments:
                value: {}
      responses:
        '200':
          description: 'Review approved successfully or resource published'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                approved:
                  value:
                    responseCode: OK
                    message: Review approved successfully
                    result: {}
                published:
                  value:
                    responseCode: OK
                    message: You have successfully published the resource
                    result: {}
                programPublished:
                  value:
                    responseCode: OK
                    message: You have successfully published the program
                    result: {}
        '400':
          description: 'Bad Request - Resource not found, not reviewable, already approved, or approval failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                notFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource not found
                    result: {}
                approvalFailed:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource approval either failed or has already been approved.
                    result: {}
  '/scp/v1/reviews/rejectOrReport/{resourceId}':
    post:
      summary: Reject or Report Resource Review
      tags:
        - Review
      description: |-
        **Overview**:
        - Allows reviewer to reject or report a resource under review
        - Updates review status to REJECTED or REJECTED_AND_REPORTED based on isReported flag
        - Optionally adds notes explaining reason for rejection/report
        - Optionally creates or updates comments associated with the rejection
        - Updates resource status and sets stage to COMPLETION
        - Records last_reviewed_on timestamp in resource
        - Certain resource types cannot be rejected (configured via NON_REJECTABLE_RESOURCE_TYPES)

        **Validation Rules**:
        - `resourceId` must be a valid integer (1 to 2147483647)
        - `isReported` is optional boolean (true for report, false/omitted for reject)
        - Resource must exist in reviewer's organization and tenant
        - Resource must be in reviewable status (SUBMITTED, IN_REVIEW, INPROGRESS, CHANGES_UPDATED)
        - Resource type must be rejectable (not in NON_REJECTABLE_RESOURCE_TYPES)
        - Reviewer must have an ongoing review record for the resource
        - `notes` is optional but must contain alphanumeric characters and allowed symbols
        - `comment` is optional (can be object or array of objects)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains reviewer_id (user_id), organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: resourceId
          description: 'Unique resource ID to reject or report (integer, 1 to 2147483647). Resource must be under review by authenticated reviewer.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 5
        - in: query
          name: isReported
          description: 'Optional boolean flag. If true, resource is rejected and reported. If false or omitted, resource is only rejected.'
          schema:
            type: boolean
          required: false
          example: true
      requestBody:
        description: 'Optional request body containing notes and comments for the rejection/report'
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  description: 'Optional notes explaining the reason for rejection/report. Allowed characters: alphanumeric, space, underscore, ampersand, angle brackets, hyphen.'
                  type: string
                comment:
                  description: 'Optional comment field. Can be a single object or array of comment objects. Comments are created/updated with OPEN status.'
                  oneOf:
                    - type: object
                    - type: array
                      items:
                        type: object
            examples:
              rejectWithNotes:
                value:
                  notes: invalid resource
                  comment:
                    - text: Content violates guidelines
                      context: page
                      page: 1
                      status: OPEN
              reportWithComment:
                value:
                  notes: Inappropriate content reported
                  comment:
                    id: 10
                    text: Check spelling
                    context: page
                    page: 1
                    status: OPEN
      responses:
        '200':
          description: 'Resource rejected or reported successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                rejected:
                  value:
                    responseCode: OK
                    message: This resource has been rejected
                    result: {}
                rejectedAndReported:
                  value:
                    responseCode: OK
                    message: This resource has been rejected and reported
                    result: {}
        '400':
          description: 'Bad Request - Resource not found, not reviewable, or rejection not allowed for resource type'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                notFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource not found
                    result: {}
                notRejectable:
                  value:
                    responseCode: CLIENT_ERROR
                    message: The program cannot be rejected or reported
                    result: {}
  '/scp/v1/comments/update/{id}':
    post:
      summary: Add or Update Comment
      tags:
        - Comment
      description: |-
        **Overview**:
        - Creates new comment(s) or updates existing comment by ID
        - Supports single comment object or array of comment objects for bulk operations
        - Comments can have status: DRAFT (private), OPEN (visible), or RESOLVED
        - When resolving comment, records resolver ID and timestamp
        - Validates resource exists and is in commentable status
        - Prevents comments on PUBLISHED, REJECTED, REJECTED_AND_REPORTED, or DRAFT resources (except program-associated resources)
        - Handles comment field mapping (text → comment in database)

        **Validation Rules**:
        - `resource_id` is required in query (integer, positive)
        - `id` in path is optional for creation, required for single update
        - If `id` provided, `comment` must be object (not array)
        - If no `id`, `comment` can be object or array for bulk creation
        - Comment `status` must be one of: DRAFT, OPEN, RESOLVED
        - `comment` field is required for comment content
        - `context` and `page` fields required for comment location
        - `parent_id` optional for threaded comments (integer)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: id
          description: 'Optional comment ID for updating specific comment. Omit for creating new comment(s). Must be integer (1 to 2147483647).'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: false
          example: 2
        - in: query
          name: resource_id
          description: 'Required resource ID (integer, positive). Resource must exist and be in commentable status.'
          schema:
            type: integer
            minimum: 1
          required: true
          example: 1
      requestBody:
        description: 'Comment data. Can be single comment object (for update/create) or array of comments (for bulk create only).'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  description: 'Comment object or array. For single update (with id), must be object. For bulk create (no id), can be array.'
                  oneOf:
                    - type: object
                      properties:
                        comment:
                          type: string
                          description: 'Comment content (required)'
                        status:
                          type: string
                          enum: [DRAFT, OPEN, RESOLVED]
                          description: 'Comment status. DRAFT = private, OPEN = visible, RESOLVED = closed'
                        context:
                          type: string
                          description: 'Context type (e.g., "page", "tag")'
                        page:
                          type: string
                          description: 'Page identifier or number'
                        parent_id:
                          type: integer
                          description: 'Parent comment ID for threaded comments (optional, default 0)'
                    - type: array
                      items:
                        type: object
                        properties:
                          comment:
                            type: string
                            description: 'Comment content'
                          status:
                            type: string
                            enum: [DRAFT, OPEN, RESOLVED]
                          context:
                            type: string
                          page:
                            type: string
                          parent_id:
                            type: integer
            examples:
              createSingleComment:
                value:
                  comment:
                    comment: 'Check spelling on this page'
                    status: OPEN
                    context: page
                    page: '1'
                    parent_id: 0
              createBulkComments:
                value:
                  comment:
                    - comment: 'Fix formatting'
                      status: OPEN
                      context: page
                      page: '1'
                    - comment: 'Update content'
                      status: DRAFT
                      context: page
                      page: '2'
              updateComment:
                value:
                  comment:
                    text: 'Updated comment text'
                    status: All comments have been resolved
                    context: page
                    page: '1'
      responses:
        '200':
          description: 'Comment created or updated successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                commentUpdated:
                  value:
                    responseCode: OK
                    message: Your changes have been saved
                    result: {}
                commentResolved:
                  value:
                    responseCode: OK
                    message: All comments have been resolved
                    result: {}
        '400':
          description: 'Bad Request - Resource not found, invalid status, or comment restrictions'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                resourceNotFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Resource not found
                    result: {}
                commentNotFound:
                  value:
                    responseCode: CLIENT_ERROR
                    message: Comment not found
                    result: {}
  '/scp/v1/comments/update/{commentId}':
    delete:
      summary: Delete Comment
      tags:
        - Comment
      description: |-
        **Overview**:
        - Soft deletes a comment from the system (paranoid deletion)
        - Only comment owner can delete their own comments
        - Only comments in DRAFT status can be deleted
        - Validates comment belongs to specified resource
        - Scoped to user's organization and tenant for security
        - Comment record marked as deleted but preserved in database

        **Validation Rules**:
        - `commentId` must be a valid integer (1 to 2147483647)
        - `resource_id` is required (integer, positive)
        - Comment must exist and belong to authenticated user (user_id match)
        - Comment status must be DRAFT (cannot delete OPEN or RESOLVED comments)
        - Comment must belong to specified resource
        - Comment must belong to user's organization and tenant
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, and tenant_code.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: path
          name: commentId
          description: 'Unique comment ID to delete (integer, 1 to 2147483647). Comment must be in DRAFT status and belong to the authenticated user.'
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          required: true
          example: 2
        - in: query
          name: resource_id
          description: 'Resource ID associated with the comment (integer, required). Used to validate comment belongs to specified resource.'
          schema:
            type: integer
            minimum: 1
          required: true
          example: 1
      responses:
        '200':
          description: 'Comment deleted successfully (soft delete)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
              examples:
                success:
                  value:
                    responseCode: OK
                    message: Comment deleted successfully
                    result: {}
        '400':
          description: 'Bad Request - Comment not found or does not meet deletion criteria'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateComment400Response'
  /scp/v1/comments/list:
    get:
      summary: Comment List
      tags:
        - Comment
      description: |-
        **Overview**:
        - Retrieves all comments for a specific resource with optional filtering
        - Returns comments visible to authenticated user (OPEN/RESOLVED status or user's own DRAFT comments)
        - Includes commenter and resolver user details from user service
        - For program resources, also fetches child resources with their comment counts
        - Supports filtering by page location (page_value) and context (page/tag)
        - Comments returned with complete metadata including status, timestamps, and user info

        **Validation Rules**:
        - `resource_id` is required (integer, positive)
        - `page_value` is optional (string) - filters comments by specific page/location
        - `context` is optional (string) - filters comments by context type (page/tag)
        - Comments filtered by organization and tenant scope automatically
        - Only non-DRAFT comments visible to others, user's own DRAFT comments included
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token contains user_id, organization_code, tenant_code, and token for user service calls.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - in: query
          name: resource_id
          description: 'Resource ID to fetch comments for (integer, required). Comments will be filtered by this resource.'
          schema:
            type: integer
            minimum: 1
          required: true
          example: 1
        - in: query
          name: page_value
          description: 'Optional page identifier or location name to filter comments (e.g., task_page, objective_page).'
          schema:
            type: string
          required: false
          example: task_page
        - in: query
          name: context
          description: 'Optional context type to filter comments. Values: page (page-level comments) or tag (entity tag comments).'
          schema:
            type: string
          required: false
          example: page
      responses:
        '200':
          description: 'Comments fetched successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      resource_id:
                        type: integer
                        description: 'Resource ID for which comments were fetched'
                      commented_by:
                        type: array
                        items:
                          type: string
                        description: 'Unique list of commenter names'
                      comments:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            comment:
                              type: string
                              description: 'Comment content (aliased from comment field)'
                            context:
                              type: string
                            page:
                              type: string
                            status:
                              type: string
                              enum: [DRAFT, OPEN, RESOLVED]
                            parent_id:
                              type: integer
                              nullable: true
                            user_id:
                              type: string
                            commenter:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                            is_read:
                              type: boolean
                            resolved_by:
                              type: string
                              nullable: true
                            resolver:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                            resolved_at:
                              type: string
                              format: date-time
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                      count:
                        type: integer
                        description: 'Total count of comments returned'
                      childResources:
                        type: array
                        description: 'For program resources only - lists child resources with comment counts'
                        items:
                          type: object
                          properties:
                            resource_id:
                              type: integer
                            is_comments:
                              type: boolean
                            count:
                              type: integer
              examples:
                success:
                  value:
                    responseCode: OK
                    message: Comments fetched successfully
                    result:
                      resource_id: 1
                      commented_by:
                        - Adithya
                      comments:
                        - id: 2
                          comment: Check spelling
                          context: page
                          page: 1
                          status: RESOLVED
                          parent_id: 1
                          user_id: '24'
                          commenter:
                            id: '24'
                            name: Priyanka
                          is_read: true
                          resolved_by: '25'
                          resolver:
                            id: '25'
                            name: Adithya
                          resolved_at: '2024-04-11T06:43:43.995Z'
                          created_at: '2024-04-10T10:30:00.000Z'
                          updated_at: '2024-04-11T06:43:43.995Z'
                        - id: 3
                          comment: Add valid title
                          context: page
                          page: 1
                          status: OPEN
                          parent_id: null
                          user_id: '24'
                          commenter:
                            id: '24'
                            name: Priyanka
                          is_read: true
                          resolved_by: null
                          resolver: {}
                          resolved_at: null
                          created_at: '2024-04-10T11:00:00.000Z'
                          updated_at: '2024-04-10T11:00:00.000Z'
                      count: 2
                      childResources:
