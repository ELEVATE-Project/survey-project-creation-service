  /scp/v1/entity-types/read:
    post:
      summary: Read entity type
      tags:
        - Entity Types
      operationId: readEntityType
      description: |-
        This API retrieves entity types with two operational modes: fetch specific entity types with their entities, or retrieve all system entity types. Used by administrators and clients to discover entity type configurations with flexible filtering and automatic organization and tenant scoping. Supports optional user-created entity inclusion and provides comprehensive entity type metadata including dependencies and configurations.

        **Two Operational Modes**:

        **Mode 1 - Read Specific Entity Types** (provide `value` array): Returns entity types matching the provided values with their ACTIVE associated entities, filtered to user's organization and tenant.

        **Mode 2 - Read All System Entity Types** (empty request body): Returns all ACTIVE entity types available to the organization, including both organization-specific and system-wide (default organization) entity types without nested entities.

        **Validations**:
        - Authentication token is required and must be valid (admin or org_admin role)
        - Entity type values must exist in the system if provided in value array
        - Only ACTIVE entity types and entities are returned
        - Results automatically scoped to authenticated user's organization and tenant
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Entity type read request object'
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: array
                  description: 'Array of entity type values to fetch with entities (optional). If omitted, system entity types are returned'
                  items:
                    type: string
                    example: 'ln'
                read_user_entity:
                  type: boolean
                  description: 'Optional flag to include user-created entities in results. Defaults to false'
            examples:
              example1:
                summary: 'Mode 1: Fetch specific entity types with entities (provide value array)'
                value:
                  value:
                    - ln
                    - region
                  read_user_entity: true
              example2:
                summary: 'Mode 2: Fetch all system entity types (empty body or no value array)'
                value: {}
      responses:
        '200':
          description: 'Entity types retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: ENTITY_TYPE_FETCHED_SUCCESSFULLY
                  result:
                    type: array
                    description: 'When value array provided: Array of entity type objects with nested entities'
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 4
                        value:
                          type: string
                          example: ln
                        label:
                          type: string
                          example: Languages
                        status:
                          type: string
                          enum: [ACTIVE, INACTIVE]
                          example: ACTIVE
                        data_type:
                          type: string
                          example: STRING
                        allow_filtering:
                          type: boolean
                          example: false
                        allow_custom_entities:
                          type: boolean
                          example: true
                        has_entities:
                          type: boolean
                          example: true
                        parent_id:
                          type: number
                          nullable: true
                          example: null
                        organization_code:
                          type: string
                          example: default_code
                        tenant_code:
                          type: string
                          example: default
                        config:
                          type: object
                          description: 'Configuration object storing is_external, depended_on, and is_dependent flags'
                          nullable: true
                          example: { is_external: false, depended_on: null, is_dependent: false }
                        validations:
                          type: object
                          description: 'Validation rules for entity type'
                          nullable: true
                        created_by:
                          type: string
                          example: user123
                        updated_by:
                          type: string
                          nullable: true
                          example: user456
                        created_at:
                          type: string
                          format: date-time
                          example: '2023-09-21T10:16:19.270Z'
                        updated_at:
                          type: string
                          format: date-time
                          example: '2023-09-21T10:16:19.270Z'
                        deleted_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: 'Null for active records, timestamp for soft-deleted records'
                        entities:
                          type: array
                          description: 'ACTIVE entities associated with this entity type'
                          items:
                            type: object
                            properties:
                              id:
                                type: number
                              entity_type_id:
                                type: number
                              value:
                                type: string
                              label:
                                type: string
                              status:
                                type: string
                                enum: [ACTIVE, INACTIVE]
                              type:
                                type: string
                                example: SYSTEM
                              created_by:
                                type: string
                              updated_by:
                                type: string
                                nullable: true
                              created_at:
                                type: string
                                format: date-time
                              updated_at:
                                type: string
                                format: date-time
              examples:
                example1:
                  summary: 'Mode 1 Response: Entity types with entities'
                  value:
                    responseCode: OK
                    message: Entity type fetched successfully
                    result:
                      - id: 4
                        value: ln
                        label: Languages
                        status: ACTIVE
                        data_type: STRING
                        allow_filtering: false
                        allow_custom_entities: true
                        has_entities: true
                        parent_id: null
                        organization_code: default_code
                        tenant_code: default
                        config: { is_external: false, is_dependent: false }
                        validations: null
                        created_by: 1
                        updated_by: null
                        created_at: '2023-09-21T10:16:19.270Z'
                        updated_at: '2023-09-21T10:16:19.270Z'
                        deleted_at: null
                        entities:
                          - id: 13
                            entity_type_id: 4
                            value: ml
                            label: Malayalam
                            status: ACTIVE
                            type: SYSTEM
                            created_by: 1
                            updated_by: null
                            created_at: '2023-09-21T10:16:33.583Z'
                            updated_at: '2023-09-21T10:16:33.583Z'
                example2:
                  summary: 'Mode 2 Response: All system entity types (without entities)'
                  value:
                    responseCode: OK
                    message: Entity type fetched successfully
                    result:
                      - id: 4
                        value: ln
                        label: Languages
                      - id: 5
                        value: region
                        label: Regions
                      - id: 6
                        value: subject
                        label: Subjects
        '400':
          description: 'Bad Request - Entity type not found or invalid input'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateUserEntity400Response'
  '/scp/v1/entity-types/delete/{id}':
    delete:
      summary: Delete entity type (Soft Delete)
      tags:
        - Entity Types
      operationId: deleteEntityType
      description: |-
        This API soft deletes an entity type from the system while preserving the record for audit and compliance purposes. Admin-only operation that marks the entity type as deleted without permanent removal, cascading the deletion to related entities and model mappings. Used by administrators to decommission entity types while maintaining audit trails and compliance documentation. Soft deletion is permanent through the API and cannot be undone.

        **Validations**:
        - Entity type ID must exist in the system and belong to user's organization
        - Entity type must be in the same tenant as the authenticated user
        - Admin or org_admin role required from authentication token
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Valid entity type ID to soft delete (numeric, positive integer, 1 to 2147483647)'
          required: true
          schema:
            type: number
            minimum: 1
            maximum: 2147483647
          example: 2
      responses:
        '202':
          description: 'Entity type deleted successfully (Soft delete accepted)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: OK
                  message:
                    type: string
                    example: ENTITY_TYPE_DELETED_SUCCESSFULLY
                  result:
                    type: object
                    description: 'Empty object (no data returned on successful deletion)'
                    example: {}
              examples:
                example1:
                  summary: 'Successful entity type deletion'
                  value:
                    responseCode: OK
                    message: ENTITY_TYPE_DELETED_SUCCESSFULLY
                    result: {}
        '400':
          description: 'Bad Request - Entity type not found or invalid ID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: CLIENT_ERROR
                  message:
                    type: string
                    example: ENTITY_TYPE_NOT_FOUND
              examples:
                example1:
                  summary: 'Entity type not found'
                  value:
                    responseCode: CLIENT_ERROR
                    message: ENTITY_TYPE_NOT_FOUND
  /scp/v1/entities/create:
    post:
      summary: Create Entity
      tags:
        - Entity
      operationId: createEntity
      description: |-
        This API creates new entities within a specified entity type to build organizational units and data classifications. Admin-only operation used to populate entity types with values like languages, regions, or schools. Entity values are automatically converted to lowercase and enforced as unique per entity type, organization, and tenant. Organization and tenant context are automatically set from the authentication token.

        **Validations**:
        - Entity `value` must be unique per entity type, organization, and tenant (automatically converted to lowercase)
        - `value` must contain only letters and underscores (no spaces, no special characters)
        - `label` can contain letters, numbers, and spaces
        - `entity_type_id` must reference an existing entity type in the system and belong to the same organization and tenant
        - `status` defaults to ACTIVE if not provided (ACTIVE or INACTIVE)
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Entity object with required fields'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: 'Unique identifier for the entity (letters and underscores only, will be converted to lowercase). Cannot be empty or null.'
                label:
                  type: string
                  description: 'Descriptive label for the entity (letters, numbers, and spaces allowed). Cannot be empty or null.'
                entity_type_id:
                  type: number
                  description: 'ID of the entity type this entity belongs to (must be numeric, positive integer). Cannot be empty or null.'
                status:
                  type: string
                  description: 'Entity status (optional, defaults to ACTIVE). Valid values: ACTIVE, INACTIVE.'
                  enum: ['ACTIVE', 'INACTIVE']
                type:
                  type: string
                  description: 'Entity classification type (optional, e.g., SYSTEM, USER). All uppercase letters only.'
              required:
                - value
                - label
                - entity_type_id
            examples:
              example1:
                summary: 'Create Basic Entity (Minimal - Required Fields Only)'
                value:
                  value: en
                  label: English
                  entity_type_id: 4
              example2:
                summary: 'Create Entity with Status'
                value:
                  value: hi
                  label: Hindi
                  entity_type_id: 4
                  status: ACTIVE
              example4:
                summary: 'Create Entity with All Optional Fields'
                value:
                  value: es
                  label: Spanish
                  entity_type_id: 4
                  status: ACTIVE
                  type: USER
      responses:
        '201':
          description: 'Entity created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    description: 'Response code (OK for success)'
                  message:
                    type: string
                    description: 'Response message (ENTITY_CREATED_SUCCESSFULLY)'
                  result:
                    type: object
                    description: 'Created entity object with all fields'
                    properties:
                      id:
                        type: number
                        description: 'Unique entity ID (auto-incremented, numeric)'
                      value:
                        type: string
                        description: 'Entity value (lowercase version of input)'
                      label:
                        type: string
                        description: 'Entity label as provided'
                      status:
                        type: string
                        description: 'Entity status (ACTIVE or INACTIVE)'
                      type:
                        type: string
                        description: 'Entity type classification (SYSTEM, USER, or custom value)'
                      entity_type_id:
                        type: number
                        description: 'Foreign key referencing entity type'
                      organization_code:
                        type: string
                        description: 'Organization code from authentication token'
                      tenant_code:
                        type: string
                        description: 'Tenant code from authentication token'
                      created_by:
                        type: string
                        description: 'User ID who created the entity (from auth token)'
                      updated_by:
                        type: string
                        description: 'User ID who last updated the entity (null initially)'
                      created_at:
                        type: string
                        format: date-time
                        description: 'ISO 8601 timestamp when entity was created'
                      updated_at:
                        type: string
                        format: date-time
                        description: 'ISO 8601 timestamp when entity was last updated'
                      deleted_at:
                        type: string
                        format: date-time
                        description: 'ISO 8601 timestamp when entity was soft-deleted (null if not deleted)'
                  meta:
                    type: object
                    description: 'Metadata object (optional, contains related form versions if applicable)'
                    properties:
                      formsVersion:
                        type: array
                        description: 'Array of form versions associated with entity type'
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                            type:
                              type: string
                            version:
                              type: number
              examples:
                example1:
                  summary: 'Successful Creation Response'
                  value:
                    responseCode: OK
                    message: Entity created successfully
                    result:
                      id: 1
                      value: en
                      label: English
                      status: ACTIVE
                      type: SYSTEM
                      entity_type_id: 1
                      organization_code: 'sot'
                      tenant_code: 'shikshalokam'
                      created_by: '12345'
                      updated_by: null
                      created_at: '2023-07-21T21:46:41.392Z'
                      updated_at: '2023-07-21T21:46:41.392Z'
                      deleted_at: null
                    meta:
                      formsVersion:
                        - id: 3
