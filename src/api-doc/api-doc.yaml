openapi: 3.0.0
info:
  title: Elevate Survey Project Creation Portal Service
  description: |-
    - The Survey Project Creation Portal Service is a centralized service that supports designing of resources.
    - The URL to access the Creation Portal API(s) is `{context}/scp/v1` - <b>Note:</b> These resources can be used in other services.
  contact:
    email: tech-infra@shikshalokam.org
  version: 1.0.0
servers:
  - url: http://localhost:6001
    description: Local server. NB :- port may vary according to the local setup.
  - url: https://scp-dev.elevate-apis.shikshalokam.org/
    description: DEV server
  - url: https://scp-qa.elevate-apis.shikshalokam.org/
    description: QA server
paths:
  /scp/v1/modules/create:
    post:
      tags:
        - Modules
      summary: Creating new modules
      description: "This API is associated with modules\n - Endpoint for creating modules  `/scp/v1/modules/create` \n - It is mandatory to provide values for parameters marked with `required` \n - Mandatory parameter cannot be empty or null.\n - This is an Admin API which will be used by admins."
      parameters:
        - name: X-auth-token
          in: header
          description: 'To make use of the API, you require X-auth-token. This is Available in login API Response.'
          required: true
          style: simple
          explode: false
          schema:
            type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modules_create_body'
            examples:
              example1:
                value:
                  code: projects
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_201'
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Module created successfully
                    result:
                      id: 6
                      code: projects
                      status: ACTIVE
        '400':
          description: Bad request. module already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
              examples:
                example1:
                  value:
                    responseCode: CLIENT_ERROR
                    error: []
                    meta:
                      correlation: 32016da1-8bf1-4157-afad-34508aa609c8
                    message: module already exists
  /scp/v1/modules/update/{id}:
    post:
      tags:
        - Modules
      summary: Update modules by id
      description: "You can use this API to update modules by id\n - The API Endpoint for updating modules `/scp/v1/modules/update` \n - It is mandatory to provide values for parameters that are marked as `required` \n - This is a mandatory parameter and cannot be empty or null.\n - This is an Admin API which will be used by admins."
      parameters:
        - name: X-auth-token
          in: header
          description: 'To use this API, you require an X-auth-token. This is available in the login API Response.'
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: id
          in: path
          description: Module id
          required: true
          style: simple
          explode: false
          schema:
            type: string
          example: 6
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_id_body'
            examples:
              example1:
                value:
                  code: projects
                  status: INACTIVE
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_201_1'
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Module updated successfully
                    result:
                      id: 6
                      code: projects
                      status: INACTIVE
                    meta:
                      correlation: dea5b252-75d2-40ed-a5a7-f8dec087467e
        '400':
          description: Bad Request. Module not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateModule400Response'
  /scp/v1/modules/list:
    get:
      tags:
        - Modules
      summary: Get list of modules
      description: "You can use this API to get a list of modules\n - The API Endpoint for getting a list of modules is `/scp/v1/modules/list` \n - It is mandatory to provide values for parameters marked with `required` \n - Mandatory parameter cannot be empty or null\n - This is an Admin API which will be used by admins."
      parameters:
        - name: X-auth-token
          in: header
          description: You require an X-auth-token to use this API. This token is available in the login API Response.
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: page
          in: query
          description: Please add page number
          required: false
          style: form
          explode: true
          schema:
            type: number
          example: 1
        - name: limit
          in: query
          description: Number of records to limit
          required: false
          style: form
          explode: true
          schema:
            type: number
          example: 2
        - name: search
          in: query
          description: Please search for information such as 'code'.
          required: false
          style: form
          explode: true
          schema:
            type: string
          example: projects
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
              examples:
                example1:
                  value:
                    responseCode: OK
                    message: Module fetched successfully
                    result:
                      data:
                        - id: 6
                          code: projects
                          status: ACTIVE
                        - id: 2
                          code: observation
                          status: ACTIVE
                        - id: 4
                          code: program
                          status: ACTIVE
                        - id: 5
                          code: system
                          status: ACTIVE
                      count: 4
                    meta:
                      correlation: 4cbb42f7-ed92-41a1-b93d-d689121cda08
        '400':
          description: Bad Request. Module Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getModuleList400Response'
