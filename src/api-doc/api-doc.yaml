  /scp/v1/role-permission-mapping/delete:
    post:
      summary: Delete rolePermissionMapping
      tags:
        - Role Permission Mapping
      operationId: deleteRolePermissionMapping
      description: |-
        This API permanently deletes a role-permission mapping, revoking the role's access to specific API endpoints and HTTP methods. Admin-only operation that removes the association between a role and permission, immediately affecting user access control. Used by administrators to manage role-based access control (RBAC) lifecycle and revoke specific permissions from roles.

        **Validations**:
        - Role-permission mapping must exist (combination of role_title and permission_id)
        - role_title must exist in the system
        - permission_id must exist in the system
        - Both role_title and permission_id are required fields
      parameters:
        - name: X-auth-token
          in: header
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          required: true
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Role-permission mapping deletion object with role_title and permission_id'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role_title:
                  type: string
                  pattern: '^[a-zA-Z_-]+$'
                  description: 'Role title to remove from mapping (letters, hyphens, underscores only)'
                  example: 'content_creator'
                permission_id:
                  type: number
                  description: 'Unique permission ID to remove from the role (numeric, must exist in permissions table)'
                  example: 1
                  minimum: 1
              required:
                - role_title
                - permission_id
            examples:
              example1:
                summary: 'Remove Permission from Content Creator Role'
                value:
                  role_title: content_creator
                  permission_id: 1
              example2:
                summary: 'Remove Permission from Reviewer Role'
                value:
                  role_title: reviewer
                  permission_id: 5
      responses:
        '200':
          description: 'Role-permission mapping deleted successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'OK'
                  message:
                    type: string
                    example: 'ROLE_PERMISSION_DELETED_SUCCESSFULLY'
                  result:
                    type: object
                    properties: {}
                  meta:
                    type: object
              examples:
                example1:
                  summary: 'Successful Role-Permission Mapping Deletion'
                  value:
                    responseCode: OK
                    message: Permission delete from the role
                    result: {}
                    meta: {}
        '400':
          description: Bad Request. Role-permission mapping not found or invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createMapping400Response'
  /scp/v1/entity-types/create:
    post:
      summary: Create Entity Type
      tags:
        - Entity Types
      operationId: createEntityType
      description: |-
        This API creates new entity types to categorize and organize different types of entities like languages, regions, or schools. Admin-only operation used during system setup and administration to define organizational structures and data classifications. Entity types enable flexible categorization with validation for uniqueness and format requirements.

        **Validations**:
        - Entity type `value` must be globally unique per organization
        - `value` must contain only letters and underscores (no spaces, lowercase)
        - `label` can contain letters, numbers, and spaces
        - `data_type` must contain only letters and brackets (e.g., STRING, Array[STRING])
        - `depended_on` entity type ID must exist and belong to same organization if provided
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      requestBody:
        description: 'Entity type object with required fields'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  pattern: '^[A-Za-z_]+$'
                  description: 'Unique identifier for the entity type (letters and underscores only, will be converted to lowercase)'
                  example: 'language'
                label:
                  type: string
                  pattern: '^[A-Za-z0-9 ]+$'
                  description: 'Descriptive label for the entity type (letters, numbers, and spaces allowed)'
                  example: 'Languages'
                data_type:
                  type: string
                  pattern: '^[A-Za-z\[\]]+$'
                  description: 'Data type specification (letters and brackets, e.g., STRING, Array[STRING])'
                  example: 'STRING'
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
                  description: 'Entity type status (defaults to ACTIVE if not provided)'
                  example: ACTIVE
                  default: ACTIVE
                is_external:
                  type: boolean
                  description: 'Optional flag to mark entity type as external (stored in config object)'
                  example: false
                depended_on:
                  type: number
                  description: 'Optional ID of another entity type that this type depends on (must exist and belong to same organization)'
                  example: 1
                  minimum: 1
                model:
                  type: string
                  description: 'Optional data model mapping for external integrations'
                  example: 'ExternalModel'
              required:
                - value
                - label
                - data_type
            examples:
              example1:
                summary: 'Create Simple Entity Type'
                value:
                  value: language
                  label: Languages
                  data_type: STRING
                  status: ACTIVE
              example2:
                summary: 'Create External Entity Type'
                value:
                  value: school
                  label: Schools
                  data_type: STRING
                  is_external: true
              example3:
                summary: 'Create Dependent Entity Type'
                value:
                  value: subject
                  label: Subjects
                  data_type: STRING
                  depended_on: 1
      responses:
        '201':
          description: 'Entity type created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: 'OK'
                  message:
                    type: string
                    example: 'ENTITY_TYPE_CREATED_SUCCESSFULLY'
                  result:
                    type: object
                    properties:
                      id:
                        type: number
                        description: 'Unique identifier for the created entity type'
                      value:
                        type: string
                        description: 'Unique identifier (lowercase)'
                      label:
                        type: string
                        description: 'Descriptive label'
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - INACTIVE
                        description: 'Current status of entity type'
                      allow_filtering:
                        type: boolean
                        description: 'Whether filtering is allowed (system-controlled, defaults to false)'
                      data_type:
                        type: string
                        description: 'Data type specification'
                      allow_custom_entities:
                        type: boolean
                        description: 'Whether custom entities can be created (defaults to true)'
                      has_entities:
                        type: boolean
                        description: 'Whether entity type has associated entities (defaults to true)'
                      parent_id:
                        type: number
                        nullable: true
                        description: 'Parent entity type ID if hierarchical (null if not applicable)'
                      config:
                        type: object
                        description: 'Configuration object containing is_external, depended_on, is_dependent metadata'
                      validations:
                        type: object
                        nullable: true
                        description: 'Custom validation rules (null if not defined)'
                      created_by:
                        type: string
                        description: 'User ID who created the entity type'
                      updated_by:
                        type: string
                        nullable: true
                        description: 'User ID who last updated the entity type'
                      organization_code:
                        type: string
                        description: 'Organization code from authentication token'
                      tenant_code:
                        type: string
                        description: 'Tenant code from authentication token'
                      created_at:
                        type: string
                        format: date-time
                        description: 'Timestamp when entity type was created'
                      updated_at:
                        type: string
                        format: date-time
                        description: 'Timestamp when entity type was last updated'
                      deleted_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: 'Soft deletion timestamp (null if not deleted)'
                  meta:
                    type: object
                    description: 'Response metadata'
              examples:
                example1:
                  summary: 'Successful Entity Type Creation'
                  value:
                    responseCode: OK
                    message: Entity type created successfully
                    result:
                      id: 1
                      value: language
                      label: Languages
                      status: ACTIVE
                      allow_filtering: false
                      data_type: STRING
                      allow_custom_entities: true
                      has_entities: true
                      parent_id: null
                      config: {}
                      validations: null
                      created_by: '123'
                      updated_by: null
                      organization_code: 'sot'
                      tenant_code: 'shikshalokam'
                      created_at: '2023-09-22T12:40:19.817Z'
                      updated_at: '2023-09-22T12:40:19.817Z'
                      deleted_at: null
                    meta: {}
        '400':
          description: Bad Request. Entity type already exists or invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createUserEntity400Response'
  '/scp/v1/entity-types/update/{id}':
    post:
      summary: Update Entity Type
      tags:
        - Entity Types
      operationId: updateEntityType
      description: |-
        This API modifies existing entity type configurations to update properties like value, label, status, and dependencies. Admin-only operation used during system maintenance and administration to evolve entity type definitions as organizational needs change. Changes take effect immediately with validation for uniqueness and format requirements.

        **Validations**:
        - Entity type ID must exist in the system
        - Updated `value` must remain unique per organization if changed
        - `value` must contain only letters and underscores (no spaces, lowercase)
        - `label` can contain letters, numbers, and spaces
        - `data_type` must contain only letters and brackets (e.g., STRING, Array[STRING])
        - `data_type` is mandatory and must be provided in update
        - `status` must be either ACTIVE or INACTIVE
        - `depended_on` entity type ID must exist and belong to same organization if provided
      parameters:
        - name: X-auth-token
          in: header
          required: true
          description: 'Authentication token from login API response. Token must belong to a user with admin or org_admin role.'
          schema:
            type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        - name: id
          in: path
          description: 'Valid entity type ID to update (numeric, positive integer, 1 to 2147483647)'
